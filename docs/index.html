|Magna Carta}} as the title deed (whatever the document actually said). It was real, rowdy, and lived daily; it was also liberty under oligarchy, compatible with the Bloody Code, the Test Acts, and the slave ships clearing Liverpool. When the French later proclaimed the Rights of Man, the English answer was, in effect: we prefer the rights of Englishmen — we have had them longer, and they work.`},{t:`p`,x:`The system’s severest test came not from Paris but from across the Atlantic, where colonists raised on the same rights of Englishmen concluded that {{parliament|Parliament}} itself had turned tyrant. That quarrel — a civil war within the English world — is the next chapter.`}]},{id:`ch09`,part:4,number:`9`,title:`The Rise and Fall of the Atlantic Nation`,era:`c.1600–1783`,blurb:`How the English built a first empire across the Atlantic — on settlement, trade, and slave-grown sugar — won it decisively from France in 1759, and lost its heart at Yorktown a generation later. The surprise, Tombs argues, is how little the fall hurt.`,blocks:[{t:`p`,x:`While the last chapters stayed at home, the English had been spilling outward. From the early 1600s, ships left for Virginia, Massachusetts, Barbados, and Bengal, and by the mid-eighteenth century an Atlantic world existed that thought of itself, loosely, as one nation: English-speaking, Protestant, free-trading, and quarrelsome. This chapter follows that nation up to its zenith in 1759 and then watches it break apart — and asks why the break mattered so much less than everyone expected.`},{t:`h`,x:`Planting an empire`},{t:`p`,x:`The first empire was not planned; it accreted. Merchants chartered the {{east-india-company|East India Company}} in 1600 to trade for spices and ended up trading cotton and tea from Indian coastal forts. Adventurers planted Virginia (1607) for profit and nearly starved; {{puritans|Puritans}} planted New England (from 1620) for God and multiplied astonishingly. By the 1760s the {{thirteen-colonies|thirteen mainland colonies}} held over two million people — better fed, more literate, and lightly taxed compared with anyone in Europe — running their own assemblies and thinking of themselves as free-born Englishmen overseas.`},{t:`p`,x:`But the empire’s economic heart was farther south, and darker. The sugar islands — Barbados, then Jamaica — were the richest places in the English world, and they ran on {{atlantic-slavery|slavery}}. British ships carried roughly three million Africans across the Atlantic before the trade was banned, more than any other nation in the eighteenth century; conditions on the plantations were lethal enough that the islands consumed people faster than they were born. The profits were not marginal: sugar, tobacco, and the slave trade enriched Bristol and Liverpool, financed country houses, and fed the customs revenue of the {{fiscal-military-state|fiscal-military state}}. Yet in these same years the counter-movement stirred: Quakers refused to hold slaves, Somerset’s case (1772) declared England’s own air too free for the master’s whip, and by the 1780s organized {{abolitionism|abolitionism}} was becoming, remarkably, a mass movement. Tombs is blunt on both points: the crime was enormous, and the campaign against it began at home.`},{t:`reading`,title:`Did slave money build the Industrial Revolution?`,blocks:[{t:`p`,x:`In 1944 the Trinidadian historian Eric Williams argued that profits from {{atlantic-slavery|slavery}} capitalized Britain's {{industrial-revolution|industrialization}} — a thesis still fought over. Sceptics reply that the slave economy, for all its cruelty and visibility, was a modest slice of national investment, and that industrialization ran on domestic coal, agriculture, and savings. Recent work lands in between: slavery's gains were larger and more widely spread through ports, banks, and insurance than the sceptics allowed, but no serious estimate makes them the engine of the whole transformation.`},{t:`p`,x:`Tombs' own position is characteristic: state the crime plainly, refuse the single-cause story, and note the sequel — the same commercial society that ran the trade produced, within a generation, the {{abolitionism|world's first mass campaign}} to destroy it. Both facts belong in the ledger.`}]},{t:`h`,x:`Beating France: 1759`},{t:`p`,x:`Empire meant war with France — five wars between 1689 and 1783, fought from Flanders to the Ohio valley to the Carnatic. The decisive round was the Seven Years War (1756–63), which William Pitt the Elder ran as a global war on borrowed money: subsidize allies in Europe, and let the {{royal-navy|Royal Navy}} and small expeditionary forces strip France of its empire. 1759 was the *annus mirabilis*, the "year of victories": Minden in Germany, Wolfe’s capture of Quebec, and the fleet actions at Lagos and Quiberon Bay that broke French sea power. Church bells, Horace Walpole joked, were worn threadbare with ringing. In 1763 Britain kept Canada and dominated India through the {{east-india-company|Company}}, now a territorial power after Plassey (1757). The Atlantic nation stood at its peak — for about twelve years.`},{t:`h`,x:`The quarrel over English rights`},{t:`p`,x:`Victory carried the seed of the fall. The war had doubled the {{national-debt|national debt}}, and the colonies it had been fought to protect paid almost nothing toward it. When {{parliament|Parliament}} tried modest remedies — the Stamp Act (1765), the tea duty — colonists answered with an impeccably English argument: no taxation without representation, the cry of 1640 replayed. Tombs presents the {{american-revolution|American Revolution}} as an English civil war fought over English rights: both sides quoted the same lawyers, claimed the same {{magna-carta|ancestral liberties}}, and accused the other of betraying the constitution of 1688. Roughly a fifth of colonists stayed loyal to the crown, and tens of thousands left as refugees when it was over.`},{t:`p`,x:`What turned rebellion into defeat was France. After Saratoga (1777), the Bourbon powers joined in, and Britain faced a world war with no allies — fighting in America while defending Gibraltar, the Caribbean, and India. In 1781 a French fleet briefly held Chesapeake Bay, and Cornwallis surrendered an army at Yorktown. The government fell; the Peace of Paris (1783) recognized the United States. The first empire had lost its most populous, most English part.`},{t:`timeline`,title:`An empire gained and lost`,events:[{year:`1600`,label:`{{east-india-company|East India Company}} chartered`,detail:`A merchants’ venture that will end up ruling a subcontinent.`},{year:`1607`,label:`Jamestown founded`,detail:`The first lasting English colony in America — for profit, not piety.`},{year:`1655`,label:`Jamaica seized`,detail:`Cromwell’s consolation prize becomes the hub of the {{atlantic-slavery|slave-sugar}} economy.`},{year:`1757`,label:`Plassey`,detail:`Clive’s victory makes the {{east-india-company|Company}} the power behind the throne in Bengal.`},{year:`1759`,label:`The year of victories`,detail:`Quebec, Minden, Quiberon Bay: France beaten on three continents.`},{year:`1765`,label:`Stamp Act`,detail:`Parliament taxes the colonies directly; the colonies answer with 1640s slogans.`},{year:`1776`,label:`Declaration of Independence`,detail:`The {{thirteen-colonies|thirteen colonies}} secede — an English argument turned against England.`},{year:`1781`,label:`Yorktown`,detail:`French sea power traps Cornwallis; the war in America is effectively over.`},{year:`1783`,label:`Peace of Paris`,detail:`Britain recognizes the United States — and starts trading with it at once.`}]},{t:`argument`,x:`The fall of the Atlantic nation, Tombs argues, is most instructive for how little it broke. Prophets on all sides expected national ruin; instead, trade with independent America boomed past its colonial levels within a decade, the {{fiscal-military-state|fiscal-military state}} absorbed the debt and rebuilt the fleet, and Britain entered the next French war stronger than the last. The episode cuts two ways: it shows empire was contingent — a thing assembled by accident and detachable without collapse — and it shows the underlying machine of credit, navy, and taxes was the real national asset. The colonies were lost; the system that had won them was not.`},{t:`p`,x:`So the story pivots east and inward at once. The {{east-india-company|Company}}’s territories in Bengal were becoming a second empire, acquired while the first was falling. And at home, in the same decades, men like Arkwright and Watt were setting machines to spin and steam to pump — the beginnings of the {{industrial-revolution|Industrial Revolution}} that would change England more than any empire. Both stories are coming.`}]},{id:`ch10`,part:4,number:`10`,title:`The First Industrial Nation`,era:`c.1760–c.1850`,blurb:`Somewhere around 1780, in the sheds and valleys of the English north, the oldest constraint on human life — muscle power — began to give way. The {{industrial-revolution|Industrial Revolution}} happened first in England, and Tombs asks the awkward questions: why here, who paid the price, and what did a freak century of supremacy do to the English mind?`,blocks:[{t:`p`,x:`No government planned it. No philosopher predicted it. Yet between roughly 1760 and 1850 England became the first society in history to escape the trap that had bound every civilization before it: the limit set by land, wood, wind, and muscle. The {{industrial-revolution|Industrial Revolution}} is the hinge of Tombs' whole book — the moment a middling offshore kingdom acquired, almost absent-mindedly, powers no state had ever held. Contemporaries barely noticed at first. The word "industrial revolution" itself came later, from the French, who watched it the way people watch a neighbour's house catch fire.`},{t:`h`,x:`Cotton, coal, iron, steam`},{t:`p`,x:`The change ran on four things. Cotton came first: spinning machines — Hargreaves' jenny, Arkwright's water frame, Crompton's mule — multiplied one worker's output hundreds of times, and Lancashire mills clothed the world in cheap cloth. Coal freed England from the forest; by 1850 it dug more than the rest of the world combined. Iron, smelted with coke instead of charcoal, gave bridges, rails, and machines. And steam — Watt's improved engine from the 1770s — turned coal into motion, so that a factory no longer needed a river and a mine no longer drowned. None of these was a single stroke of genius. Each was a chain of small fixes by practical men: millwrights, clockmakers, instrument makers, ironmasters. Tinkering, not theory.`},{t:`h`,x:`Canals, then railways`},{t:`p`,x:`Heavy goods move badly on mud roads, so England first webbed itself with canals — hand-dug, privately financed, halving the price of coal wherever they reached. Then came the leap. In 1829 Stephenson's *Rocket* won the Rainhill trials, and the next year the Liverpool and Manchester line opened: the first passenger railway worked entirely by steam. The 1840s brought railway mania — thousands of miles authorized in a speculative frenzy that ruined many investors and equipped the nation anyway. Railways compressed England: fresh food in the cities, cheap travel for millions, national newspapers by morning, and, from 1847, a single "railway time" in place of the old local noons.`},{t:`timeline`,title:`The take-off`,events:[{year:`1769`,label:`Watt patents his steam engine`,detail:`A separate condenser makes steam power efficient enough to leave the mineshaft.`},{year:`1771`,label:`Arkwright opens Cromford mill`,detail:`Water-powered spinning under one roof: the factory system in embryo.`},{year:`1779`,label:`The Iron Bridge rises`,detail:`The world's first iron bridge, at Coalbrookdale — a boast in metal.`},{year:`1829`,label:`The *Rocket* wins at Rainhill`,detail:`Stephenson's locomotive proves steam can haul people fast and reliably.`},{year:`1830`,label:`Liverpool–Manchester railway opens`,detail:`The modern railway is born; a cabinet minister is run over on opening day.`},{year:`1840s`,label:`Railway mania`,detail:`A speculative bubble lays thousands of miles of track and wires the nation together.`},{year:`1851`,label:`The Great Exhibition`,detail:`Six million visitors — many arriving on cheap excursion trains — see the workshop of the world on display in the Crystal Palace.`}]},{t:`h`,x:`Why England first?`},{t:`p`,x:`The oldest question in economic history has no settled answer, and Tombs lays out the contenders rather than crowning one. One school points to prices: English wages were high and English coal was cheap, so machines that swapped fuel for labour paid for themselves in Lancashire when they would not in Languedoc. Another points to institutions: secure property, patent law, a {{parliament|Parliament}} of investors, no internal customs barriers. A third points to culture — that artisan world of dissenting academies, provincial societies, and workshop tinkering. And a fourth points outward: {{british-empire|empire}} and the {{royal-navy|Navy}} held open the markets, from American cotton fields to Indian customers, that made mass production worth attempting. Probably the honest answer is: all of these, tangled together, on one island.`},{t:`reading`,title:`The standard-of-living debate`,blocks:[{t:`p`,x:`Did industrialization make ordinary people better off? This is the longest-running fight in English economic history. Pessimists — from contemporary radicals to later historians like E. P. Thompson — point to slum housing, foul air, child labour, and the misery of handloom weavers whose trade the machines destroyed. Optimists reply with the numbers: real wages, roughly flat before 1820, clearly rising after about 1840, and a population that doubled without famine — something pre-industrial England could never have done.`},{t:`p`,x:`The truce most historians now accept: the first two generations gained little and lost much that was hard to measure — clean air, open space, control of their own time — while their grandchildren gained enormously. Tombs leans mildly optimist, but insists the question stay open: both sides are describing things that really happened, often in the same town.`}]},{t:`h`,x:`The people multiply`},{t:`p`,x:`Alongside the machines ran a quieter revolution: people. England's population had crawled for centuries; now it exploded — earlier marriage, more work for the young, better food. And the new people went to the towns. The census of 1851 recorded something no census anywhere had ever shown: a majority of the population living in towns and cities. Manchester, Leeds, and Birmingham had grown from market towns into smoke-hung giants within living memory, and {{london|London}} was the largest city on earth. The same year, the Great Exhibition put the results under glass: machines, manufactures, and six million visitors filing through a palace of iron and glass in Hyde Park.`},{t:`chart`,kind:`line`,title:`Population of England`,unit:`millions`,xLabel:`year`,series:[{name:`England`,points:[{x:1751,y:5.9},{x:1801,y:8.3},{x:1851,y:16.9},{x:1901,y:30.5}]}],note:`Figures are approximate; the 1751 estimate predates the first census (1801).`},{t:`argument`,x:`Tombs argues the take-off was gradual, homegrown, and unplanned — the work of obscure practical men, not statesmen or systems. Its deepest legacy was mental. For about a century England enjoyed a supremacy no nation had ever held, a freak of timing that the English came to mistake for the natural order of things. When other nations inevitably caught up, the return to normality felt like failure — and {{declinism|declinism}}, the conviction that something had gone deeply wrong with England, was born from a misreading of what the good years had been.`},{t:`p`,x:`But the machines did not run in a quiet world. The same decades that built the mills saw England locked in the longest war in its modern history, against an idea as much as an army. That war is the next chapter.`}]},{id:`ch11`,part:4,number:`11`,title:`Wars of Dreams`,era:`1789–1815`,blurb:`For twenty-two years, with one short truce, England fought revolutionary and Napoleonic France — a war Tombs calls a war of dreams, because it was fought over what the world should be. Out of it came Nelson, {{wellington|Wellington}}, the income tax, and a national identity built on standing against utopia.`,blocks:[{t:`p`,x:`When the Bastille fell in 1789, many in England cheered. The French, it seemed, were catching up — getting themselves a constitution, curbing an absolute king, doing in a summer what England had done in 1688. Charles James Fox called it the greatest and best event in history. Within four years England and France were at war, and stayed at war, with one brief pause, until 1815. It became the longest and costliest conflict England had fought since the {{hundred-years-war|Hundred Years' War}} — and, Tombs argues, the most ideological. Both sides believed they were fighting for the future of mankind.`},{t:`h`,x:`Burke against Paine`},{t:`p`,x:`Before the armies moved, the pamphlets did. Edmund Burke's *Reflections on the Revolution in France* (1790) predicted, while the Revolution was still moderate, that it would end in confiscation, terror, and a military dictator — because it tried to rebuild society from abstract first principles instead of inherited experience. Tom Paine's *Rights of Man* (1791) answered that the dead have no authority over the living, and that hereditary government was as absurd as a hereditary mathematician. Paine outsold Burke many times over; Burke turned out to be right about the Terror and the general. Between them they framed a debate — cautious inheritance against rational blueprint — that has organized English conservatism and English radicalism ever since.`},{t:`reading`,title:`The repression of the 1790s`,blocks:[{t:`p`,x:`Pitt's government took the threat of home-grown revolution seriously — too seriously, most historians think. Habeas corpus was suspended, "seditious meetings" banned, radical societies infiltrated by spies, and the Combination Acts of 1799–1800 outlawed workers' associations. Yet the crackdown was harsher in ambition than in result. The great treason trials of 1794 collapsed when London juries acquitted the radicals Thomas Hardy and John Horne Tooke — English juries would not hang men for holding meetings. Tombs notes the contrast with the guillotine across the Channel: England's counter-revolution was real, but it worked through courts it did not fully control, and it mostly failed to convict.`}]},{t:`h`,x:`The nation in arms`},{t:`p`,x:`From 1798 and again in 1803–5, Napoleon massed an army at Boulogne and England expected invasion. The response astonished the government: hundreds of thousands of men — perhaps one in five of military age — volunteered for home defence, drilling on village greens with pikes and fowling pieces. Loyalist songs, caricatures of "Boney", and the cult of the {{royal-navy|Navy}} made this the first war of mass popular patriotism. It was not simple deference. Many volunteers despised their own government; they simply had no wish to be liberated by France.`},{t:`p`,x:`The invasion never sailed, because the sea was closed. At {{trafalgar|Trafalgar}} in October 1805 Nelson destroyed the combined French and Spanish fleets and died doing it, giving England a naval supremacy that lasted a century. Napoleon answered with economic war — the Continental System, an attempt to bankrupt the "nation of shopkeepers" by closing Europe's ports to its trade. It hurt, but it hurt Europe more, and smuggling made a mockery of it. Meanwhile {{wellington|Wellington}} ground down French armies in Portugal and Spain, proof that the Empire could bleed. After Napoleon destroyed his own army in Russia, the allies closed in; the end came at {{waterloo|Waterloo}} in June 1815, a battle Wellington called the nearest-run thing he ever saw.`},{t:`voice`,source:`Nelson's flagship signal before Trafalgar, 21 October 1805 — and his last recorded words`,x:`"England expects that every man will do his duty." Dying below decks that afternoon, shot through the spine with the battle won, he returned to the word: "Thank God I have done my duty." The sentence and the man became the pattern of English heroism for a century.`},{t:`timeline`,title:`The long war`,events:[{year:`1789`,label:`The Bastille falls`,detail:`English opinion splits: liberation to some, warning to others.`},{year:`1790–91`,label:`Burke v. Paine`,detail:`*Reflections* against *Rights of Man*: the argument that outlived the war.`},{year:`1793`,label:`War with France`,detail:`Revolutionary France, having executed its king, declares war on Britain.`},{year:`1798`,label:`Income tax invented`,detail:`Pitt taxes incomes directly to fund the war — a temporary measure, naturally.`},{year:`1805`,label:`{{trafalgar|Trafalgar}}`,detail:`Nelson annihilates the Franco-Spanish fleet; invasion becomes impossible.`},{year:`1808`,label:`The Peninsular War begins`,detail:`{{wellington|Wellington}} opens the "Spanish ulcer" that drains Napoleon for six years.`},{year:`1812`,label:`Napoleon invades Russia`,detail:`The Grande Armée freezes; the tide turns for good.`},{year:`1815`,label:`{{waterloo|Waterloo}}`,detail:`Wellington and Blücher end the adventure; Napoleon goes to St Helena.`}]},{t:`h`,x:`Paying for it`},{t:`p`,x:`England won partly because it could outspend everyone. The {{fiscal-military-state|fiscal-military state}} built after 1688 now showed its full power: the {{national-debt|national debt}} swelled to over twice national income, yet the {{bank-of-england|Bank of England}} kept lending and investors kept buying, because Parliament's promises were believed. In 1798 Pitt added something new — the first income tax, ten per cent on large incomes, sold as a temporary wartime expedient. It paid for subsidies that kept allied armies in the field: England hired much of Europe to fight. Napoleon controlled more land; London controlled more credit. Credit won.`},{t:`argument`,x:`Tombs calls these the "wars of dreams": both sides fought for a vision, not a province. France offered Europe a rational new order at bayonet-point; England stood for the unglamorous alternative — inherited law, parliaments, commerce, and muddling through. Victory fixed that self-image in place. The English came out of 1815 convinced that they were the pragmatic, free, counter-revolutionary nation, providentially exempt from continental follies — and with the {{royal-navy|Navy}} unchallenged, a century of {{pax-britannica|Pax Britannica}} lay ahead in which nobody could tell them otherwise.`},{t:`p`,x:`But the fireworks of 1815 lit up a hungry country. Demobilized soldiers, collapsing wartime prices, and a Parliament of landlords protecting the price of bread: the peace opened with distress, and distress opened the age the next chapter calls Dickensian.`}]},{id:`ch12`,part:5,number:`12`,title:`Dickensian England`,era:`c.1815–c.1850`,blurb:`Workhouses, slums, factory children, cholera — the England of Dickens' novels was real. So, Tombs insists, was the other England of the same years: inspectors, reformers, statisticians, and self-organizing citizens fixing abuses faster than any society before them. This chapter asks why we remember the horror and forget the repair.`,blocks:[{t:`p`,x:`Peace brought no plenty. After {{waterloo|Waterloo}}, wartime demand collapsed, soldiers came home to no work, and Parliament — a house of landowners — passed the {{corn-laws|Corn Laws}} of 1815 to keep grain prices, and therefore rents, high. Cheap bread was made illegal to protect the men who made the law. The next thirty-five years were the most turbulent of modern English history: mass meetings, riots, near-revolution in 1831, and the largest working-class movement the world had yet seen. They were also, and this is Tombs' point, the years in which England invented modern reform.`},{t:`h`,x:`Distress and protest`},{t:`p`,x:`In August 1819, some 60,000 people gathered peacefully on St Peter's Field in Manchester to demand the vote. Local yeomanry charged the crowd with sabres; around fifteen died and hundreds were injured. The radicals' bitter joke — "Peterloo" — stuck, and the massacre became a founding memory of English radicalism. A decade later distress moved to the countryside: in 1830 the "Captain Swing" riots swept the southern counties, farm labourers smashing the threshing machines that took their winter work. The government hanged a few and transported hundreds. The grievances remained.`},{t:`h`,x:`The Reform crisis`},{t:`p`,x:`The old electoral map was indefensible: Manchester had no MP while abandoned hamlets — "rotten boroughs" — returned two. In 1831–32 the Lords' refusal to pass reform brought the country as close to revolution as it has come in modern times: Bristol burned for three days, political unions drilled, and there was a run on the banks. The {{great-reform-act|Great Reform Act}} of 1832 passed only when the king agreed, if needed, to create enough new peers to swamp the Lords. The Act itself was modest — it enfranchised the propertied middle class, about one adult man in five — but the precedent was everything: the constitution could be changed under pressure, peacefully, by Parliament itself. The safety valve worked, and England never needed a barricade.`},{t:`h`,x:`The two Englands of the Blue Books`},{t:`p`,x:`The industrial city horrified those who looked closely. Cholera arrived in 1831 and kept returning through the water supply; in the worst slum districts of Manchester and Liverpool, life expectancy fell into the twenties; small children tended machines twelve hours a day. This is {{dickensian-england|Dickensian England}}, and Dickens did not have to invent it. The New Poor Law of 1834 added a cruelty of design: relief only inside the workhouse, and the workhouse made deliberately grim — "less eligible" than the meanest labour outside — to deter the poor from asking. *Oliver Twist* made the workhouse immortal.`},{t:`p`,x:`But the same society that produced the abuses produced the machinery that exposed and corrected them. Royal commissions filled the parliamentary "Blue Books" with sworn evidence; the Factory Act of 1833 limited children's hours and — the real novelty — appointed paid inspectors to enforce it; Chadwick's sanitary report of 1842 shamed Parliament into the first Public Health Act in 1848. Statistical societies counted, journalists publicized, Nonconformist congregations and municipal reformers organized. No previous society had ever audited its own failures so relentlessly, or fixed them so fast.`},{t:`reading`,title:`Chartism: the vote as cure-all`,blocks:[{t:`p`,x:`For those left out in 1832, the answer was the People's Charter of 1838: six demands, headed by a vote for every man and salaried MPs, so that workers could sit in Parliament. {{chartism|Chartism}} became the first mass working-class political movement anywhere — millions signed its petitions, and its great meetings frightened respectable England badly. Parliament rejected the petitions of 1839, 1842, and 1848, and after the damp squib of the last great rally on Kennington Common, the movement faded.`},{t:`p`,x:`Failure, though, is the wrong word. Chartism trained a generation of working-class organizers, and five of its six demands eventually became law. Tombs stresses its character: overwhelmingly constitutional, petitioning Parliament rather than plotting against it — an insurrectionary fringe notwithstanding. Even at their angriest, English radicals wanted in, not over.`}]},{t:`h`,x:`Free trade and famine`},{t:`p`,x:`The symbolic battle of the age was over bread. The Anti-Corn Law League — middle-class, Nonconformist, superbly organized — made cheap bread a moral crusade against aristocratic privilege. In 1846 the Tory prime minister Robert Peel, persuaded and pressed by the catastrophe then unfolding in Ireland, repealed the {{corn-laws|Corn Laws}} and split his party for a generation. {{free-trade|Free trade}} became more than a policy: for the Victorians it was a creed — cheap food, peace through commerce, and government that took sides with the consumer. The {{irish-famine|Irish famine}} itself, which killed around a million people within the United Kingdom while relief came too little and too laced with dogma, remained the darkest stain on the era — and repeal did almost nothing to stop it.`},{t:`widget`,id:`corn-law-explorer`},{t:`timeline`,title:`Protest and repair`,events:[{year:`1815`,label:`{{corn-laws|Corn Laws}} passed`,detail:`Parliament protects grain prices; bread stays dear.`},{year:`1819`,label:`Peterloo`,detail:`Yeomanry sabre a peaceful reform meeting in Manchester; radicalism gains its martyrs.`},{year:`1830`,label:`Captain Swing`,detail:`Farm labourers smash threshing machines across the south.`},{year:`1832`,label:`{{great-reform-act|Great Reform Act}}`,detail:`Rotten boroughs abolished; the middle class enters the constitution.`},{year:`1834`,label:`New Poor Law`,detail:`The workhouse system: relief made deliberately harsher than work.`},{year:`1838`,label:`The People's Charter`,detail:`{{chartism|Chartism}} demands the vote for every man.`},{year:`1842`,label:`Chadwick's sanitary report`,detail:`The Blue Book that mapped filth and death, street by street.`},{year:`1846`,label:`{{corn-laws|Corn Law}} repeal`,detail:`Peel chooses cheap bread over his party; {{free-trade|free trade}} triumphs.`},{year:`1848`,label:`Chartism's last rally; Public Health Act`,detail:`The revolution that never came, and the reform that quietly did.`}]},{t:`argument`,x:`Tombs argues that "Dickensian England" is half the truth, and the half we chose to keep. The horrors were real, but they were medieval horrors — hunger, filth, child labour — made suddenly visible by concentration in cities and by a society that had begun counting them. What was new was not the misery but the response: inspection, publication, agitation, legislation, repeal. Dickens' caricatures became the permanent memory of the age; the Blue Books' patient improvements did not. We remember Oliver Twist's workhouse and forget the inspectors who closed its worst abuses within a generation.`},{t:`p`,x:`By 1851, with the Crystal Palace glittering in Hyde Park and railway excursions bringing the millions to see it, the storms seemed over. The next chapter enters the long Victorian afternoon — calmer, richer, and quietly certain of itself.`}]},{id:`ch13`,part:5,number:`13`,title:`Victorian England`,era:`c.1850–1901`,blurb:`The high Victorian age: prosperous, pious, self-improving, and governed less by the state than by chapel, club, and conscience. Tombs paints a society that ran itself through voluntary institutions and moral consensus — and that was already, almost unnoticed, losing the industrial lead it thought was its birthright.`,blocks:[{t:`p`,x:`After the storms of the 1840s came an unexpected calm. Historians call the 1850s and 1860s the "age of equipoise": wages rising, {{free-trade|free trade}} delivering cheap food, {{chartism|Chartism}} dissolved into friendly societies and savings banks, and a general feeling — smug, but not baseless — that England had solved problems that still convulsed the continent. Tombs' Victorian England is not the buttoned-up joke of later mockery. It is one of the most energetic, generous, and self-organizing societies ever described, and this chapter is his case for taking it seriously.`},{t:`h`,x:`Respectability and self-help`},{t:`p`,x:`{{victorian-values|Victorian values}} began at home: respectability, thrift, sobriety, self-improvement. Samuel Smiles' *Self-Help* (1859) was the age's bestselling sermon, and its congregation was as much working-class as middle-class — the skilled artisan with his savings account, his mechanics' institute, and his Sunday suit. Religion supplied the engine. Church and chapel between them built schools, missions, temperance societies, and charities on a scale no state matched; the Nonconformist conscience made politics a branch of morality. Yet doubt was gnawing. Darwin's *Origin of Species* (1859) and the new biblical criticism unsettled educated believers, and the census of 1851 had already shocked the pious by showing that barely half the population attended worship at all. Victorian faith was loud partly because it was worried.`},{t:`h`,x:`Gladstone against Disraeli`},{t:`p`,x:`Politics became national theatre, with two unmatched leading men. {{gladstone|Gladstone}} — Liberal, devout, volcanic — treated budgets as moral documents and turned mass audiences into congregations; his Midlothian campaign of 1879–80 invented modern electioneering. {{disraeli|Disraeli}} — Conservative, exotic, ironic — answered with imagination: Tory democracy, social reform from above, and empire as national romance, crowning {{victoria|Victoria}} Empress of India in 1876. Their mutual loathing was genuine and the country loved it. Between them they schooled the new electorate in the habit that most impressed foreign observers: fighting deadly political battles entirely inside the rules.`},{t:`h`,x:`Leaping in the dark: reform`},{t:`p`,x:`The franchise question, parked since 1832, returned in the 1860s. In 1867 it was Disraeli, outbidding the Liberals for the credit, who carried the {{second-reform-act|Second Reform Act}} — a "leap in the dark" that gave the vote to urban working men and roughly doubled the electorate. Gladstone's act of 1884 extended the same right to the counties, making working men the majority of voters. Reform pulled consequences behind it: the secret ballot in 1872, state elementary schools from 1870 (Forster's Act, filling the gaps in the church networks), and legal status for {{trade-unions|trade unions}} in the 1870s. The English constitution democratized itself piecemeal, without a written plan and without a shot.`},{t:`widget`,id:`franchise-expansion`},{t:`timeline`,title:`The Victorian half-century`,events:[{year:`1851`,label:`The Great Exhibition`,detail:`The workshop of the world on display; the census the same year finds a majority living in towns.`},{year:`1859`,label:`Darwin and Smiles publish`,detail:`*On the Origin of Species* and *Self-Help* — doubt and self-improvement, the era's twin currents, in one year.`},{year:`1867`,label:`{{second-reform-act|Second Reform Act}}`,detail:`Disraeli's leap in the dark enfranchises urban working men.`},{year:`1870`,label:`Forster's Education Act`,detail:`Board schools bring elementary education within reach of every child.`},{year:`1872`,label:`Secret ballot`,detail:`Voting stops being a public performance owed to one's landlord.`},{year:`1876`,label:`Victoria becomes Empress of India`,detail:`{{disraeli|Disraeli}} wraps the monarchy in imperial purple.`},{year:`1884`,label:`Third Reform Act`,detail:`{{gladstone|Gladstone}} extends the household franchise to the counties.`},{year:`1897`,label:`Diamond Jubilee`,detail:`The apparent zenith: {{victoria|Victoria}} reviews an empire covering a quarter of the earth.`},{year:`1901`,label:`The Queen dies`,detail:`After sixty-three years, an age gets its name and its ending.`}]},{t:`h`,x:`Government by town hall and committee`},{t:`p`,x:`Whitehall stayed small; the action was local and voluntary. Joseph Chamberlain's Birmingham showed what "gas-and-water" municipal energy could do — buying the utilities, clearing slums, building libraries, parks, and galleries, and calling it civic gospel. Everywhere else, hospitals, schools, orphanages, and burial clubs ran on subscription and volunteered time. The monarchy found its niche in this moral order: {{victoria|Victoria}}, withdrawn after Albert's death in 1861 and briefly unpopular for it, was reinvented by the jubilees of 1887 and 1897 as the empire's grandmother — a monarchy of symbol and ceremony, standing carefully above politics.`},{t:`reading`,title:`1890s: the birth of declinism`,blocks:[{t:`p`,x:`Even at the Diamond Jubilee, the numbers had turned. Germany and the United States were out-producing England in steel; German chemicals and electrical engineering — the new industries — led the world; "Made in Germany" became a scare-phrase in the London press in 1896. The relative decline was arithmetic certainty: a small island could not out-produce continents forever, and its share of world manufacturing had been a freak of being first.`},{t:`p`,x:`What mattered, Tombs argues, was the interpretation. Instead of reading the change as normality returning, the English read it as failure — and went hunting for culprits: amateurish schooling, gentlemanly disdain for trade, complacent industry. {{declinism|Declinism}}, born in the 1890s, became a permanent national habit of mind, outlasting every revival and colouring English self-understanding for the next century.`}]},{t:`argument`,x:`Tombs' claim is that Victorian England governed itself through voluntary institutions and moral consensus more than through the state. Chapel and church, unions and friendly societies, town halls and charities did work that elsewhere fell to bureaucracies and police — which is why so small a state could preside over so orderly a society. The same self-confidence blinded it to the quiet loss of its industrial lead; and when the loss was noticed, the Victorians' heirs mistook the end of a freak supremacy for national failure.`},{t:`p`,x:`The old Queen died in January 1901 with her empire at its widest and her country subtly less sure of itself than the jubilee crowds suggested. What that empire actually was — and what it did to the English — is the next chapter's question.`}]},{id:`ch14`,part:5,number:`14`,title:`Imperial England`,era:`1815–1918`,blurb:`The century when a quarter of the world map turned pink. Settler colonies, the Raj, the scramble for Africa, and Ireland in revolt — and Tombs' awkward question: how much did any of it really matter to the English at home?`,blocks:[{t:`p`,x:`After Waterloo, Britain was the only world power. The {{royal-navy|Royal Navy}} policed the oceans, the {{city-of-london|City of London}} financed the planet, and the {{british-empire|empire}} grew decade by decade until it covered roughly a quarter of the earth and its people. This chapter tells that story — but Tombs tells it against the grain. His question is not how the empire was won but how lightly it sat on the country that supposedly lived for it.`},{t:`argument`,x:`Tombs argues — and this is one of his most contested claims — that the empire loomed smaller in ordinary English life than either imperial nostalgists or postcolonial critics assume. It was acquired piecemeal, run on the cheap by a few thousand officials, and regarded with chronic doubt at home. England, he insists, was always more absorbed in itself and in Europe than in its distant possessions. Many historians think he understates how deeply empire shaped English wealth, culture, and self-regard; he presents the counter-case, and the reader should hold both.`},{t:`h`,x:`The pink map`},{t:`p`,x:`The empire was really several empires. The settler colonies — Canada, Australia, New Zealand, the Cape — filled up with emigrants (millions left Britain and Ireland across the century) and were handed self-government early; by 1914 they were dominions in all but sovereignty, tied to Britain by trade, sentiment, and family letters. India was different: first the private domain of the {{east-india-company|East India Company}}, then, after the shock of the {{indian-rebellion|Indian Rebellion}} of 1857, ruled directly by the Crown as the {{british-raj|Raj}}. {{disraeli|Disraeli}} made {{victoria|Victoria}} Empress of India in 1876 — pageantry deliberately laid on thick, because the underlying facts were thin: a few thousand British civil servants and officers governing some 300 million people, mostly through Indian intermediaries and an Indian-funded army.`},{t:`p`,x:`The 1880s brought the scramble for Africa: Egypt occupied in 1882 almost by accident, then vast tracts claimed inland, often to forestall France or Germany rather than from any plan. The public consumed it as theatre. General Gordon, besieged and killed at Khartoum in 1885, became a martyr-hero of the popular press; the relief expedition arrived two days late, and {{gladstone|Gladstone}} took the blame. Small colonial wars — quick, cheap, and fought against opponents without modern weapons — kept the drama going without ever asking much of the taxpayer.`},{t:`h`,x:`Ireland: the empire at home`},{t:`p`,x:`The empire's deepest wound was closest to home. The {{irish-famine|Great Famine}} of 1845–52 killed roughly a million people and drove well over a million more to emigrate, while the government in London clung to {{free-trade|free-trade}} doctrine and did too little, too late — a failure that poisoned Anglo-Irish relations for a century. From the 1880s the demand for {{irish-home-rule|Home Rule}} dominated politics: Gladstone's conversion to it in 1886 split his Liberal party, a second bill fell in 1893, and the third, passed in 1914, brought Ulster and Ireland to the brink of civil war — a crisis suspended, not solved, by the outbreak of the {{first-world-war|First World War}}.`},{t:`h`,x:`Jingo, and the Boer shock`},{t:`p`,x:`The century closed in a blaze of imperial feeling: music-hall jingoism, Kipling, the Diamond Jubilee of 1897 with colonial troops parading through London. Then came the Boer War (1899–1902). Two small farmer republics held the world's greatest empire at bay for three years; Britain needed some 400,000 troops to win, herded Boer civilians into camps where tens of thousands died of disease, and was jeered across Europe. Worse, recruiting officers found alarming numbers of city volunteers too stunted and sickly to serve. The result was a panic about "national efficiency" — a fear that the imperial race was rotting at its urban core — which fed social reform, compulsory school meals, and much anxious talk about decline.`},{t:`reading`,title:`Did the empire actually pay?`,blocks:[{t:`p`,x:`The economics undercut the pageantry. Britain traded and invested more with Europe, the United States, and Latin America than with most of its own colonies; the empire took perhaps a quarter to a third of exports, no more. Defence was startlingly cheap — the Navy cost a small share of national income, and the Indian Army was paid for by Indian taxpayers. Some individuals and firms grew rich on empire; whether the average English family gained anything from it is genuinely doubtful, and some historians argue the colonies cost more than they returned.`},{t:`p`,x:`This is where the historiographical battle sits. Bernard Porter called the Victorians "absent-minded imperialists" — empire mattered intensely to a governing few and only fitfully to everyone else. Against this, historians influenced by postcolonial studies reply that empire saturated everything: sugar in the tea, cotton in the mills, race-thinking in the schoolbooks, and profits (including the earlier profits of slavery) deep in the country's capital. Tombs stands closer to Porter. The debate is live, and it is really a debate about what "mattering" means.`}]},{t:`timeline`,title:`The imperial century`,events:[{year:`1845`,label:`The {{irish-famine|Irish Famine}} begins`,detail:`Potato blight meets doctrinaire government. Roughly a million die; emigration remakes Ireland and the Irish diaspora.`},{year:`1857`,label:`{{indian-rebellion|Indian Rebellion}}`,detail:`Sepoy revolt shakes British India; savage repression follows. The Crown takes over from the {{east-india-company|East India Company}}.`},{year:`1876`,label:`Victoria becomes Empress of India`,detail:`{{disraeli|Disraeli}}'s theatrical gift to the Queen — imperial ceremony covering a thin administrative machine.`},{year:`1882`,label:`Britain occupies Egypt`,detail:`A "temporary" intervention to secure the Suez route; it lasts seventy years and helps trigger the scramble for Africa.`},{year:`1885`,label:`Gordon dies at Khartoum`,detail:`The relief force arrives two days late. The press makes a martyr; {{gladstone|Gladstone}} gets the blame.`},{year:`1886`,label:`First {{irish-home-rule|Home Rule}} bill`,detail:`Gladstone converts to Irish self-government and splits the Liberal party for a generation.`},{year:`1897`,label:`Diamond Jubilee`,detail:`The high noon of imperial pageantry — and, in Kipling's "Recessional", a warning that it would pass.`},{year:`1899`,label:`Boer War begins`,detail:`Three years, 400,000 troops, camps, and international disgrace to beat two farmer republics. The "national efficiency" panic follows.`},{year:`1914`,label:`Home Rule passed — and suspended`,detail:`Ulster arms to resist; Europe's war postpones Ireland's. It will resume in 1916.`}]},{t:`h`,x:`A power in spite of itself`},{t:`p`,x:`What emerges from Tombs' account is an empire run half-heartedly: no colonial conscription, no imperial tariff wall until the 1930s, no master plan — and a public that cheered the shows, mourned the heroes, and declined to pay for much. "English" quietly did duty for "British" at the empire's height, a habit of speech with a long afterlife ({{britishness|Britishness}}). The real test of the whole structure was coming from Europe, the continent England had never stopped watching. In August 1914 it arrived.`}]},{id:`int4`,part:5,title:`Englishness in the English Century`,subtitle:`Interlude`,era:`looking back`,blurb:`How the Victorians and Edwardians saw themselves: John Bull, the march of liberty, Anglo-Saxon blood, and — strangest of all — a nation of city-dwellers that dreamed it lived in a village.`,blocks:[{t:`p`,x:`This interlude pauses the narrative to ask what "English" meant to the people who bestrode the nineteenth century. Their self-images were vivid, confident, and often flatly contradicted the facts of their own lives — which, Tombs suggests, is exactly why they mattered.`},{t:`h`,x:`The free-born Englishman`},{t:`p`,x:`The oldest self-image was John Bull: stout, beef-fed, plain-spoken, suspicious of foreigners and of his own government alike. Behind him stood the "free-born Englishman", heir to liberties supposedly rooted in Saxon times and merely restored by {{magna-carta|Magna Carta}} — the old {{norman-yoke|Norman Yoke}} story in Sunday clothes. {{whig-history|Whig history}} gave this folk belief scholarly polish: {{macaulay|Macaulay}}'s *History of England* sold like a novel by telling the English that their past was a steady, providential march from despotism to liberty, with 1688 as the hinge and the present as the reward. It was superb storytelling and dubious history, and the Victorians could not get enough of it.`},{t:`p`,x:`Alongside liberty ran blood. Racial "Anglo-Saxonism" — the notion that English freedom and energy were inherited traits of a Germanic race — flourished in mid-century lecture halls and crossed the Atlantic, where Americans used it to claim kinship with England and a manifest destiny of their own. It could shade from harmless antiquarianism into the race-thinking that later centuries would pay for.`},{t:`h`,x:`The world's most urban nation dreams of a village`},{t:`p`,x:`Here is the paradox at the interlude's heart. By 1900 England was the most urbanized society on earth — the first ever with more town-dwellers than country folk, a fact fixed by the {{industrial-revolution|Industrial Revolution}} two generations before. Yet precisely then, Englishness went rural. Writers hymned the "South Country" of thatch, hedgerow, and church spire; Elgar's music seemed to rise off the Malvern Hills; garden cities promised to dissolve the slum into greenery; folk songs were collected from ageing labourers before they vanished. The countryside became England's idea of itself at the very moment most English people had never worked a field.`},{t:`argument`,x:`Tombs' point: the village England of the imagination was a myth manufactured by townsmen — and a consequential one. It shaped town planning, poetry, war memorials, and the green belt; it taught an industrial people to feel that their real nation lay somewhere they did not live. Few myths have had a longer afterlife.`},{t:`h`,x:`Gentlemen, and the vanishing of "England"`},{t:`p`,x:`The era's human ideal was the gentleman — defined less by birth than by conduct: fair play, understatement, amateurism, a straight bat. The reformed public schools mass-produced him, turning brewers' sons into classical-quoting prefects and exporting the type to run the {{british-raj|Raj}}. {{victorian-values|Victorian moral earnestness}} gave the ideal its spine; games gave it its religion.`},{t:`p`,x:`And one more quiet habit: at the empire's height, "English" simply stood for "British". Scots, Welsh, and Irish careers were made under the wider label of {{britishness|Britishness}}, yet the English rarely bothered to distinguish themselves from it — England was the default, needing no flag or anthem of its own. That unexamined confidence, Tombs notes, would look very different once the empire, and then the Union itself, came into question.`}]},{id:`ch15`,part:6,number:`15`,title:`The War to End War`,era:`1914–1918`,blurb:`The {{first-world-war|Great War}}: why Britain fought, what it cost, and how it was won — and Tombs' most provocative case, that the "futility" everyone now remembers is a myth built long after the guns stopped.`,blocks:[{t:`p`,x:`No stretch of English history is buried under thicker memory than 1914–18: mud, wire, doomed boys, donkey generals. This chapter is where Tombs' revisionism works hardest. He tells the story of the {{first-world-war|First World War}} as contemporaries lived it — a terrible war they believed necessary and finally won — and then asks how that story got replaced by the one we inherited from the {{war-poets|war poets}}.`},{t:`h`,x:`Why Britain went in`},{t:`p`,x:`Britain entered the war on 4 August 1914, when Germany invaded Belgium on its way to France. Belgium supplied the legal trigger — Britain had guaranteed its neutrality since 1839 — but the deeper reason was the oldest rule of English policy: no single power must dominate the continent and its Channel coast. A victorious Germany astride Europe, facing Britain alone, was a future no government thought it could accept.`},{t:`argument`,title:`A tragic necessity`,x:`Tombs defends the decision to fight. Standing aside, he argues, would not have bought peace; it would have delivered Europe to a militarist Germany and left Britain isolated against it, with the war postponed to worse terms. The choice of 1914 was not folly or sleepwalking but the least-bad option facing men who understood roughly what it might cost. Reasonable historians dissent — but the "pointless war" verdict, he insists, needs an answer to the question: pointless compared to what?`},{t:`h`,x:`Kitchener's millions`},{t:`p`,x:`Britain began with a tiny professional army and improvised a mass one. Kitchener, almost alone in predicting a long war, called for volunteers; roughly two and a half million men enlisted freely before conscription came in 1916 — the greatest voluntary mobilization in history, whole towns joining up together in "Pals" battalions. The learning was paid for in blood. In 1915 the attempt to knock out Turkey at {{gallipoli|Gallipoli}} — {{churchill|Churchill}}'s scheme — collapsed into a doomed beachhead and evacuation.`},{t:`p`,x:`Then the {{somme|Somme}}. On 1 July 1916 the new volunteer army attacked and suffered some 57,000 casualties, about 19,000 of them dead — the worst day in British military history, and the centre of all later memory. Yet the battle ground on for four more months, wearing down the German army in a war that had become one of attrition because neither side could break the trench deadlock. Contemporaries grieved; most did not conclude the war was futile. They concluded it had to be won.`},{t:`h`,x:`The home front`},{t:`p`,x:`Total war reorganized England. The Defence of the Realm Act (DORA) gave the state powers over industry, drink, and daylight itself; food rationing came in 1918 after the U-boats bit; around a million women went into munitions works, offices, and transport, shifting arguments about the vote that the {{suffragettes|suffragettes}} had forced before the war. The {{trade-unions|unions}} were bargained with, not broken. 1917 was the year of strain — U-boat crisis, Passchendaele's mud, war-weariness, revolution in Russia — but England, unlike half of Europe, did not crack.`},{t:`h`,x:`1918: near-defeat, then victory`},{t:`p`,x:`In March 1918 Germany's last great offensive tore the front open and nearly won the war. It failed; and from August the British army — now the best-equipped and arguably the most effective on the field, integrating tanks, aircraft, and precise artillery — led the "Hundred Days" advance that broke the German army and forced the armistice of 11 November. Victory cost the United Kingdom roughly 720,000 dead. The same year, the {{fourth-reform-act|Fourth Reform Act}} tripled the electorate, giving the vote to all adult men and — with a household qualification attached — to most women over thirty: the political payment for a people's war, and a door through which the {{labour-party|Labour party}} would soon walk.`},{t:`voice`,source:`Wilfred Owen, "Anthem for Doomed Youth" (1917) — killed in action one week before the Armistice`,x:`"What passing-bells for these who die as cattle? / — Only the monstrous anger of the guns." Owen's sonnet, barely read in his lifetime, became the voice through which later generations heard the entire war.`},{t:`reading`,title:`How the futility myth won`,blocks:[{t:`p`,x:`In 1918 most Britons believed they had won a necessary war. The memory changed later. A boom of disillusioned memoirs and novels around 1928–33 (Graves, Sassoon, Remarque) recast the war as senseless slaughter; the {{war-poets|war poets}}, little read in wartime, entered the school anthologies; the 1960s — *Oh! What a Lovely War*, then the "lions led by donkeys" popular histories, later *Blackadder* — fixed the picture of brave men wasted by fools.`},{t:`p`,x:`Tombs sides with the military historians who call this bad history: generals learned fast by 1918, the army's morale largely held, and no one has shown a cheap way to have beaten Germany. But he also explains why the myth won — it answered the grief of the bereaved, and after 1939 proved the "war to end war" had ended nothing. A myth that useful does not yield to footnotes. The reader should know both the case and its critics: some historians still find the revisionists too forgiving of the generals.`}]},{t:`timeline`,title:`Britain's Great War`,events:[{year:`1914`,label:`Britain declares war, 4 August`,detail:`Germany invades Belgium; Britain honours its guarantee and its balance-of-power instincts. Kitchener calls for volunteers.`},{year:`1915`,label:`{{gallipoli|Gallipoli}}`,detail:`The attempt to force the Dardanelles and knock out Turkey fails at terrible cost; {{churchill|Churchill}} falls from office.`},{year:`1916`,label:`First day of the {{somme|Somme}}`,detail:`1 July: some 57,000 British casualties — the worst day in the army's history. Conscription has begun the same year.`},{year:`1917`,label:`The year of strain`,detail:`U-boats nearly starve Britain, Passchendaele drowns in mud, Russia collapses into revolution — but the home front holds.`},{year:`1918`,label:`German spring offensive`,detail:`March: the front breaks and the war nearly ends in defeat. In April, as the next blow falls in Flanders, Haig orders the army to fight "with our backs to the wall".`},{year:`1918`,label:`The Hundred Days`,detail:`From August, British-led offensives break the German army — the largest victories in British military history, and the least remembered.`},{year:`1918`,label:`Armistice and the {{fourth-reform-act|Fourth Reform Act}}`,detail:`11 November: the guns stop. Roughly 720,000 UK dead. All adult men and most women over thirty get the vote.`}]},{t:`p`,x:`England came out of the war a victor that felt like a mourner. Nearly every parish raised a memorial cross; the two-minute silence stopped the country each November. What victory was for — and whether the peace could be kept without ever doing this again — became the governing question of the next twenty years.`}]},{id:`ch16`,part:6,number:`16`,title:`The Twenty-Year Truce`,era:`1918–1939`,blurb:`Between the wars: Ireland leaves, Labour arrives, the North rusts while the South builds semis and buys cars — and a traumatized democracy tries appeasement before facing Hitler. Tombs argues the "wasted years" label gets half the story wrong.`,blocks:[{t:`p`,x:`The peace of 1918 lasted twenty years, and posterity has filed them under failure: dole queues, Depression, {{appeasement|appeasement}}. Tombs complicates the file. These were also the years when most English families got the biggest rise in living standards yet seen, when politics stayed calm while Europe went fascist or communist, and when the choices that look shameful in hindsight were made by sane people for intelligible reasons.`},{t:`h`,x:`Aftershocks`},{t:`p`,x:`Demobilization brought four million men home to a promise of "homes fit for heroes" that budgets soon broke, and to an influenza pandemic deadlier than the war. The bitterest aftershock was Ireland: rebellion in 1916, guerrilla war from 1919, and in 1921–22 a treaty that took twenty-six counties out of the United Kingdom — the ending the {{irish-home-rule|Home Rule}} wars of Victorian politics had tried to avoid. England watched most of Ireland go with striking indifference; the Union of 1801 dissolved with barely an English tear.`},{t:`h`,x:`New politics, old temper`},{t:`p`,x:`The {{fourth-reform-act|mass electorate}} remade the party system. The Liberals collapsed; the {{labour-party|Labour party}}, grown from the {{trade-unions|unions}}, formed its first minority governments under Ramsay MacDonald in 1924 and 1929 — and governed with almost anxious respectability. The {{general-strike|General Strike}} of 1926 lasted nine days and ended peacefully, with volunteers driving buses and both sides congratulating themselves on avoiding a revolution neither wanted. Presiding over the era was Stanley Baldwin, three times prime minister: pipe-smoking, emollient, deliberately dull — calm made flesh. His quiet mastery showed in 1936, when he eased Edward VIII off the throne over Mrs Simpson in a fortnight, without a constitutional crisis.`},{t:`h`,x:`Two Englands`},{t:`p`,x:`The Depression split the country in two. The old staple industries — coal, shipbuilding, cotton, all built for a world trade that had shrunk — collapsed across the North, Wales, and Scotland; unemployment passed two and a half million around 1932, and towns like Jarrow, its shipyard shut, marched on London in protest. But the South and Midlands boomed. Cheap money built some four million houses, ribbons of semi-detached suburbia; Morris and Austin put the family car within middle-class reach; the national electricity grid, chain stores, radio, and cinemas (fed by Hollywood) made a new consumer England. Which England you saw depended on where you stood — a division of the country's economic geography that has never fully closed.`},{t:`argument`,x:`Tombs' verdict on the "wasted years": half-wrong. For the unemployed of the industrial North the era was genuinely cruel. But for most English families, real wages, diet, housing, health, and leisure improved more in these two decades than in any before them. The standard picture — Orwell's road to Wigan Pier as the whole truth — mistakes the tragic part for the whole.`},{t:`h`,x:`The slide to war`},{t:`p`,x:`Hitler took power in 1933, and British governments responded with a double policy: rearm slowly, negotiate hopefully. Rearmament — radar, the RAF's new fighters — actually began in the mid-1930s, earlier than legend allows, but against it pressed everything else: a public that remembered the {{first-world-war|trenches}}, an empire stretched from Hong Kong to Jamaica, a Treasury guarding a fragile recovery, no reliable allies, and pacifist sentiment strong in every party. {{appeasement|Appeasement}} was less a policy of cowards than the policy this situation seemed to dictate.`},{t:`p`,x:`It reached its peak at {{munich|Munich}} in September 1938, when Neville Chamberlain ceded the Czech Sudetenland to Hitler and flew home to cheering crowds, waving his agreement and promising "peace for our time". {{churchill|Churchill}}, half-heard from the back benches, called it a total defeat. In March 1939 Hitler took Prague and settled the argument: this was not a grievance to be met but an appetite to be stopped. Britain guaranteed Poland, and when Germany invaded on 1 September 1939, the truce was over. On 3 September Britain declared the {{second-world-war|Second World War}}.`},{t:`reading`,title:`Appeasement: cowardice or logic?`,blocks:[{t:`p`,x:`After 1940 the "Guilty Men" polemic fixed the popular verdict: appeasers were blind cowards who fed the crocodile. Tombs joins the historians who complicate it. Chamberlain's governments faced real constraints — military weakness in 1938, dominion reluctance, American isolation, French disarray, and a democracy that would not have united for war over the Sudetenland. Munich, on this reading, was wrong but intelligibly wrong: the error of a traumatized, overstretched country that misread Hitler as a normal statesman with limited aims.`},{t:`p`,x:`The strongest counter-argument: intelligibility is not vindication. Critics note that Czechoslovakia's army and defences were sacrificed, that Hitler was arguably weaker in 1938 than in 1939, and that Chamberlain kept believing in his policy long after the evidence turned. The debate matters because "no more Munichs" became a governing reflex of British and American policy for the rest of the century — sometimes wisely, sometimes (as at {{suez-crisis|Suez}}) disastrously.`}]},{t:`timeline`,title:`Between the wars`,events:[{year:`1918`,label:`Armistice — and influenza`,detail:`The war ends; the flu pandemic kills more worldwide than the fighting did. Demobilization begins.`},{year:`1922`,label:`Ireland leaves the UK`,detail:`The Irish Free State is born after treaty and civil war; six Ulster counties stay. England barely looks up.`},{year:`1924`,label:`First {{labour-party|Labour}} government`,detail:`Ramsay MacDonald leads a cautious minority government — the rise of Labour completed without a revolution.`},{year:`1926`,label:`{{general-strike|General Strike}}`,detail:`Nine days in May. Volunteers run buses; the TUC backs down; both sides claim relief more than victory.`},{year:`1932`,label:`Depression's trough`,detail:`Unemployment passes two and a half million, concentrated in the industrial North — while the suburban South builds and buys.`},{year:`1936`,label:`Abdication`,detail:`Baldwin manages Edward VIII off the throne over Wallis Simpson in weeks. George VI succeeds; the monarchy steadies.`},{year:`1938`,label:`{{munich|Munich}}`,detail:`Chamberlain cedes the Sudetenland and proclaims "peace for our time". {{churchill|Churchill}} dissents; Prague falls within six months.`},{year:`1939`,label:`War again`,detail:`Hitler invades Poland on 1 September; Britain declares war on the 3rd. The twenty-year truce is over.`}]},{t:`p`,x:`So England went back to war in 1939 — reluctant, half-rearmed, and this time without illusions about glory. What followed would give the country the proudest and most mythologized year in its modern history. That is the next chapter.`}]},{id:`ch17`,part:6,number:`17`,title:`The Edge of the Abyss`,era:`1939–1945`,blurb:`The {{second-world-war|Second World War}} brought England closer to conquest than anything since 1066 — and gave it the one national story that, Tombs argues, is substantially true. 1940 really was a hinge of world history. What the English later did with that fact is another matter.`,blocks:[{t:`p`,x:`Every nation has a founding myth. Tombs' claim in this chapter is startling: England's modern one — the finest hour, the few, standing alone — is, unusually, mostly true. In the summer of 1940 the last unconquered great power in Europe chose to keep fighting a war it had no visible way of winning, and that choice kept the possibility of Hitler's defeat alive. The chapter tells the story straight, then asks what it cost.`},{t:`h`,x:`Phoney war, real war`},{t:`p`,x:`War came in September 1939, after {{munich|Munich}} had bought a year and lost a reputation. For eight months almost nothing happened in the west — the "phoney war" of blackouts, gas masks, and the {{blitz|evacuation}} of over a million city children to the countryside. Then, in six weeks of May and June 1940, Germany destroyed France. Chamberlain fell; {{churchill|Winston Churchill}}, sixty-five years old and widely distrusted as a romantic adventurer, became Prime Minister on the very day the offensive began. The army escaped at {{dunkirk|Dunkirk}} — roughly 338,000 men lifted off the beaches by the navy and a famous flotilla of small boats — but it left its equipment behind. England now faced invasion.`},{t:`reading`,title:`The five days that decided it`,blocks:[{t:`p`,x:`In late May 1940, with the army trapped at {{dunkirk|Dunkirk}}, the small War Cabinet argued over whether to explore peace terms through Mussolini. The Foreign Secretary, Lord Halifax, thought it prudent to ask the price. {{churchill|Churchill}} argued that any negotiation would destroy the will to resist, and that the terms would in any case be slavery. He won by appealing past Halifax to the wider Cabinet, who backed fighting on with unexpected passion.`},{t:`p`,x:`Tombs dwells on this because it was a genuine decision, taken by a handful of tired men, and it could have gone the other way. A compromise peace in 1940 would have left Hitler master of Europe with no western front, no base for an American return, and Russia to face alone. The whole shape of the twentieth century turned on a committee meeting.`}]},{t:`h`,x:`1940: the hinge`},{t:`p`,x:`Invasion needed air superiority, so the {{battle-of-britain|Battle of Britain}} was fought through the summer of 1940 between a few thousand young pilots. The RAF held — helped by radar, home ground, and German mistakes — and in September Hitler postponed invasion for good, turning instead to bombing cities. The {{blitz|Blitz}} killed roughly 43,000 civilians over eight months; London was bombed for fifty-seven nights running. Morale bent but did not break, and "London can take it" became a weapon in the fight for American opinion. For a year, from the fall of France to Hitler's invasion of Russia, England and its empire fought alone — though "alone", Tombs notes, meant alongside Canadians, Australians, Indians, Poles, Czechs, and the largest navy on earth.`},{t:`argument`,x:`Tombs argues that the finest-hour story passes the historian's test that most national myths fail. The danger was real, the defiance was real, and the consequences were world-historical: by refusing terms in 1940, England denied Hitler a settled victory and kept the war open until Russia and America could be drawn in. The myth's distortions came later — but the event itself needs no embroidery.`},{t:`h`,x:`The long grind of the grand alliance`},{t:`p`,x:`Survival was not victory. The war became a slog: the Battle of the Atlantic against the U-boats, which Churchill privately called the only thing that ever really frightened him; seesaw campaigns in the North African desert until El Alamein in late 1942; humiliations in the east, above all the fall of Singapore. Hitler's attack on Russia in June 1941 and Japan's attack on Pearl Harbor that December turned a lonely war into a world alliance in which England was, from then on, the junior partner. The main British blow against Germany itself was strategic bombing — a campaign that flattened German cities, killed hundreds of thousands of civilians, and cost the lives of some 55,000 aircrew. It troubled consciences at the time and has ever since; Tombs treats the moral debate as genuinely hard rather than settling it with hindsight.`},{t:`h`,x:`The People's War`},{t:`p`,x:`At home the state took charge of nearly everything: rationing, conscription of men and (a world first) women, direction of labour. Taxes reached levels no peacetime government had dreamed of. And in the middle of the war the government began planning the peace: the Beveridge Report of 1942, a bestseller queued for outside bookshops, promised to slay the "five giants" of want, disease, ignorance, squalor, and idleness — the blueprint of the {{welfare-state|welfare state}}. Shared danger and shared queues fed a quiet radicalism: if the state could organize total war, why not full employment and health care? The {{labour-party|Labour Party}}'s 1945 landslide was written in these years.`},{t:`timeline`,title:`England's war`,events:[{year:`1939`,label:`War declared; children evacuated`,detail:`The "phoney war": blackout and waiting, but little fighting in the west.`},{year:`1940`,label:`{{churchill|Churchill}} takes office; {{dunkirk|Dunkirk}}`,detail:`France falls in six weeks; the army escapes without its equipment; the War Cabinet resolves to fight on.`},{year:`1940`,label:`{{battle-of-britain|Battle of Britain}} and {{blitz|Blitz}}`,detail:`The RAF denies Hitler the air; bombing of cities kills roughly 43,000 civilians.`},{year:`1941`,label:`Barbarossa and Pearl Harbor`,detail:`Russia and America enter the war; England is no longer alone — and no longer the senior partner.`},{year:`1942`,label:`Singapore falls; El Alamein won; Beveridge published`,detail:`Imperial humiliation, desert victory, and a wartime blueprint for the {{welfare-state|welfare state}}.`},{year:`1944`,label:`D-Day`,detail:`The largest seaborne invasion in history opens the road to Germany from the west.`},{year:`1945`,label:`Victory in Europe — and bankruptcy`,detail:`Germany surrenders in May; Lend-Lease stops abruptly; Britain is victorious, exhausted, and broke.`}]},{t:`h`,x:`Victory, at a price`},{t:`p`,x:`D-Day in June 1944 — an operation of staggering scale, mounted from English ports — and the campaigns that followed brought victory in May 1945. Britain ended the war on the winning side of the greatest conflict in history, its cities scarred but its institutions intact, the only European combatant neither conquered nor turned totalitarian. It also ended the war having sold its overseas assets, borrowed to the hilt, and lost perhaps a quarter of its national wealth. Days after Japan surrendered, America ended Lend-Lease, and the victors had to beg a loan. The war vindicated England and beggared it in the same stroke — the tension the next chapters live inside.`},{t:`argument`,title:`The myth and its misuses`,x:`True stories can still mislead. Tombs argues that the finest-hour memory, precisely because it was earned, became the measuring-rod for every decade after 1945 — and every decade failed the comparison. It fed a belief that England could always stand alone and always improvise its way through, and it made the ordinary condition of being a middling prosperous country feel like decline. The distortion lay not in the story but in the uses the postwar mind found for it.`}]},{id:`int5`,part:6,title:`Memory, History and Myth`,subtitle:`Interlude`,era:`looking back`,blurb:`The methodological heart of the book: how 1914–1945 was turned from history into memory — selective, moralized, and politically live — and why Tombs insists the two must never be confused.`,blocks:[{t:`p`,x:`This interlude is where Tombs shows his hand. The two world wars are the last events most English people feel they *remember*, even those born decades later. But what they remember is not what happened; it is a curated selection, built at particular moments for particular purposes. Tombs' claim is blunt: memory is not history. History tries to explain the past on its own terms; memory ransacks it for lessons, comfort, and blame.`},{t:`h`,x:`How the Great War became futile`},{t:`p`,x:`For decades after 1918, most English people saw the {{first-world-war|First World War}} as tragic but necessary. The war of memory — mud, donkeys, doomed youth — was largely built in the 1960s: the fiftieth anniversary of the {{somme|Somme}}, the stage and film hit *Oh! What a Lovely War*, and a school canon that made the {{war-poets|war poets}} the war's official witnesses. Owen and Sassoon, unrepresentative even of the poets, came to stand for millions of soldiers most of whom had believed in the cause. Remembrance ritual — the two-minute silence, the poppy, the Cenotaph — kept the emotion renewed each November, gradually shifting from mourning specific men to mourning war itself.`},{t:`h`,x:`The usable Second War`},{t:`p`,x:`The {{second-world-war|Second World War}} left a different deposit: not futility but vindication, and a set of reusable templates. The {{dunkirk|Dunkirk}} spirit — improvised escape from disaster — and the {{blitz|Blitz}} spirit — cheerful endurance under fire — became national reflexes, invoked in every crisis from fuel shortages to pandemics. {{munich|Munich}} became the all-purpose foreign-policy lesson: never appease. Eden reached for it at {{suez-crisis|Suez}} in 1956, casting Nasser as a new dictator; later leaders reached for it over the Falklands, Kosovo, and Iraq. And "standing alone" in 1940 became, in time, a standing argument — deployed with particular energy in debates about the {{european-union|European Union}} — that England neither needed nor quite belonged to the continent.`},{t:`argument`,x:`Tombs' central methodological claim: memory is selective, moralized, and politically active, and in postwar England the memories of 1914–1945 became the strongest political forces in the country — stronger than any ideology. They decided what leaders could say, which analogies won arguments, and how the English judged their own present. A nation that mistakes its memory for its history, he warns, will keep misreading both its past and its options.`},{t:`h`,x:`Historians against memory`},{t:`p`,x:`The memory version has not gone unchallenged. Military historians such as Gary Sheffield have argued that the British army of 1918 was a formidable, learning institution that won the greatest victories in its history, not a machine for wasting lives; Christopher Clark's work on 1914 complicated the comfortable story of blameless entry into a needless war. Against them stands what critics call the futility school, for whom the poets told the essential truth. Tombs sides broadly with the revisionists on the facts — but his deeper point is that the argument itself proves his case. The battle over the trenches is still being fought, because it was never only about the trenches: it is about what kind of country England thinks it is. That question dominates the rest of the book.`}]},{id:`ch18`,part:7,number:`18`,title:`Postwar`,era:`1945–c.1960`,blurb:`New Jerusalem on ration books: {{attlee|Attlee}}'s {{welfare-state|welfare state}} and {{nhs|NHS}}, the end of the {{british-raj|Raj}}, {{suez-crisis|Suez}}, and then affluence. Tombs' contrarian verdict: the decades the {{declinism|declinists}} mocked were the best time yet to be an ordinary English person.`,blocks:[{t:`p`,x:`In July 1945, weeks after victory in Europe, the English electorate dismissed {{churchill|Churchill}} — the most admired man in the country — and gave {{attlee|Clement Attlee}}'s {{labour-party|Labour Party}} its first majority. It was not ingratitude; it was memory. Voters remembered the 1930s and had read their Beveridge. They wanted the wartime state, which had organized victory, to organize the peace. This chapter follows what it built, what it cost, and how the story of these years got told backwards.`},{t:`h`,x:`New Jerusalem on an empty bank account`},{t:`p`,x:`The Attlee governments of 1945–51 built at speed: national insurance from cradle to grave, family allowances, a huge council-housing drive, and — against the doctors' fierce resistance — the {{nhs|National Health Service}}, launched in 1948, free at the point of use. Coal, railways, steel, and the Bank of England were nationalized. All of it was done in a bankrupt country living on an American loan. Austerity was the price: bread was rationed in 1946 (it never had been in the war), and rationing dragged on into the 1950s, longer and in some ways tighter than wartime. The New Jerusalem was built in the cold, by candlelight, in the brutal winter of 1947.`},{t:`reading`,title:`Why the NHS became sacred`,blocks:[{t:`p`,x:`Other countries built health systems after the war, many of them (Tombs notes dryly) better funded and, by most measures, eventually better performing. But the {{nhs|NHS}} alone became part of national identity — "the closest thing the English have to a religion", in a former Chancellor's much-quoted line. Part of the reason is the founding drama: a single day in July 1948 when care stopped depending on money. Part is that it descended from the {{second-world-war|People's War}} — fair shares, all in it together — so that defending the NHS came to feel like defending the memory of 1940–45 itself.`}]},{t:`h`,x:`Letting go, holding on`},{t:`p`,x:`The empire began to go almost at once. India — drained of British power and patience, and convulsed by communal violence — became independent in August 1947, partitioned into India and Pakistan at terrible human cost; Burma and Ceylon followed within a year. {{decolonization|Decolonization}} had begun, though few yet admitted where it would end. At the same time Britain held on to great-power habits: a founding role in NATO in 1949, a secretly ordered atomic bomb, troops in Korea, garrisons east of Suez. And the traffic ran both ways: in June 1948 the *Empire Windrush* docked at Tilbury with several hundred Caribbean migrants, the symbolic start of the {{windrush|Windrush}} generation and of England's transformation into a multi-ethnic society.`},{t:`h`,x:`Affluence — and Suez`},{t:`p`,x:`The Conservatives returned in 1951 and kept nearly everything Labour had built — the {{postwar-consensus|postwar consensus}}: full employment, the {{welfare-state|welfare state}}, strong {{trade-unions|trade unions}}, a mixed economy. What changed was the weather. Rationing ended in 1954, wages ran ahead of prices, and ordinary families bought televisions, washing machines, and their first cars. Harold Macmillan told a 1957 audience that most of the people had "never had it so good" — a boast, but also a plain statement of fact. The one great shock came abroad: at {{suez-crisis|Suez}} in 1956, Eden — armed with the {{munich|Munich}} lesson — colluded with France and Israel to seize back the nationalized canal, and was stopped in days by American financial pressure. The curtain twitched, and everyone saw the machinery: Britain could no longer act as a first-rank power against Washington's wishes.`},{t:`timeline`,title:`From austerity to affluence`,events:[{year:`1945`,label:`{{attlee|Attlee}}'s landslide`,detail:`Labour wins its first majority; the wartime state is turned to building the {{welfare-state|welfare state}}.`},{year:`1947`,label:`Indian independence`,detail:`The {{british-raj|Raj}} ends; partition kills hundreds of thousands; {{decolonization|decolonization}} begins.`},{year:`1948`,label:`{{nhs|NHS}} founded; *Windrush* docks`,detail:`Free health care begins; the {{windrush|Windrush}} generation starts arriving from the Caribbean.`},{year:`1949`,label:`NATO founded`,detail:`Britain anchors the Atlantic alliance and secretly builds its own bomb.`},{year:`1951`,label:`Churchill returns`,detail:`The Conservatives accept the {{postwa
