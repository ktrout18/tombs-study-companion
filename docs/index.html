 around 410, withdrew — and the province collapsed harder and faster than almost anywhere else in the empire: towns emptied, coinage stopped, pottery kilns went cold. Into this vacuum came the {{anglo-saxon-settlement|Anglo-Saxon settlers}} from across the North Sea. Whether they arrived as conquering hordes or as warrior elites absorbing a native population is one of the liveliest debates in early medieval studies; burial archaeology and DNA point to a real migration, but a mixed population.`},{t:`reading`,title:`The strange death of Roman Britain`,blocks:[{t:`p`,x:`Gaul and Spain kept Latin speech, Roman law, and Christian bishops through their barbarian takeovers; Britain lost all three. The English language contains only a scattering of words from Brittonic, and English place-names blanket the lowlands. Something unusual happened here — perhaps state collapse so total that Roman identity itself lost its prestige, leaving newcomers' culture as the only game in town.`},{t:`p`,x:`This "failed continuity" matters for the book's argument: English institutions do not descend from Rome. When {{anglo-saxon-england|England}} later built shires and courts and taxes, it was building fresh — which makes the achievement, in Tombs' eyes, more remarkable, not less.`}]},{t:`h`,x:`Arthur: the most successful fiction in English history`},{t:`p`,x:`Somewhere in the post-Roman mists there may have been a British war-leader who beat the Saxons at a place called Badon; that is nearly all sober history can say. Upon that grain of maybe, twelve centuries built the Round Table, Camelot, and the once and future king. The irony Tombs savours: Arthur — if he existed — fought *against* the English, yet became England's national hero, celebrated by the Plantagenet and Tudor courts as their imperial ancestor.`},{t:`argument`,x:`The Dreamtime is a controlled experiment in national myth-making. With almost no facts to constrain them, the English filled the void with Trojans, Arthur, and ancient constitutions — and acted on the inventions: kings claimed empire from Arthur, lawyers claimed immemorial custom, radicals claimed {{norman-yoke|lost Saxon freedom}}. The rest of the book keeps finding the same mechanism at work in better-documented centuries.`},{t:`timeline`,title:`The murky centuries`,events:[{year:`43`,label:`Rome invades Britain`,detail:`Claudius adds Britannia to the empire; four centuries of villas, roads, and garrisons follow — see {{roman-britain|Roman Britain}}.`},{year:`c.410`,label:`Rome lets go`,detail:`The legions are withdrawn and the emperor tells the Britons to look to their own defence. Collapse follows within a generation.`},{year:`c.450–550`,label:`{{anglo-saxon-settlement|The English arrive}}`,detail:`Migration and takeover across the lowlands; the native British hold the west and north.`},{year:`c.500?`,label:`Badon — the Arthur moment`,detail:`A British victory checks the Saxon advance for a generation. From this seed grows the entire Arthurian legend.`},{year:`597`,label:`Augustine lands`,detail:`Written history resumes; the Dreamtime ends and the story of {{anglo-saxon-england|England}} begins.`}]}]},{id:`ch01`,part:1,number:`1`,title:`This Earth, This Realm`,era:`c.600–1066`,blurb:`How a patchwork of small pagan kingdoms became, in four and a half centuries, the most organized state in western Europe — and why Tombs opens his case here: England was made early, and made to last.`,blocks:[{t:`p`,x:`This chapter covers the least familiar and, Tombs insists, most important stretch of the whole story. Between the age of {{bede|Bede}} and the death of {{edward-confessor|Edward the Confessor}}, the English went from a scatter of competing kingdoms — the {{heptarchy|Heptarchy}} — to a single realm with one crown, one coinage, one church, and a name: *Englaland*. Nothing about this was inevitable. It happened through catastrophe, and it very nearly did not happen at all.`},{t:`argument`,x:`England is not a young country with an old landscape; it is one of the oldest continuously existing states on earth. The {{shire|shires}}, the parish network, the institution of a national tax, even the idea of "the English" as one people — all predate the {{norman-conquest|Conquest}}. Whoever has governed England since has governed through machinery the Anglo-Saxons built.`},{t:`h`,x:`Christianity and the idea of England`},{t:`p`,x:`The story begins with conversion. From 597, Roman missionaries in Kent and Irish monks in the north turned pagan warlords into Christian kings; the {{synod-of-whitby|Synod of Whitby}} (664) settled that the English church would look to Rome. Conversion brought writing, law codes, and — through {{bede|Bede}}, a monk on the Tyne — something stranger: a book that treated Angles, Saxons, and Jutes as a single chosen people, "the English", long before any king ruled them all. The nation was imagined before it was built.`},{t:`voice`,source:`A counsellor urges King Edwin to hear the missionaries — Bede, Ecclesiastical History (731), in a Victorian translation`,x:`Man's life, the counsellor says, is like a sparrow flying out of the winter night into a bright feasting hall and out again into the dark: "whilst he is within, he is safe from the wintry storm; but... he immediately vanishes out of your sight". If the new teaching says anything more certain of what came before and what follows after, "it seems justly to deserve to be followed".`},{t:`reading`,title:`Why Bede matters more than any battle`,blocks:[{t:`p`,x:`Bede's *Ecclesiastical History* (731) did three things with immense consequences. It gave the scattered kingdoms a collective name and a shared story — God's new chosen people on an island at the world's edge. It popularized dating years from the birth of Christ, the AD system we still use. And it created a template the English never abandoned: understanding themselves through history books. Tombs' own book is, self-consciously, the latest entry in a line that starts at Jarrow.`},{t:`p`,x:`The practical effect showed a century and a half later: when {{alfred-the-great|Alfred}} needed to rally more than his own West Saxons against the Danes, the idea of *Angelcynn* — the English kind — was already on the shelf, waiting to be used.`}]},{t:`h`,x:`Catastrophe: the Vikings`},{t:`p`,x:`In 793 the {{viking-invasions|Vikings}} sacked Lindisfarne, and within a lifetime raiding turned to conquest. The "Great Heathen Army" of 865 destroyed {{northumbria|Northumbria}}, East Anglia, and most of {{mercia|Mercia}}; Danish settlers took the whole eastern half of the country — the {{danelaw|Danelaw}}. By 878 only {{wessex|Wessex}} remained, and its king, {{alfred-the-great|Alfred}}, was a refugee in the Somerset marshes.`},{t:`p`,x:`What followed is the founding drama of the English state. Alfred won at Edington, fortified Wessex with a network of *burhs* (garrison towns within a day's march of everywhere), rebuilt learning in English, and struck a treaty that partitioned the island. His son and daughter — Edward and the formidable Æthelflæd, "Lady of the Mercians" — reconquered the Danelaw fort by fort. His grandson {{athelstan|Æthelstan}} took York and, at Brunanburh in 937, smashed the combined kings of Scots, Strathclyde, and Dublin. England now existed — created, as Tombs notes, by a reconquest, the way Spain would later be.`},{t:`widget`,id:`heptarchy-map`},{t:`timeline`,title:`From seven kingdoms to one`,events:[{year:`597`,label:`Augustine lands in Kent; conversion begins`,detail:`Pope Gregory sends a nervous missionary to the pagan English. Within a century every English kingdom is Christian — and literate.`},{year:`664`,label:`{{synod-of-whitby|Synod of Whitby}}`,detail:`Northumbria opts for Roman over Irish practice, binding the English church to the continent.`},{year:`731`,label:`{{bede|Bede}} finishes his History`,detail:`"The English" get their name and their story.`},{year:`793`,label:`Lindisfarne sacked`,detail:`The {{viking-invasions|Viking age}} opens with an attack on the holiest site in the north.`},{year:`865`,label:`The Great Heathen Army lands`,detail:`Conquest, not raiding: within fifteen years every kingdom but {{wessex|Wessex}} has fallen.`},{year:`878`,label:`Alfred wins at Edington`,detail:`From a marsh hideout to victory; the {{danelaw|Danelaw}} treaty splits England.`},{year:`937`,label:`{{athelstan|Æthelstan}} wins Brunanburh`,detail:`The first king of all England defeats a grand coalition; the poets remember it as the greatest of battles.`},{year:`1016`,label:`{{cnut|Cnut}} conquers England`,detail:`The Danish king keeps the whole English system running — proof of its solidity.`},{year:`1066`,label:`The year of three kings`,detail:`{{edward-confessor|Edward the Confessor}} dies childless; Harold, Hardrada, and William contend for his crown.`}]},{t:`h`,x:`The precocious state`},{t:`p`,x:`The tenth-century kingdom the house of {{wessex|Wessex}} built is the heart of Tombs' argument. It divided the land into {{shire|shires and hundreds}}, with courts in which ordinary freemen served; it minted a single controlled coinage, recalled and re-struck every few years; it could raise a national tax — the {{danegeld|geld}} — assessed on every hide of land in the kingdom. Kings were consecrated with a coronation oath to do justice, and took counsel in the {{witan|Witan}}. No other kingdom in Latin Europe could do all of this.`},{t:`reading`,title:`How do we know the Anglo-Saxon state was strong?`,blocks:[{t:`p`,x:`Three kinds of evidence converge. Coins: tens of thousands survive, uniform in weight and design, from dozens of mints — impossible without central control. {{domesday|Domesday Book}}: compiled in months in 1086, it could only be built on existing English records and the {{shire|shire}} machinery. And the {{danegeld|geld}} itself: the sums paid to the Danes (tens of thousands of pounds of silver) imply a tax system of astonishing reach for the age.`},{t:`p`,x:`Historians call this the 'maximum state' view, associated with James Campbell — the argument that late Anglo-Saxon England was the most intensively governed polity in the West. Tombs adopts it, because it grounds his larger claim: English institutional continuity starts here, not in 1066 or 1215.`}]},{t:`p`,x:`Strength attracted predators. Æthelred "the Unready" (the nickname is a pun: *Æthelred Unræd*, roughly "Noble-counsel No-counsel") paid ever-larger gelds to ever-larger Danish armies, and in 1016 the Danish prince {{cnut|Cnut}} took the whole kingdom. The revealing part is what he did with it: nothing. He kept the laws, the church, the shires, and the taxes, ruling England as the richest province of a North Sea empire. A state worth stealing is a state that works.`},{t:`h`,x:`1066: the ruin of the English`},{t:`p`,x:`When {{edward-confessor|Edward the Confessor}} died childless in January 1066, the {{witan|Witan}} chose Harold Godwinson, the greatest earl in England. Within the year he had destroyed a Norwegian invasion at Stamford Bridge, marched the length of the country, and died at Hastings with the flower of the English nobility around him. Duke {{william-conqueror|William of Normandy}} was crowned on Christmas Day amid burning houses, insisting he was no conqueror but {{edward-confessor|Edward}}'s lawful heir. What his coronation actually began — the amputation of an entire ruling class — is the next chapter's story.`},{t:`argument`,title:`The stakes of the chapter`,x:`Tombs wants the reader to feel the wrongness of the familiar assumption that English history "really" starts in 1066. By then England had existed for a century and a half as a unified state and for over three centuries as an idea. The Conquest changed who ruled; what they ruled — the shires, the geld, the parishes, the English language stubbornly surviving beneath French — was already old.`}]},{id:`ch02`,part:1,number:`2`,title:`The Conqueror's Kingdom`,era:`1066–1204`,blurb:`The Norman century and a half: a French-speaking elite seizes the oldest state in the West, runs it harder than its makers ever did, and — by losing Normandy — accidentally becomes English.`,blocks:[{t:`p`,x:`The {{norman-conquest|Conquest}} was the most complete catastrophe ever to befall the English governing class. Within twenty years of Hastings, {{domesday|Domesday Book}} records barely a handful of major English landholders; land, bishoprics, and offices had passed to perhaps ten thousand incomers. French became the language of power for three centuries — which is why English still pairs humble farmyard words with elegant table words: cow and beef, sheep and mutton, pig and pork.`},{t:`widget`,id:`hastings-diagram`},{t:`voice`,source:`The Anglo-Saxon Chronicle on William I, written at his death in 1087 (19th-century translation)`,x:`The chronicler, who says he once lived at William's court, grants the king his due — "he was a very wise man, and very rich" — and then delivers the bill: he had castles built "and poor men hard oppressed", and took gold "by right and with great unright". A conquered people's verdict, filed for posterity in English.`},{t:`p`,x:`Yet the machine itself survived. {{william-conqueror|William}} claimed to rule as {{edward-confessor|the Confessor}}'s lawful heir, so he kept the {{shire|shires}}, the {{danegeld|geld}}, the coinage, and English law — indeed Domesday, the Conquest's most famous artefact, was only possible *because* the {{anglo-saxon-england|Anglo-Saxon state}} kept records no other kingdom had. Norman lordship was bolted onto English government: castles and {{feudalism|knight-service}} above, hundred courts and sheriffs below. When the north resisted, William's answer — the Harrying of the North — was devastation so thorough that Domesday still recorded "waste" twenty years on.`},{t:`argument`,x:`Tombs' reading of the Conquest cuts both ways. Against romantic nostalgia: the Normans did not bring civilization to a backward island — they captured Europe's best-run state and were changed by it. Against complacency: the trauma was real and remembered. The {{norman-yoke|Norman Yoke}} — the myth of stolen Saxon liberty — became a permanent piece of English political furniture, pulled out by radicals from the {{levellers|Levellers}} to the Victorians.`},{t:`widget`,id:`feudal-pyramid`},{t:`h`,x:`The Angevin machine`},{t:`p`,x:`After a generation of civil war between rival heirs (the "Anarchy" of Stephen and Matilda, when contemporaries said Christ and his saints slept), {{henry-ii|Henry II}} restored order with a vengeance. Ruler of an empire from the Scottish border to the Pyrenees, he governed England through institutions rather than presence: itinerant royal justices, standard writs, and the {{jury-trial|jury}} — the beginnings of the {{common-law|common law}}, case-made and national, which Tombs ranks among England's most consequential creations and exports.`},{t:`reading`,title:`Why the common law matters to the whole book`,blocks:[{t:`p`,x:`Two features distinguish English law from the Roman-law systems of the continent. It grew from decided cases rather than a code, making precedent — history itself — the source of authority. And it ran in royal courts open to free litigants across the realm, tying ordinary people's property and quarrels to national institutions rather than local lords.`},{t:`p`,x:`Tombs returns to this repeatedly: law became part of English identity — the "free-born Englishman" with his {{jury-trial|jury}} and his rights — and later travelled with empire to a third of humanity. When {{magna-carta|Magna Carta}} made the king himself subject to law, it was building on foundations Henry's clerks had laid.`}]},{t:`p`,x:`The machine had a flaw: it needed money endlessly, for wars in France. Henry's quarrel with {{thomas-becket|Becket}} showed royal power could still be checked by the church — four knights, a cathedral, and Europe's most sensational murder made Canterbury a pilgrim city for 350 years. His sons showed the machine's other danger. Richard the Lionheart, the absentee crusader-king, taxed England ferociously to fund glory abroad; his brother {{king-john|John}} taxed it harder still — and lost.`},{t:`h`,x:`1204: the loss that made England`},{t:`p`,x:`In 1204 King Philip of France took Normandy from {{king-john|John}}. For the barons this forced a choice of allegiance — estates in England or estates in Normandy, no longer both — and within a generation the aristocracy, whatever it spoke at dinner, had become territorially English. Tombs ends the chapter here deliberately: defeat, once again, as midwife of the nation. John's frantic, extortionate campaign to win Normandy back would drive his barons to Runnymede — and to {{magna-carta|Magna Carta}}, the door to Part Two.`},{t:`timeline`,title:`The Norman and Angevin century`,events:[{year:`1066`,label:`Hastings and coronation`,detail:`{{william-conqueror|William}} crowned at Westminster on Christmas Day; the {{norman-conquest|Conquest}} begins in earnest.`},{year:`1069–70`,label:`Harrying of the North`,detail:`Systematic devastation of Yorkshire and beyond; a generation later Domesday still writes "waste".`},{year:`1086`,label:`{{domesday|Domesday Book}}`,detail:`The Conquest audited — using the machinery of the conquered.`},{year:`1135–53`,label:`The Anarchy`,detail:`Stephen v. Matilda: England's first war over a female succession ends with a compromise heir — {{henry-ii|Henry Plantagenet}}.`},{year:`1170`,label:`{{thomas-becket|Becket}} murdered`,detail:`Four knights take the king's rage literally; Canterbury becomes a shrine of European rank.`},{year:`1189–99`,label:`Richard the Lionheart`,detail:`Ten years king, perhaps six months in England; his ransom alone was a fiscal earthquake.`},{year:`1204`,label:`Normandy lost`,detail:`{{king-john|John}} loses the duchy that made the dynasty — and the barons start becoming Englishmen.`}]}]},{id:`int1`,part:1,title:`Five Centuries After Bede`,subtitle:`Interlude`,era:`looking back`,blurb:`The Anglo-Saxon centuries left fewer records than any later age — which is exactly why every later age felt free to rewrite them. An interlude on how the English have used their oldest past.`,blocks:[{t:`p`,x:`Here Tombs pauses the narrative for the first of his backward glances. The question is not what happened between {{bede|Bede}} and Hastings, but what later generations did with it. The answer: almost anything they liked. No stretch of English history has been remembered, forgotten, and reinvented so often.`},{t:`h`,x:`Keeping the story alive`},{t:`p`,x:`The {{norman-conquest|Conquest}} could have buried English history along with the English nobility. It did not, because monks refused to let it. Within two generations, historians of mixed Norman and English blood — William of Malmesbury, Henry of Huntingdon — wrote Latin chronicles that stitched the old English kings into the new order, and at Peterborough monks kept the Anglo-Saxon Chronicle going in English until 1154. Bede's great invention, a people who understood themselves through history books, survived the people's defeat.`},{t:`h`,x:`The free Saxons and the Norman Yoke`},{t:`p`,x:`Out of that survival grew a myth with a long life: that before 1066 the English were free, governed by their own laws and assemblies, and that the Normans imposed a foreign tyranny — the {{norman-yoke|Norman Yoke}} — which the nation had been shaking off ever since. In the 1640s the {{levellers|Levellers}} used it to demand the vote as a stolen birthright. It was bad history; the Conquest did not destroy English law, and pre-Conquest England was no democracy. But it fixed a lasting habit of mind: English radicals would claim to be restoring old liberties, not inventing new ones.`},{t:`argument`,x:`Tombs treats the {{norman-yoke|Norman Yoke}} as the master example of a recurring English trope: reform presented as restoration. From {{magna-carta|Magna Carta}} to the {{civil-war|Civil War}} to the Victorians, the English changed things by insisting they were changing them back.`},{t:`h`,x:`Antiquarians with an agenda`},{t:`p`,x:`The Tudor {{reformation-england|Reformation}} sent scholars hunting through the wreckage of the monastic libraries for useful ancestors. Archbishop Matthew Parker collected Anglo-Saxon manuscripts to prove that a plain, English-minded church had existed long before Rome tightened its grip — so {{church-of-england|Henry VIII's church}} was a return, not a rupture. Lawyers did the same for the {{common-law|common law}}: Sir Edward Coke argued it was immemorial custom, older than any conqueror. Anglo-Saxon studies began not as scholarship but as ammunition.`},{t:`h`,x:`Race, empire, and the reaction`},{t:`p`,x:`The Victorians turned the free Saxons into a race. Historians such as E. A. Freeman and William Stubbs found the seed of {{parliament|Parliament}} in the {{witan|Witan}} and traced English liberty to the forests of ancient Germany; this "Anglo-Saxonism" crossed the Atlantic, where it flattered Americans as the freedom-carrying branch of a superior stock and helped justify expansion. It fitted the confident {{whig-history|Whig story}} of inevitable liberty — and it curdled into racial theory that the twentieth century would discredit for good.`},{t:`p`,x:`The modern rescue came from unexpected quarters. In 1939 the ship burial at Sutton Hoo yielded gold, garnet, and craftsmanship that made the phrase "Dark Ages" absurd. Three years earlier J. R. R. Tolkien, a professional Anglo-Saxonist, had told scholars to read *Beowulf* as a great poem rather than a quarry of ethnographic scraps — and his own fiction carried a loving image of the early English to millions. Archaeology and philology replaced race as the way into the period.`},{t:`reading`,title:`Sutton Hoo: the argument in a burial mound`,blocks:[{t:`p`,x:`The Suffolk ship burial, probably for King Rædwald of East Anglia (died around 625), was excavated on the eve of the Second World War. Its treasures — a helmet, a great gold buckle, silver from Byzantium, coins from Gaul — showed that seventh-century {{anglo-saxon-england|England}} was rich, skilled, and plugged into trade routes reaching the eastern Mediterranean.`},{t:`p`,x:`For Tombs the find matters as historiography as much as history: a single dig did more to overturn the caricature of a barbarous age than a century of pleading by scholars. Physical evidence is now doing for the Anglo-Saxons what written sources are too thin to do.`}]},{t:`p`,x:`Tombs' closing point is a warning that hangs over the rest of the book. Precisely because this era left the fewest sources, it has been the most freely rewritten: monks made it edifying, radicals made it free, Protestants made it Protestant, Victorians made it racial, and moderns made it material. Every age of English history has found what it went looking for in the age before the Conquest.`}]},{id:`ch03`,part:2,number:`3`,title:`A Well Good Land`,era:`c.1200–1348`,blurb:`High-medieval England: crowded, commercial, litigious, and increasingly governed by consent. In these five generations {{parliament|Parliament}} and the {{common-law|common law}} stop being experiments and start bearing weight — while the island quietly fills up with more people than it can feed.`,blocks:[{t:`p`,x:`A medieval writer called England "a well good land" — fertile, temperate, full of towns and churches — and for once the boast was roughly true. Between 1200 and 1348 England was one of the busiest corners of Europe. Tombs uses these years to demolish a caricature: this is not a "Dark Age" of mud and ignorance but a society of markets, documents, and lawsuits, where a villager might sue his neighbour, sell his wool into a European trade, and send his son to a school.`},{t:`h`,x:`A crowded, trading island`},{t:`p`,x:`The population roughly tripled between {{domesday|Domesday}} and 1300, from perhaps two million to five million or more. Every usable acre came under the plough; marsh was drained, forest cleared, and holdings shrank as families divided them. The engine of the economy was wool: millions of fleeces went every year to the weavers of Flanders, and the profits built churches, bridges, and fortunes. Towns multiplied — hundreds of new chartered boroughs and markets — and {{london|London}}, with maybe 80,000 people, became one of the great cities of Christendom.`},{t:`chart`,kind:`line`,title:`Population of England, 1086–1348`,unit:`millions`,xLabel:`year`,series:[{name:`Estimated population`,points:[{x:1086,y:2},{x:1150,y:3},{x:1200,y:3.7},{x:1250,y:4.5},{x:1300,y:5.5},{x:1348,y:5}]}],note:`Figures are rough estimates; historians' guesses for 1300 range from about 4 to 6 million. The dip after 1300 reflects the great famine of 1315–17.`},{t:`h`,x:`The charter that would not die`},{t:`p`,x:`{{magna-carta|Magna Carta}} should have been a footnote: {{king-john|John}} repudiated it within weeks and died the next year. Instead his son's regents reissued it in 1216 and 1217, and in 1225 Henry III reissued it again in exchange for a tax — fixing the bargain at the heart of English politics: money for the crown in return for law kept. Reconfirmed dozens of times over the century, the Charter turned from a failed peace treaty into something like fundamental law, and the principle it fed — no taxation without consent — needed a body to do the consenting.`},{t:`voice`,source:`Magna Carta, clause 39 (1215), in the customary English rendering`,x:`"No free man shall be seized or imprisoned... except by the lawful judgment of his equals or by the law of the land." Written to protect barons; read, for eight centuries afterwards, as protecting everyone.`},{t:`p`,x:`That body emerged from a rebellion. Henry III's expensive incompetence drove the barons, led by Simon de Montfort, to impose conciliar rule on him in 1258; when the deal collapsed, de Montfort beat and captured the king at Lewes in 1264. Needing support beyond the barons, he summoned a {{parliament|parliament}} in January 1265 that included not only knights of the shires but burgesses from the towns — the first time ordinary townsmen sat in a national assembly. De Montfort was killed and dismembered at Evesham within the year, but the experiment outlived him: kings discovered that a parliament with commoners in it was the easiest machine ever invented for raising taxes.`},{t:`h`,x:`Edward I: hammer and lawgiver`},{t:`p`,x:`Edward I (1272–1307) made war on Britain and law in England. He conquered Wales in campaigns of 1277 and 1282–83, ringing the north with castles — Caernarfon, Conwy, Harlech — and naming his heir Prince of Wales. From 1296 he tried the same in Scotland and failed, starting a border war that would sputter for centuries. War on this scale devoured money, and money meant consent: his so-called Model Parliament of 1295 summoned lords, clergy, knights, and burgesses together, and by his death taxation-by-consent through {{parliament|Parliament}} was settled practice. His statutes overhauled land law and policing so thoroughly that lawyers still cite them.`},{t:`p`,x:`The same king committed the era's great crime. England's small Jewish community — perhaps two or three thousand people — had been the crown's milch-cow for a century, taxed without consent precisely because Jews stood outside the protections everyone else was accumulating, and battered by massacres and blood libels. Having squeezed them dry and banned their lending, Edward expelled every Jew from England in 1290, the first such national expulsion in Europe. They were not readmitted for over 350 years. Tombs notes the bleak logic: a state strong enough to protect rights was strong enough to strip them from those it excluded.`},{t:`argument`,x:`Thirteenth-century England was already what it would long remain: a much-governed, law-soaked, market-minded society. {{parliament|Parliament}} and the {{common-law|common law}} were no longer novelties but load-bearing walls — the crown could not tax, and increasingly could not act, without them. The 'Dark Ages' caricature obscures the fact that the constitutional machinery of modern England was built by people in the thirteenth century.`},{t:`h`,x:`Parish, cathedral, school`},{t:`p`,x:`Religion was local and universal at once. The parish — England had about 9,000 — was the frame of ordinary life: baptism, marriage, burial, feast and fast, all within earshot of one bell. Above the parishes rose the age's most astonishing buildings: Salisbury cathedral went up in a single generation, Lincoln's spire reached higher than anything yet built by man. And learning found permanent homes: scholars clustered at Oxford from the twelfth century and, after a violent town-and-gown quarrel in 1209, some fled to found Cambridge. England now trained its own lawyers, clerks, and bishops.`},{t:`reading`,title:`Why was medieval England so litigious?`,blocks:[{t:`p`,x:`The {{common-law|common law}} that {{henry-ii|Henry II}} had systematized worked on a simple, brilliant mechanism: standard royal writs. For a small fee, a free man could buy a writ that pulled his dispute — over land, debt, inheritance — out of his lord's court and into the king's, where a {{jury-trial|jury}} of local men decided the facts. Royal justices rode circuits to bring the court to the counties.`},{t:`p`,x:`The result was a society that sued rather than feuded, and a paper trail historians still mine: millions of entries survive in the plea rolls. Tombs' point is that law was not imposed on the English from above; they consumed it eagerly, and their appetite for it made the king's courts — and so the king's state — grow.`}]},{t:`timeline`,title:`From charter to catastrophe`,events:[{year:`1215`,label:`{{magna-carta|Magna Carta}} sealed at Runnymede`,detail:`Annulled within weeks — then reissued after {{king-john|John}}'s death, and reconfirmed for a century.`},{year:`1225`,label:`The definitive reissue`,detail:`Henry III grants the Charter in exchange for a tax: law kept for money paid, the deal that makes {{parliament|Parliament}}.`},{year:`1258`,label:`Provisions of Oxford`,detail:`Barons led by Simon de Montfort put the king under conciliar rule.`},{year:`1265`,label:`De Montfort's parliament`,detail:`Knights *and burgesses* summoned for the first time; de Montfort dies at Evesham months later, but the precedent holds.`},{year:`1277–83`,label:`Edward I conquers Wales`,detail:`Two campaigns, a ring of great castles, and the end of Welsh independence.`},{year:`1290`,label:`The Jews expelled`,detail:`Every Jew ordered out of England — the first national expulsion in Europe. Readmission comes only in the 1650s.`},{year:`1295`,label:`The Model Parliament`,detail:`Lords, clergy, knights, and burgesses together; taxation-by-consent becomes settled practice.`},{year:`1315–17`,label:`The Great Famine`,detail:`Harvests fail across northern Europe; an overstretched population starves in the hundreds of thousands.`},{year:`1348`,label:`The plague lands`,detail:`Ships bring the {{black-death|Black Death}} to Dorset in high summer.`}]},{t:`h`,x:`The hinge: too many people, and a ship from the south`},{t:`p`,x:`By 1300 the well good land was full. Holdings had shrunk below what a family could live on, real wages had sagged, and when the rains ruined the harvests of 1315–17 people starved in a country that a century earlier had fed itself with ease. England entered the 1340s crowded, hungry at the margins, and at war with France. In the summer of 1348 a ship put in at Melcombe Regis on the Dorset coast carrying, along with its cargo, the {{black-death|Black Death}}. What it did to this brimming island is the next chapter.`}]},{id:`ch04`,part:2,number:`4`,title:`The World Is Changed and Overthrown`,era:`1348–c.1500`,blurb:`The {{black-death|Black Death}} kills perhaps half of England — and the survivors inherit higher wages, looser bonds, and a language of their own. A century and a half of plague, revolt, lost wars, and dynastic bloodletting that ends with the English freer, richer, and speaking English.`,blocks:[{t:`p`,x:`A chronicler wrote after the plague that the world was "changed and overthrown", and Tombs takes him at his word. This chapter runs from the worst demographic disaster in English history to the battle of Bosworth, and its through-line is a hard paradox: catastrophe did not wreck the society the last chapter described — it accelerated it. Death freed the living, and out of the wreckage came an English-speaking nation.`},{t:`h`,x:`The Great Mortality`},{t:`p`,x:`The {{black-death|plague}} came ashore in Dorset in the summer of 1348 and burned across the country within a year. The dead cannot be counted exactly, but modern estimates run to around half the population — and the plague came back, in 1361 and repeatedly for three centuries, mowing down each new generation. Whole villages emptied and never refilled; England did not regain its pre-plague population until the 1600s. Contemporaries read it as the wrath of God. Its economic meaning was simpler: land was suddenly cheap, and people suddenly precious.`},{t:`p`,x:`Landlords understood at once. With labourers scarce, wages jumped, and {{parliament|Parliament}} tried to freeze them at pre-plague rates with the Statute of Labourers (1351). It failed, as price controls against a market that strong usually do. Serfs — villeins bound to the lord's land and courts — found they could simply walk to a better offer, and lords competing for tenants quietly dropped servile dues. {{feudalism|Serfdom}} in England was never abolished; between 1350 and 1500 it evaporated.`},{t:`h`,x:`The rising and the heresy`},{t:`p`,x:`Attempts to hold the old line produced the explosion of 1381. A third poll tax in four years — flat-rate, so heaviest on the poor — lit the {{peasants-revolt|Peasants' Revolt}}: the men of Kent and Essex marched on {{london|London}}, burned the Savoy Palace, and beheaded the archbishop of Canterbury and the treasurer. The preacher John Ball asked the question that outlived the revolt: "When Adam delved and Eve span, who was then the gentleman?" The fourteen-year-old Richard II talked the rebels home with promises he then broke, and the leaders were hanged. Yet the rebels lost the week and won the century: the poll tax was dropped and serfdom went on dissolving.`},{t:`p`,x:`Rebellion in the church matched rebellion in the fields. The Oxford theologian John Wyclif attacked the wealth of the clergy and the pope's authority, and his followers — the {{lollards|Lollards}} — spread English translations of the Bible and a stubborn, home-grown scepticism about priests, pilgrimages, and the mass. The establishment answered with a statute for burning heretics (1401), and Lollardy was driven underground. It never quite died; a century later, {{reformation-england|reformers}} would find the ground already loosened.`},{t:`argument`,x:`Tombs' claim is that the {{black-death|Black Death}} was an accelerant, not just a horror. Trends already visible — wage labour, peasant land-buying, English ousting French, the {{house-of-commons|Commons}} bargaining over taxes — all sped up when labour became scarce and government became needy. The disaster that killed half the English made the survivors richer, freer, and harder to rule.`},{t:`h`,x:`France won and lost`},{t:`p`,x:`The {{hundred-years-war|war with France}} that {{edward-iii|Edward III}} had begun flared back to life under {{henry-v|Henry V}}, the most formidable of medieval English kings. At {{agincourt|Agincourt}} in 1415 his sick, outnumbered army destroyed the French nobility in a few hours of mud and arrows; by the Treaty of Troyes (1420) he was heir to the French crown. Then he died at thirty-five, leaving a baby. Joan of Arc turned the tide at Orléans in 1429, and the English position rotted for a generation until, in 1453, the last field army was smashed at Castillon. Of the whole continental inheritance, only Calais remained. Three centuries of English kings holding lands in France were over.`},{t:`h`,x:`Cousins at war`},{t:`p`,x:`Defeat abroad broke the peace at home. Henry VI, pious and periodically insane, presided over bankruptcy and humiliation, and the royal cousins fought for the wheel: the {{wars-of-roses|Wars of the Roses}}, Lancaster against York, ran on and off from 1455 to 1485. Towton (1461) was perhaps the bloodiest battle ever fought on English soil; Edward IV won the crown, lost it, and won it back; his brother Richard III took the throne past his young nephews, who vanished in the Tower. In 1485 the near-unknown Henry Tudor killed Richard at Bosworth and married the wars shut, uniting Lancaster and York. Tombs adds the deflating footnote: for all the noble blood spilled, the fighting was brief and localized, and most English life — ploughing, trading, suing — went on barely interrupted.`},{t:`widget`,id:`dynastic-tree`},{t:`h`,x:`An English-speaking nation`},{t:`p`,x:`Beneath the dynastic noise, the century's quietest change was the biggest. English — for three hundred years the language of the ruled, not the rulers — took back the country's public life. Parliament was opened in English in 1362; {{henry-v|Henry V}} pointedly wrote his letters home in it; the crown's clerks standardized "Chancery English", the ancestor of the written standard. Chaucer chose English for the *Canterbury Tales* and proved it could do anything French could. And in 1476 William Caxton set up England's first printing press at Westminster, fixing the language in type and selling it by the shelf-load to a public that could increasingly read.`},{t:`reading`,title:`The golden age of the English labourer`,blocks:[{t:`p`,x:`Historians of wages find something startling in the 1400s: by mid-century a building labourer's real earnings stood higher than they would be again until the Victorian era. Fewer mouths meant cheaper bread and dearer hands; ordinary people ate more meat, drank more ale, wore better wool, and left wills disposing of goods their great-grandparents never owned.`},{t:`p`,x:`The land market tells the same story. Servile tenures decayed into copyhold — effectively secure, heritable tenancies — and a rising class of yeomen farmed consolidated holdings for the market. Tombs stresses the point because it grounds the whole chapter: 'the world overthrown' was, for the survivors and their children, a better world than the crowded, hungry island of 1348.`}]},{t:`timeline`,title:`Catastrophe and consequence`,events:[{year:`1348–49`,label:`The {{black-death|Black Death}}`,detail:`Perhaps half of England dies within eighteen months; the plague returns for generations.`},{year:`1351`,label:`Statute of Labourers`,detail:`{{parliament|Parliament}} tries to freeze wages at pre-plague levels. The market ignores it.`},{year:`1381`,label:`The {{peasants-revolt|Peasants' Revolt}}`,detail:`Poll-tax rebels take {{london|London}} and behead the archbishop; crushed, but the poll tax dies with them.`},{year:`1415`,label:`{{agincourt|Agincourt}}`,detail:`{{henry-v|Henry V}}'s outnumbered army destroys the French nobility.`},{year:`1453`,label:`France lost`,detail:`Defeat at Castillon ends the {{hundred-years-war|Hundred Years' War}}; only Calais remains.`},{year:`1455–85`,label:`The {{wars-of-roses|Wars of the Roses}}`,detail:`Lancaster and York fight for a bankrupt crown; three kings die violently.`},{year:`1476`,label:`Caxton's press`,detail:`The first English printing press, at Westminster, fixes the language in type.`},{year:`1485`,label:`Bosworth`,detail:`Henry Tudor kills Richard III and marries Elizabeth of York; the Tudor age begins.`}]},{t:`h`,x:`The hinge: a new dynasty, an old church`},{t:`p`,x:`By 1500 England was thinly peopled, well fed, precociously governed, and — a new thing in its history — monoglot English from plough to throne. The Tudors set about making the crown solvent and the nobility tame. What nobody foresaw was that the next great overthrow would come not from plague or dynastic war but from the king's conscience, or his lack of one: within a generation {{henry-viii|Henry VIII}} would tear the English church away from Rome, and the {{reformation-england|Reformation}} would divide the English against each other for centuries. That storm is the next part's story.`}]},{id:`int2`,part:2,title:`Writing the Middle Ages`,subtitle:`Interlude`,era:`looking back`,blurb:`How the medieval centuries were retold — by Tudor propagandists, by Shakespeare, by Victorian romantics — and why, for most English people, "the Middle Ages" is still a stage production.`,blocks:[{t:`p`,x:`Tombs' second backward glance asks how the centuries between Hastings and Bosworth entered the national memory. The short answer: through the theatre. No period of English history has been so completely taken over by its own dramatization.`},{t:`h`,x:`The Tudor myth`},{t:`p`,x:`The new dynasty needed the old century to look terrible. Tudor chroniclers — Edward Hall in the 1540s, Raphael Holinshed in the 1570s — shaped the fifteenth century into a morality tale: the deposition of Richard II was a sin, the {{wars-of-roses|Wars of the Roses}} were God's punishment for it, and the Tudors were providence's rescue. Hall's title said it plainly: a history of *the union of the two noble and illustre families of Lancaster and York*. It was tidy, useful, and — as the last chapter argued — a wild exaggeration of how much the wars had actually disrupted English life.`},{t:`h`,x:`Shakespeare's Middle Ages`},{t:`p`,x:`Then Shakespeare raided the chronicles and fixed the story for good. Across eight linked history plays he staged the whole arc from Richard II to Bosworth, and his versions displaced the facts: Richard III the witty crookback murderer; Prince Hal maturing into {{henry-v|Henry V}} and his "band of brothers" at {{agincourt|Agincourt}}; old John of Gaunt's dying hymn to "this sceptred isle". These are among the most quoted lines in the language, and every one comes from a playwright working a century or more after the events, from sources built to flatter his queen's grandfather.`},{t:`argument`,x:`Tombs' point is blunt: Shakespeare is the most influential English historian who ever lived. For most English people the medieval past *is* his production — its heroes, its villains, its shape as a story — and academic history has been correcting the script for four hundred years without ever driving it off the stage.`},{t:`h`,x:`Gothic dreams`},{t:`p`,x:`The romantics rebuilt the Middle Ages a second time, as an antidote to factories. The Gothic revival put pointed arches on churches, town halls, and — after the 1834 fire — the Houses of {{parliament|Parliament}} themselves, dressing the modern constitution in medieval stone. Walter Scott's *Ivanhoe* (1819) did for readers what architects did for skylines: its noble Saxons and arrogant Normans carried the old {{norman-yoke|Norman Yoke}} myth to a mass audience, and folded Robin Hood into it. The outlaw of the medieval ballads had been a yeoman with a grievance; the Victorians made him a dispossessed Saxon gentleman robbing the rich for the poor — a history of class and conquest retold as greenwood romance.`},{t:`h`,x:`The revisionists`},{t:`p`,x:`Modern historians have spent a century dismantling the Tudor caricatures: the fifteenth century now looks less like anarchy than like prosperous decades punctuated by short, small campaigns. The liveliest front is Richard III. Defenders have argued since the eighteenth century that he was a competent king framed by Tudor spin; the Richard III Society keeps the case alive, and in 2012 his skeleton — curved spine, battle wounds — was dug from under a Leicester car park and reburied in the cathedral before a global audience. The debate itself proves Tombs' point: five centuries on, the argument is still with Shakespeare's villain, on ground the playwright chose.`},{t:`p`,x:`The pattern of the first interlude repeats. The Tudors made the Middle Ages a warning, Shakespeare made them a drama, the Victorians made them a refuge, and each remade century said more about its makers than about the {{black-death|plague}}-scarred, {{common-law|litigious}}, English-speaking society the records actually show. The past kept being useful — which is, Tombs suggests, the most English thing about it.`}]},{id:`ch05`,part:3,number:`5`,title:`Reformation`,era:`c.1500–1603`,blurb:`A king's marriage problem tore England from a thousand years of Catholic Christendom. Tombs argues the {{reformation-england|Reformation}} was forced on a devout country from above — and that the wound it opened, the "Great Divide" between Protestant and Catholic, organized English identity and politics for the next century and a half.`,blocks:[{t:`p`,x:`In 1500 England was among the most pious countries in Europe. Its parish churches were freshly rebuilt, its guilds and shrines flourished, and its people gave money and labour to the old religion with no sign of fatigue. Within two generations that world was smashed — not by popular demand, but by the state. Tombs makes the point bluntly: the English {{reformation-england|Reformation}} began not as a movement of the people but as an act of power, and its motor was a king who needed a son.`},{t:`h`,x:`The King's Great Matter`},{t:`p`,x:`{{henry-viii|Henry VIII}} had defended the pope against Luther and been rewarded with the title "Defender of the Faith". But by the late 1520s his marriage to Catherine of Aragon had produced no living son, and the pope — effectively a prisoner of Catherine's nephew, the Emperor Charles V — would not grant an annulment. Henry's answer, worked out by Thomas Cromwell, was breathtaking: if Rome would not oblige, England would leave Rome. The Act of Supremacy (1534) declared the king Supreme Head of the {{church-of-england|Church of England}}. Those who refused the oath, including Thomas More, went to the block. Archbishop {{thomas-cranmer|Thomas Cranmer}} annulled the marriage; Anne Boleyn was crowned, and then, three years later, beheaded.`},{t:`p`,x:`The break brought plunder. Between 1536 and 1540 the {{dissolution-monasteries|dissolution of the monasteries}} closed roughly 800 religious houses and transferred perhaps a quarter of the land of England to the Crown — which promptly sold most of it to gentry and speculators, creating a propertied class with a permanent stake in the Reformation. The north rose in protest: the Pilgrimage of Grace (1536), the largest rebellion in Tudor England, put tens of thousands of men under the banner of the Five Wounds of Christ. Henry promised pardons, then hanged the leaders. It was a warning of how unwillingly much of the country followed its king.`},{t:`argument`,x:`Tombs sides with the revisionist historians: pre-Reformation Catholicism was healthy, popular, and loved, and the Reformation was imposed on a largely reluctant nation by royal command, statute, and the gallows. What made it stick was not conviction at first but obedience, property, and time — and, eventually, a new Protestant patriotism forged in fear of Catholic Europe.`},{t:`h`,x:`The pendulum: Edward, Mary, Elizabeth`},{t:`p`,x:`Henry died in 1547 still thinking himself a good Catholic, minus the pope. His son changed that. Under the boy-king {{edward-vi|Edward VI}}, real {{protestantism|Protestantism}} arrived: images smashed, altars replaced with plain tables, chantries closed, and worship rewritten in English by Cranmer in the {{book-of-common-prayer|Book of Common Prayer}} (1549, radicalized 1552). The 1549 prayer book helped ignite risings in Devon and Cornwall, put down with slaughter, while Kett's rebels in Norfolk rose over land grievances the same summer. Then Edward died at fifteen, and the pendulum swung back.`},{t:`p`,x:`{{mary-i|Mary I}}, Catherine of Aragon's daughter, restored {{catholicism|Catholicism}} and reunion with Rome — to genuine relief in much of the country. But her burning of some 280 Protestants, Cranmer among them, and her marriage to Philip of Spain handed her enemies an imperishable weapon. When she died childless in 1558 after just five years, her half-sister reversed course once more.`},{t:`widget`,id:`reformation-pendulum`},{t:`p`,x:`{{elizabeth-i|Elizabeth I}} built a deliberate hybrid: Protestant doctrine inside a traditional shell of bishops, cathedrals, and ceremony, with a prayer book worded so that both camps could half-recognize their beliefs in it. She called herself Supreme Governor, not Head, and famously declined to make windows into men's souls. The settlement satisfied neither Catholics, who were slowly squeezed into a persecuted minority, nor the hotter sort of Protestants — the {{puritans|Puritans}} — who thought the church only half-reformed and wanted the job finished. Both discontents would shape the next century.`},{t:`h`,x:`Armada and the birth of Protestant England`},{t:`p`,x:`From 1570, when the pope excommunicated Elizabeth and released her subjects from obedience, English Catholicism became entangled — fairly or not — with treason. Plots swirled around the captive Mary Queen of Scots until Elizabeth reluctantly had her executed in 1587. The next year Philip II sent the {{spanish-armada|Armada}}: 130 ships to escort an invasion army from Flanders. English gunnery, fireships, and Atlantic gales wrecked the enterprise, and Protestant England read its deliverance as the verdict of God — the "Protestant wind".`},{t:`p`,x:`The mental world this created is Tombs' real subject. {{foxes-martyrs|Foxe's Book of Martyrs}} (1563), with its harrowing accounts of the Marian burnings, sat chained in churches beside the Bible and taught the English to see themselves as an elect nation persecuted by Rome. {{anti-popery|Anti-popery}} — the reflex fear of Catholic power, foreign and domestic — became the strongest political emotion in England, capable of moving crowds and toppling ministries for two hundred years. Protestantism and Englishness fused.`},{t:`reading`,title:`The Great Divide`,blocks:[{t:`p`,x:`Tombs calls the Reformation the opening of the "Great Divide": the deepest rupture in English history, cutting the country off from its own past — its saints, shrines, and ancestors' religion — and splitting Christendom into armed camps. For roughly 150 years, the central question of English politics was religious: was the Reformation safe? Every crisis of the seventeenth century, from the {{gunpowder-plot|Gunpowder Plot}} to civil war to the fall of James II, ran along this fault line.`},{t:`p`,x:`Historians once told the story the other way round: a corrupt medieval church swept away by a popular reform whose time had come. Since the 1980s, scholars such as Eamon Duffy have documented the vitality of traditional religion and the coercion needed to end it. Tombs builds on this newer picture — which makes the eventual triumph of Protestant identity more remarkable, not less.`}]},{t:`timeline`,title:`The Tudor Reformation`,events:[{year:`1534`,label:`Act of Supremacy`,detail:`{{henry-viii|Henry VIII}} becomes Supreme Head of the Church of England; the break with Rome is law.`},{year:`1536–40`,label:`{{dissolution-monasteries|Dissolution of the monasteries}}`,detail:`Roughly 800 religious houses closed; a vast transfer of land creates winners committed to the new order.`},{year:`1536`,label:`Pilgrimage of Grace`,detail:`The north rises for the old religion — the biggest Tudor rebellion. Henry breaks his promises and hangs the leaders.`},{year:`1549`,label:`First {{book-of-common-prayer|Book of Common Prayer}}`,detail:`Worship in English; the West Country rebels against the "Christmas game" and is crushed.`},{year:`1553`,label:`{{mary-i|Mary I}} restores Catholicism`,detail:`Reunion with Rome — and some 280 Protestants burned, a toll {{foxes-martyrs|Foxe}} would never let England forget.`},{year:`1559`,label:`Elizabethan Settlement`,detail:`{{elizabeth-i|Elizabeth}}'s hybrid church: Protestant doctrine, traditional forms, deliberate ambiguity.`},{year:`1570`,label:`Pope excommunicates Elizabeth`,detail:`English Catholics are caught between queen and pope; loyalty becomes suspect.`},{year:`1588`,label:`{{spanish-armada|Spanish Armada}} defeated`,detail:`Guns, fireships, and gales scatter the invasion fleet; Protestant England sees the hand of God.`}]},{t:`h`,x:`The unfinished settlement`},{t:`p`,x:`Elizabeth died in 1603 after 44 years, having made her compromise stick by outliving everyone who hated it. But she left it unfinished. The {{puritans|Puritans}} still pressed for a purer church; Catholics still hoped and plotted; and the crown of England now passed to a Scottish king with firm ideas about the {{divine-right|divine right}} of kings. The religious passions the Tudors had raised and never resolved would, within two generations, blow the whole polity apart.`}]},{id:`ch06`,part:3,number:`6`,title:`Revolution`,era:`1603–1689`,blurb:`The Stuart century: England's only revolution, a king beheaded, a republic tried and abandoned, and a second, quieter coup in 1688 that fixed the shape of English government. Tombs reads the {{civil-war|Civil War}} not as a class struggle but as the last and worst of Europe's wars of religion — fought, uniquely, inside one country.`,blocks:[{t:`p`,x:`The Tudors left a time bomb: a half-reformed church, a crown dependent on Parliament for money, and a nation that read {{foxes-martyrs|Foxe}} and feared popery above all else. Over four Stuart reigns it detonated. This chapter runs from the union of the crowns to the {{glorious-revolution|Glorious Revolution}} — the most violent stretch of English history since the Conquest, and the source, Tombs argues, of a lasting English distrust of zeal.`},{t:`h`,x:`The wisest fool and his stubborn son`},{t:`p`,x:`James VI of Scotland became James I of England in 1603, a learned, unkempt king who wrote books defending the {{divine-right|divine right}} of kings. He was cautious and kept the peace; even the {{gunpowder-plot|Gunpowder Plot}} of 1605 — a Catholic scheme to blow up king and Parliament — ended mainly in the annual bonfires that burned {{anti-popery|anti-popery}} into the calendar. His son had the theory without the caution. {{charles-i|Charles I}} was rigid, shifty, and devoted to a ceremonial style of worship his {{puritans|Puritan}} subjects could not tell apart from Rome. After quarrels over taxes and religion he dissolved Parliament in 1629 and ruled without one for eleven years on half-forgotten levies like Ship Money.`},{t:`p`,x:`The personal rule died in Scotland. In 1637 Charles forced an English-style prayer book on the Presbyterian Scots; they signed a National Covenant and raised an army. Beaten and bankrupt, Charles had to call the English Parliament in 1640, which dismantled his machinery of rule. A Catholic rising in Ireland in 1641 poisoned the crisis: both king and Parliament needed an army, and neither dared let the other have it. In January 1642 Charles marched into the Commons to arrest five members and found the birds flown; by summer England was at war with itself.`},{t:`argument`,x:`Tombs rejects readings of the {{civil-war|Civil War}} as bourgeois revolution or constitutional inevitability. It was a war of religion — the last and worst of the wars set off by the Reformation, between {{puritans|Puritans}} who thought the Reformation in mortal danger and men who rallied to church and king. Gentry, merchants, and counties split down the middle; religion did the sorting. And it was catastrophic: proportionally, the fighting and its diseases killed a larger share of the population of these islands than the First World War.`},{t:`h`,x:`War, regicide, republic`},{t:`p`,x:`Parliament held London, the navy, and the richer south-east, and built the best army England had seen, the New Model: professional, promoted on merit, ablaze with godly conviction. Its rising star was a Huntingdonshire squire, {{oliver-cromwell|Oliver Cromwell}}. Defeat at Naseby (1645) ended the first war; Charles's intrigues restarted it and exhausted the army's patience. A purged Parliament tried the king for treason against his own people, and on 30 January 1649 he was beheaded outside his own Banqueting House, dying with a dignity that began his rehabilitation. England became a {{commonwealth|Commonwealth}} — a republic — for the only time in its history.`},{t:`p`,x:`The war unleashed ideas as well as armies. The {{levellers|Levellers}} demanded something close to manhood suffrage — "the poorest he that is in England hath a life to live, as the greatest he" — and were faced down by Cromwell; Diggers, Ranters, and Quakers pushed further still. Cromwell conquered Ireland with a brutality Tombs does not soften — the massacres at Drogheda and Wexford, mass dispossession of Catholic landowners — leaving a scar that never healed. At home the Lord Protector was a king in all but name; when he died in 1658 the republic, never legitimate beyond the sword, collapsed within two years.`},{t:`voice`,source:`Charles I on the scaffold, 30 January 1649`,x:`The king went to the block insisting to the end that the people's liberty lay in having a government, "not in having share in government: that is nothing pertaining to them" — "a sovereign and a subject are clean different things". Two irreconcilable Englands stood on that scaffold; only one walked away.`},{t:`h`,x:`Restoration and the return of the fear`},{t:`p`,x:`In 1660 {{charles-ii|Charles II}} came home to bells and bonfires — the {{restoration|Restoration}} of king, church, and, pointedly, Parliament. Charles was determined, as he said, never to go on his travels again. His reign survived the plague of 1665 and the {{great-fire|Great Fire}} of 1666. Then the old fear returned: the heir, Charles's brother James, was a Catholic. The crisis over excluding him from the throne (1679–81) created the first parties — exclusionists were called Whigs, the king's defenders Tories, both names originally insults — and began the {{whigs-tories|Whig and Tory}} duel that structured English politics for two centuries.`},{t:`p`,x:`{{james-ii|James II}} succeeded peacefully in 1685, then wrecked himself in three years: Catholic officers in a standing army, purges of universities and county benches, bishops tried for petitioning against his policies. The nation waited for his Protestant daughter Mary to inherit — until June 1688, when the queen bore a son and made a Catholic dynasty likely forever. Seven notables invited Mary's husband, the Dutch stadtholder {{william-iii|William of Orange}}, to intervene. He landed at Torbay with a large army; James's support dissolved, and he fled to France, dropping the Great Seal in the Thames.`},{t:`timeline`,title:`The Stuart century`,events:[{year:`1603`,label:`James I unites the crowns`,detail:`The Scottish king inherits England; one monarch, still two kingdoms and two churches.`},{year:`1605`,label:`{{gunpowder-plot|Gunpowder Plot}}`,detail:`A Catholic plot to blow up king and Parliament fails; 5 November feeds {{anti-popery|anti-popery}} for centuries.`},{year:`1637`,label:`Prayer-book riot in Edinburgh`,detail:`{{charles-i|Charles}}'s liturgy for Scotland ignites the Covenanter revolt that ends his personal rule.`},{year:`1642`,label:`{{civil-war|Civil War}} begins`,detail:`Charles raises his standard at Nottingham; the country splits, mostly along religious lines.`},{year:`1649`,label:`Charles I executed`,detail:`Tried by a purged Parliament; England becomes a republic — the {{commonwealth|Commonwealth}}.`},{year:`1653`,label:`{{oliver-cromwell|Cromwell}} becomes Lord Protector`,detail:`Rule by a godly soldier who twice dismissed his own parliaments.`},{year:`1660`,label:`{{restoration|Restoration}} of {{charles-ii|Charles II}}`,detail:`Monarchy and church return; the regicides, dead and alive, are punished.`},{year:`1666`,label:`{{great-fire|Great Fire}} of London`,detail:`A year after the plague, most of the old City burns in four days.`},{year:`1688–89`,label:`{{glorious-revolution|Glorious Revolution}}`,detail:`{{william-iii|William of Orange}} lands, {{james-ii|James II}} flees; the Bill of Rights sets the terms of the new monarchy.`}]},{t:`h`,x:`1688: glorious for whom?`},{t:`p`,x:`The settlement of 1689 gave England its nearest thing to a written constitution. The Bill of Rights barred the crown from suspending laws, keeping a peacetime army, or taxing without Parliament; only Protestants could succeed; and William's revenue was too short to rule without annual parliaments. England had chosen its king and set conditions — while insisting nothing revolutionary had happened at all.`},{t:`reading`,title:`How bloodless was the Bloodless Revolution?`,blocks:[{t:`p`,x:`Tombs presses two corrections to the cosy legend. First, 1688 was bloodless only in England. Scotland got war and the Glencoe massacre; Ireland got a full-scale conflict — the siege of Derry, the battle of the Boyne — and then the penal laws against Catholics.`},{t:`p`,x:`Second, William did not cross the sea to bless English liberties. He came to pull England into his life's work, the coalition against Louis XIV's France. The price of the revolution was a quarter-century of European war — paid for by inventing the {{bank-of-england|Bank of England}}, the {{national-debt|national debt}}, and the {{fiscal-military-state|fiscal-military state}}. That bargain is the next chapter's story.`}]},{t:`argument`,title:`The lesson the English drew`,x:`England's only revolution came from religious passion, not class conflict — and it traumatized the nation that made it. Tombs argues the memory of the 1640s inoculated the English against utopian politics: having pursued the rule of the saints and got the rule of the sword, they settled for compromise and precedent, and learned to distrust anyone offering heaven on earth. The moderation later celebrated as an English virtue was less a temperament than a scar.`}]},{id:`int3`,part:3,title:`The Civil War and Whig History`,subtitle:`Interlude`,era:`looking back`,blurb:`What England did with the memory of its revolution. The seventeenth-century crisis was retold as tragedy, as progress, as class struggle — and the winning version, {{whig-history|Whig history}}, became the country's founding myth of moderation.`,blocks:[{t:`p`,x:`No stretch of English history has been fought over so hard after the fact. The {{civil-war|Civil War}} and 1688 generated rival histories almost before the smoke cleared, and Tombs' interest in this interlude is less in what happened than in what the English decided it meant — because the meaning, he argues, shaped how they governed themselves for two centuries.`},{t:`h`,x:`First drafts: tragedy and providence`},{t:`p`,x:`The first great account came from the losing side. Edward Hyde, Earl of Clarendon, {{charles-i|Charles I}}'s adviser and later {{charles-ii|Charles II}}'s chief minister, wrote his *History of the Rebellion* in exile: the war as tragedy, brought on not by grand historical forces but by the follies and passions of particular men. His unforgettable character sketches set a very English template — history as the study of persons, not systems.`},{t:`h`,x:`The Whig ascendancy`},{t:`p`,x:`The version that won was {{whig-history|Whig history}}: English history as the unfolding of constitutional liberty, with Parliament's cause as progress and 1688 as the happy ending that spared England the revolutions of its neighbours. Its supreme salesman was {{macaulay|Macaulay}}, whose *History of England* (1848–55) sold like a novel and told the {{glorious-revolution|Glorious Revolution}} as the moment England chose law over despotism — a revolution praised, precisely, for being moderate, sensible, and final. Tombs' point is that the myth was not idle: generations of statesmen who believed English history was a story of gradual, peaceful reform felt obliged to keep it one. The story of moderation manufactured moderation. It is a rare case of a national myth enforcing good behaviour.`},{t:`p`,x:`The Victorians even rehabilitated the regicide. To Nonconformists — the heirs of the {{puritans|Puritans}}, still excluded from full civic life within living memory — {{oliver-cromwell|Cromwell}} was a hero of conscience against persecution, and Carlyle's edition of his letters recast him as a rugged man of destiny. In 1899, over royal objections, his statue went up outside Parliament itself: the man who abolished the monarchy, guarding Westminster. Ireland, which remembered Drogheda, was not consulted.`},{t:`h`,x:`Knocking the story down`},{t:`p`,x:`The twentieth century demolished the Whig narrative twice. Herbert Butterfield named the fallacy in *The Whig Interpretation of History* (1931): the sin of reading the past as a march toward the present, sorting the dead into those who pushed history forward and those who blocked it. Then came the Marxists, for whom the Civil War was England's "bourgeois revolution" — rising gentry and merchants breaking a feudal order. From the 1970s, revisionist historians took that apart in turn: the sides did not divide by class, the war's causes looked contingent rather than inevitable, and what moved men most was religion. Tombs writes with the revisionists — which is why his own chapter calls the conflict the last of the wars of religion.`},{t:`reading`,title:`Why the myth mattered more than the facts`,blocks:[{t:`p`,x:`Tombs' conclusion is double-edged. As history, the Whig story was wrong: 1688 was a Dutch invasion and a gamble, bloody in Scotland and Ireland, and its "ancient liberties" were partly invented on the spot. As myth, it worked. A country convinced that its constitution was old, proven, and self-improving did not need to tear it up; reformers could demand change as restoration rather than revolution, and conservatives could concede it as continuity. The {{whig-history|Whig}} legend of 1688 became England's founding myth of moderation — and, Tombs suggests, one reason England never had a 1789.`}]}]},{id:`ch07`,part:4,number:`7`,title:`And All Was Light`,era:`c.1660–c.1760`,blurb:`The English {{enlightenment|Enlightenment}}: Newton, Locke, coffee-houses, and a free press make England the country the rest of Europe wants to copy. The title echoes Pope’s epitaph for Newton — nature’s laws hid in night, God said "Let Newton be", and all was light.`,blocks:[{t:`p`,x:`After a century of plots, wars, and executions, this chapter changes key. Between the {{restoration|Restoration}} and the accession of George III, England became the place Europeans visited to see the future: a country of experiments, newspapers, shops, clubs, and argument. Voltaire came, marvelled, and wrote a book about it. The {{enlightenment|Enlightenment}} is usually told as a French story of philosophers against throne and altar. Tombs tells it as an English story first — and a strikingly comfortable one.`},{t:`h`,x:`Newton, Locke, and the confidence of reason`},{t:`p`,x:`Two men set the tone. Isaac Newton, a Lincolnshire farm boy turned Cambridge professor, published the *Principia* in 1687 and showed that one set of laws governed the fall of an apple and the orbit of the moon. The universe, it turned out, was legible. His platform was the Royal Society (founded 1660, under {{charles-ii|Charles II}}’s charter), which made a method of the new science: do the experiment, show the evidence, argue politely. John Locke did something similar for politics. Writing in the shadow of the {{glorious-revolution|Glorious Revolution}}, he argued that government rests on consent and exists to protect life, liberty, and property — and, in his *Letter Concerning Toleration*, that forcing consciences is both wicked and useless. Neither man saw himself as an enemy of Christianity. Both thought reason and faith pointed the same way. That assumption marks the whole English movement.`},{t:`argument`,x:`Tombs argues that England’s Enlightenment was practical and establishment-friendly because England had already had its revolution. French philosophers had to attack an absolute monarchy and an intolerant church; English writers lived under a limited crown and a broadly tolerant one. So English enlightenment meant improvement — better farming, better manners, better pumps — not subversion. The irony, which Tombs relishes, is that the Enlightenment’s model society felt no need to be revolutionary at all.`},{t:`h`,x:`Coffee, print, and politeness`},{t:`p`,x:`Ideas need rooms to live in, and England built them. {{london|London}} had hundreds of coffee-houses by 1700 — cheap, sober, open to anyone with a penny, each with its newspapers on the table and its regulars arguing over them. Clubs multiplied for every purpose: science, singing, insurance, sedition. And in 1695 {{parliament|Parliament}} simply let the press licensing law lapse. Almost by accident, England acquired the freest press in the world, and used it: daily papers, provincial papers, pamphlet wars, and journals like Addison and Steele’s *Spectator*, which set out to teach a commercial nation how to behave. Their word for the goal was "politeness" — not stiffness, but the easy, tolerant manners that let strangers do business and disagree without drawing swords.`},{t:`reading`,title:`Why "politeness" was a political idea`,blocks:[{t:`p`,x:`It is easy to hear "politeness" as mere etiquette. To the *Spectator*’s readers it was a cure. The previous century had shown where zeal led: civil war, regicide, and the moral police of the {{puritans|Puritan}} interregnum. Politeness was the deliberate opposite — conversation instead of confession, wit instead of enthusiasm, the coffee-house instead of the conventicle. Trade helped: Addison’s famous set piece describes the Royal Exchange, where Jew and Gentile, Christian and Muslim deal peacefully because commerce makes cooperation pay.`},{t:`p`,x:`Historians have taken this seriously. The argument, associated with Paul Langford’s *A Polite and Commercial People*, is that politeness did real work: it let a society without a strong state police itself through reputation and manners. Tombs adds a national note — foreigners found the mixture of liberty and civility peculiar, enviable, and hard to export.`}]},{t:`h`,x:`A nation of shoppers`},{t:`p`,x:`Underneath the talk ran money. England in this period grew rich broadly, not just at the top: wages were high by European standards, and ordinary families began buying things their grandparents could not have imagined owning — tea, sugar, cotton prints, clocks, mirrors, china. Historians call it the consumer revolution. Daniel Defoe, journalist, spy, and author of *Robinson Crusoe*, celebrated the tradesman as the true modern hero; his hero’s island, tellingly, becomes a well-run enterprise. Not everyone cheered. William Hogarth built a career satirizing the age’s greed and cruelty — *Gin Lane*, *A Rake’s Progress*, *Marriage A-la-Mode* — yet even satire proves the point: it sold as prints, through the market it mocked, to customers who enjoyed being scolded.`},{t:`timeline`,title:`The age of improvement`,events:[{year:`1660`,label:`The Royal Society founded`,detail:`Experiment and evidence get an institution, a journal, and royal blessing.`},{year:`1687`,label:`Newton’s *Principia*`,detail:`One mathematics for heaven and earth. Pope’s epitaph caught the mood: God said "Let Newton be", and all was light.`},{year:`1689`,label:`Locke’s great works appear`,detail:`The *Two Treatises* and the *Letter Concerning Toleration* give the {{glorious-revolution|Revolution}} its philosophy.`},{year:`1695`,label:`Press licensing lapses`,detail:`{{parliament|Parliament}} declines to renew censorship. England stumbles into a free press.`},{year:`1711`,label:`The *Spectator* launches`,detail:`Addison and Steele bring philosophy "out of closets and libraries" into clubs and coffee-houses.`},{year:`1719`,label:`*Robinson Crusoe* published`,detail:`Defoe’s castaway rebuilds civilization by industry and stock-taking — the commercial age’s myth.`},{year:`1738`,label:`Wesley’s conversion`,detail:`A failed missionary feels his heart "strangely warmed"; {{methodism|Methodism}} begins.`},{year:`1751`,label:`Hogarth’s *Gin Lane*`,detail:`The age satirizes its own vices — and buys the prints.`}]},{t:`h`,x:`The counter-current: Methodism`},{t:`p`,x:`Every current has its counter-current. To many, the polite, reasonable {{church-of-england|Church of England}} had grown cold — a religion of sermons on decency, preached to comfortable pews. In 1738 John Wesley, an Oxford clergyman, underwent a conversion he described as his heart being "strangely warmed", and took the result outdoors. He and George Whitefield preached in fields to miners and weavers the parish system barely reached, in crowds of thousands; hearers wept, fainted, and organized. {{methodism|Methodism}} — nicknamed for its methodical discipline of prayer, study, and mutual examination — became the great popular religious movement of the century: emotional where the age was cool, serious where it was witty, and aimed squarely at the people politeness overlooked. Tombs treats it not as the Enlightenment’s opposite but as its shadow and corrective — and a seedbed of later self-organization, from chapels to unions.`},{t:`p`,x:`By mid-century, then, England presented Europe with a paradox it found fascinating: the most modern country was also among the most stable. Freedom, science, trade, and toleration seemed to reinforce the establishment rather than threaten it. But the question Voltaire’s admiring readers could not settle — how free was this famous free country, really, and for whom? — is the next chapter’s.`}]},{id:`ch08`,part:4,number:`8`,title:`A Free Country?`,era:`c.1689–c.1815`,blurb:`Hanoverian England called itself the freest nation on earth, and much of Europe agreed. This chapter weighs the boast: real liberties under law against rotten boroughs, religious exclusion, and a penal code with some two hundred hanging offences. The question mark is the point.`,blocks:[{t:`p`,x:`Eighteenth-century Englishmen of every rank believed one thing about themselves: they were free, and foreigners were not. "Britons never will be slaves", ran the new song of 1740. Tombs takes the boast seriously enough to test it. What follows is a double portrait — a country genuinely governed by law and argument, which was also an oligarchy that hanged pickpockets, barred Catholics and Dissenters from office, and let a few dozen landowners choose half the {{house-of-commons|House of Commons}}.`},{t:`h`,x:`The free side of the ledger`},{t:`p`,x:`Start with what was real. After the {{glorious-revolution|Glorious Revolution}}, the crown governed under law: no taxes and no standing army without {{parliament|Parliament}}, which now met every year because the money ran out if it did not. The {{common-law|common law}} courts were open, habeas corpus made secret imprisonment illegal, and {{jury-trial|juries}} of ordinary men stood between the state and the accused — and used the power, as we shall see. The press, unlicensed since 1695, said nearly anything. Politics was a public brawl between {{whigs-tories|Whigs and Tories}}, fought in print, in coffee-houses, and at rowdy elections. Nothing like this combination existed anywhere else in Europe.`},{t:`p`,x:`This liberty was not confined to the polite. Crowds rioted — against gin laws, turnpikes, Catholics, and press gangs — and magistrates mostly negotiated rather than shot. In the 1760s John Wilkes, a cross-eyed, scandalous journalist prosecuted for insulting the king, turned his own case into a national cause: general warrants were struck down in court, and "Wilkes and Liberty!" became the cry of London crowds who could not vote but knew their rights. And in 1772 the courts touched the century’s deepest wrong: in Somerset’s case, Lord Mansfield ruled that a master could not seize an enslaved man in England and ship him to the plantations. The judgment was narrow, but the meaning people took from it was vast — {{atlantic-slavery|slavery}} had no home in English air.`},{t:`reading`,title:`The Bloody Code and the merciful jury`,blocks:[{t:`p`,x:`Here is the paradox in one institution. Parliament multiplied capital statutes until roughly two hundred offences carried death, most of them crimes against property — shoplifting above a shilling, cutting down an orchard tree. Yet executions did not multiply to match. Juries routinely valued stolen goods at just under the fatal threshold ("pious perjury"), prosecutors charged low, and judges reprieved; a large share of the condemned were pardoned or transported instead.`},{t:`p`,x:`Historians have argued for fifty years about what this meant. Douglas Hay read it as theatre of class power: terror in the statute book, mercy at the ruling class’s discretion, both teaching deference. Critics answered that discretion mostly lay with ordinary jurors and victims, who used it against the code’s severity. Tombs leans to the second view — the {{jury-trial|jury}} as a working, everyday check on the state — while conceding the gallows at Tyburn were real enough.`}]},{t:`h`,x:`The unfree side`},{t:`p`,x:`Now the other column. The vote belonged to a minority of adult men, distributed by ancient accident: great new towns had no members, while "rotten boroughs" — a green mound at Old Sarum, a ruin at Dunwich — returned two each, in the gift of a patron. The Test Acts kept Catholics and Protestant Dissenters out of office and the universities. The {{fiscal-military-state|fiscal-military state}} built after 1689 taxed the English more heavily than the supposedly groaning French, and the {{royal-navy|Navy}} manned its ships by press gang — legalized street kidnapping of seafaring men. And the regime had enemies it treated as such: the {{jacobites|Jacobite}} risings of 1715 and 1745 for the exiled Stuarts ended, after Culloden, in executions, banned tartans, and a brutally pacified Scottish Highlands.`},{t:`p`,x:`Presiding over it all from 1721 to 1742 was Robert {{walpole|Walpole}}, in effect the first prime minister, who ran the system frankly on patronage: places, pensions, and peerages bought a docile {{parliament|Parliament}}. His critics called it corruption; he called it stability, and after a century of upheaval, stability sold. Tombs notes the trade-off without sneering at it — {{walpole|Walpole}}’s England was cynical, cheap to run, and at peace.`},{t:`timeline`,title:`Liberty and its limits`,events:[{year:`1689`,label:`Bill of Rights`,detail:`The {{glorious-revolution|Revolution}} settlement: law above the crown, {{parliament|Parliament}} in permanent session.`},{year:`1695`,label:`Censorship ends`,detail:`Press licensing lapses; England gets Europe’s loudest newspapers.`},{year:`1715`,label:`The Fifteen`,detail:`First great {{jacobites|Jacobite}} rising for the exiled Stuarts fails.`},{year:`1721`,label:`{{walpole|Walpole}} takes charge`,detail:`Twenty-one years of oligarchic calm, lubricated by patronage.`},{year:`1745`,label:`The Forty-five`,detail:`Bonnie Prince Charlie reaches Derby; London panics; Culloden and repression follow.`},{year:`1763`,label:`Wilkes and Liberty`,detail:`A scandalous journalist beats the government in court over general warrants.`},{year:`1772`,label:`Somerset’s case`,detail:`Mansfield rules an enslaved man cannot be forcibly removed from England.`},{year:`1780`,label:`Gordon Riots`,detail:`A week of anti-Catholic violence in London — popular liberty’s ugliest face.`}]},{t:`argument`,x:`Tombs’ answer to the chapter’s question: yes, a free country — but freedom of a particular, untidy kind. English liberty was not an abstract right deduced from principle; it was a bundle of inherited possessions — {{jury-trial|jury trial}}, habeas corpus, the free press, the right to riot within custom — defended as ancestral property, with {{magna-carta
