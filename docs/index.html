lative arithmetic mistaken for absolute failure — for ordinary English people these were the best years yet lived`,`It was real and caused by the welfare state`,`It was invented by foreign commentators with no British following`,`It ended once the empire was given up`],answer:0,explain:`War-shattered economies rebuilding from rubble naturally grew faster than one already rich; the tragedy is that the English, coached by {{declinism|declinists}}, talked themselves into believing they had failed.`}],ch19:[{q:`What happened at the *Lady Chatterley's Lover* trial of 1960?`,options:[`Penguin Books was fined and the novel banned`,`A jury acquitted Penguin Books, and literary censorship never recovered`,`The trial collapsed on a technicality`,`The author was prosecuted for obscenity`],answer:1,explain:`The jury laughed at the prosecutor's question about wives and servants; the old guardians had lost the country, and they knew it.`},{q:`Which twin legal landmarks came in 1967?`,options:[`Equal pay and sex discrimination laws`,`No-fault divorce and the end of stage censorship`,`Suspension of the death penalty and the first Race Relations Act`,`Legalized abortion and decriminalized homosexuality`],answer:3,explain:`The two 1967 Acts were the heart of the {{sixties-revolution|sixties revolution}} in law, part of the avalanche championed by Roy Jenkins under Wilson's governments.`},{q:`What does Tombs identify as the quiet engine of the whole cultural revolution?`,options:[`The satire boom on television`,`The spread of the contraceptive pill`,`Secularization — the collapse of churchgoing and the morality it carried`,`The expansion of the universities`],answer:2,explain:`The permissive laws registered a morality that had already lost its congregation; when {{methodism|Methodism}} and its cousins faded, so did the culture of self-restraint they had carried.`},{q:`What consequence does Tombs draw from the political response to Powell's 1968 "rivers of blood" speech?`,options:[`Powell's views became mainstream party policy`,`Open racism was expelled from respectable politics, at the price of a lasting elite–popular gap on immigration`,`Race Relations legislation was repealed`,`Immigration was halted for a decade`],answer:1,explain:`Heath sacked Powell within a day and the political class closed ranks — even as polls showed wide public sympathy, opening a divide Tombs calls decisive.`}],ch20:[{q:`What made the {{winter-of-discontent|winter of 1978–79}} so notorious?`,options:[`Public-sector strikes left rubbish in the streets and the dead unburied`,`A miners' strike caused nationwide power cuts`,`The pound was forced out of the exchange-rate mechanism`,`Riots broke out in Brixton and Toxteth`],answer:0,explain:`The strikes, with inflation that had touched 25 per cent and the 1976 IMF loan behind them, convinced the country the {{postwar-consensus|postwar settlement}} was devouring itself.`},{q:`What rescued {{thatcher|Thatcher}}'s deeply unpopular government and led to the 1983 landslide?`,options:[`A sudden fall in unemployment`,`The privatization of gas and telephones`,`Victory in the {{falklands-war|Falklands War}}, with Labour split by the breakaway SDP`,`The defeat of the miners' strike`],answer:2,explain:`The ten-week war of 1982 transformed her standing; with the {{labour-party|Labour Party}} divided, the experiment would run its full course.`},{q:`Why did the {{miners-strike|miners' strike}} of 1984–85 fail where the strikes of 1972 and 1974 had won?`,options:[`The army was deployed against the pickets`,`Coal was stockpiled, the strike began in spring, and Scargill's refusal of a national ballot split the union`,`Public opinion had turned against coal mining itself`,`European law made the strike illegal`],answer:1,explain:`Every condition of the earlier victories was reversed; Tombs presents the strike as the last test of whether organized labour could veto elected government — it could not.`},{q:`What is Tombs' overall verdict on Thatcherism?`,options:[`An economic failure that happened to be popular`,`A revolution that changed little in the long run`,`A cultural success that failed economically`,`{{declinism|Declinism}}'s cure, administered at savage social cost — it worked economically and wounded culturally`],answer:3,explain:`By the mid-1990s Britain had stopped falling behind France and Germany, but industrial England was hollowed out, and the verdict still divides the country along the map of who paid and who gained.`}],ch21:[{q:`What anomaly did New Labour's constitutional reforms leave unplanned?`,options:[`The House of Lords kept all its hereditary peers`,`Scotland was left without a parliament`,`Every nation of the Union gained its own voice except England`,`The Bank of England lost control of interest rates`],answer:2,explain:`{{devolution|Devolution}} gave Scotland a parliament and Wales an assembly by 1999, while England — the largest nation — was governed as if it did not exist.`},{q:`According to Tombs, what broke at home as a result of the Iraq war?`,options:[`The Anglo-American alliance`,`Labour's electoral dominance, lost at the next election`,`Support for the armed forces`,`The assumption that a British government would not mislead its people into war`],answer:3,explain:`Roughly a million people marched against the war in February 2003; the missing weapons cost {{blair|Blair}} his reputation even as his party's dominance survived to 2007.`},{q:`What was the outcome of the September 2014 referendum with which Tombs ends his story?`,options:[`Scotland voted for independence by a narrow margin`,`Scotland voted No, and the Union survived 55 to 45`,`The vote was postponed after the financial crash`,`England voted to leave the European Union`],answer:1,explain:`The morning after, Cameron raised the question of England — the point at which the book stops writing.`},{q:`What does Tombs identify as the real deficit of the England of 2014?`,options:[`Constitutional and psychological — a nation without a voice, embarrassed by its own name`,`Economic — falling behind its European neighbours`,`Military — the loss of great-power capability`,`Educational — a failing school system`],answer:0,explain:`Measured against its own long history, England fails the {{declinism|declinist}} test completely; even its anxieties were the anxieties of success, not collapse.`}],conclusion:[{q:`Which three answers organize Tombs' conclusion about the English?`,options:[`They are divided, insular, and nostalgic`,`They are old, lucky, and gloomy about themselves`,`They are pragmatic, tolerant, and imperial`,`They are wealthy, warlike, and pious`],answer:1,explain:`The state has run continuously for over a thousand years, the island escaped invasion since {{norman-conquest|1066}} and revolution since {{glorious-revolution|1688}} — and the gloom the English feel about themselves is unsupported by the record.`},{q:`What, in Tombs' final account, did {{declinism|declinism}} fundamentally mistake?`,options:[`The end of an abnormal supremacy — the windfall of being the {{industrial-revolution|first industrial nation}} — for failure`,`Temporary recessions for permanent poverty`,`Military overstretch for economic weakness`,`The loss of empire for the loss of independence`],answer:0,explain:`Set against any long yardstick, modern England is a success story; bad history, Tombs repeats, makes bad politics, because nations that believe they are failing do desperate things.`},{q:`What does Tombs conclude about national myths?`,options:[`They are harmless entertainment with no political force`,`They should be replaced by official histories`,`Only defeated nations need them`,`A people cannot choose to have no myths, only to examine the ones they have`],answer:3,explain:`The {{whig-history|Whig}} epic, {{foxes-martyrs|Foxe}}, the futility story, and the {{second-world-war|finest hour}} were each contestable readings of events — and each governed behaviour for generations.`},{q:`Which year does the conclusion's timeline mark as the making of "one England" — the state that never since dissolved?`,options:[`c.600`,`1066`,`937`,`1215`],answer:2,explain:`The realm of {{athelstan|Æthelstan}} in 937 created the unified English state, which endured under conquerors, usurpers, and parliaments alike.`}]},Br={...Ir,...Lr,...Rr,...zr},Vr=[{n:0,title:`Beginnings`},{n:1,title:`The Birth of a Nation`,era:`c.600–1204`},{n:2,title:`The English Unleashed`,era:`1204–c.1500`},{n:3,title:`The Great Divide`,era:`c.1500–c.1700`},{n:4,title:`Making a New World`,era:`c.1660–c.1815`},{n:5,title:`The English Century`,era:`c.1815–1918`},{n:6,title:`The New Dark Age`,era:`1914–1945`},{n:7,title:`An Age of Decline?`,era:`1945–c.2014`},{n:8,title:`Looking Back`}];function Hr(e){return e.replace(/\{\{[a-z0-9-]+\|([^}]+)\}\}/g,`$1`).replace(/\*\*?/g,``)}function Ur(e,t){for(let n of e)if(n.t===`p`||n.t===`argument`||n.t===`voice`)t.push(Hr(n.x));else if(n.t===`h`)t.push(n.x);else if(n.t===`reading`)Ur(n.blocks,t);else if(n.t===`timeline`)for(let e of n.events)t.push(Hr(e.label)+(e.detail?` `+Hr(e.detail):``))}var Wr=null;function Gr(){if(Wr)return Wr;let e=[];for(let t of Fr){let n=[t.era+` `+Hr(t.blurb)];Ur(t.blocks,n);for(let r of n)e.push({kind:`chapter`,id:t.id,title:t.title,sub:t.era,text:r})}for(let t of Object.values(sr))e.push({kind:`concept`,id:t.id,title:t.term,sub:t.era??t.category,text:t.body.map(Hr).join(` `)});return Wr=e,e}function Kr(e){let t=e.trim().toLowerCase();if(t.length<2)return[];let n=[],r=new Set,i=Gr();for(let e of i){let i=e.kind+e.id;r.has(i)||e.title.toLowerCase().includes(t)&&(r.add(i),n.push({entry:e,snippet:e.text.slice(0,110)}))}for(let e of i){let i=e.kind+e.id;if(r.has(i))continue;let a=e.text.toLowerCase().indexOf(t);if(a>=0){r.add(i);let o=Math.max(0,a-40);n.push({entry:e,snippet:(o>0?`…`:``)+e.text.slice(o,a+t.length+70)+`…`})}if(n.length>=24)break}return n.slice(0,24)}var qr=null;function Jr(e){qr=e}function Yr(){return qr}function Xr(){qr=n ouse:`root`,x:300,y:40,text:`The fertile root of the trouble: {{edward-iii|Edward III}} had five adult sons. Rival lines of descent from them supplied both sides of the {{wars-of-roses|Wars of the Roses}}.`},{id:`blackprince`,name:`Edward, the Black Prince`,dates:`1330–76`,house:`root`,x:95,y:130,text:`Eldest son and victor of Poitiers; died before his father, so the crown passed to his ten-year-old son Richard II — a child king, and the dynasty's first crack.`},{id:`gaunt`,name:`John of Gaunt, Duke of Lancaster`,dates:`1340–99`,house:`lancaster`,x:300,y:130,text:`Third surviving son; richest nobleman in England. His son seized the throne, founding the house of Lancaster (red rose).`},{id:`york-duke`,name:`Edmund, Duke of York`,dates:`1341–1402`,house:`york`,x:505,y:130,text:`Fourth surviving son. His grandson combined York descent with a claim through the *second* son's line (Lionel of Clarence) — genealogically senior to Lancaster, which became the Yorkist case for the throne.`},{id:`richard2`,name:`Richard II`,dates:`r.1377–99`,house:`root`,x:95,y:225,text:`The Black Prince's son: autocratic, childless, deposed in 1399 by his cousin Bolingbroke and dead in prison months later. Deposition set the fatal precedent — kings could be unmade.`},{id:`henry4`,name:`Henry IV`,dates:`r.1399–1413`,house:`lancaster`,x:300,y:225,text:`Gaunt's son Bolingbroke, the usurper of 1399. His seizure of the crown from Richard II is where Shakespeare's history cycle — and the legitimacy problem — begins.`},{id:`henry5`,name:`Henry V`,dates:`r.1413–22`,house:`lancaster`,x:300,y:305,text:`Usurpation redeemed by glory: {{agincourt|Agincourt}} and the conquest of northern France. Then he died at 35, leaving a nine-month-old heir — see {{henry-v|Henry V}}.`},{id:`richard-york`,name:`Richard, Duke of York`,dates:`1411–60`,house:`york`,x:505,y:305,text:`Heir of both the York and Clarence lines. Excluded from power by Henry VI's court, he claimed first the protectorship, then the throne itself; aw}} grow out of, not against, the old structures.`},{chapterId:`ch05`,note:`Even the {{reformation-england|Reformation}} is a state act — the crown redirects an ancient church rather than the church breaking the state.`},{chapterId:`ch06`,note:`The exception that proves it: revolution comes once, from religion — and the {{restoration|Restoration}} restores the old forms within eleven years.`},{chapterId:`ch08`,note:`Hanoverian liberty is defended as an ancestral inheritance ({{magna-carta|Magna Carta}} mythology), not invented rights.`},{chapterId:`ch21`,note:`The modern question — {{devolution|devolution}} and the Union's wobble — is the old nation resurfacing under the newer British state.`},{chapterId:`conclusion`,note:`The summing-up: continuity as England's defining trait, and its quiet advantage.`}]},{id:`memory`,title:`Memory makes history`,color:`#2c3e5d`,claim:`What the English believe about their past — accurate or not — steers what they do next. Myths are causes, not decorations.`,stops:[{chapterId:`prelude`,note:`The laboratory case: Arthur and the Dreamtime — maximum myth on minimum evidence, with real political uses.`},{chapterId:`int1`,note:`The {{norman-yoke|Norman Yoke}}: a legend of stolen Saxon freedom armed radicals for centuries.`},{chapterId:`int2`,note:`Shakespeare's history plays become the nation's memory of the Middle Ages — a theatre production outlasting the archives.`},{chapterId:`ch05`,note:`{{foxes-martyrs|Foxe's martyrs}} manufacture the elect Protestant nation that then acts like one.`},{chapterId:`int3`,note:`{{whig-history|Whig history}} canonizes {{glorious-revolution|1688}}; the myth of moderation enforces actual moderation.`},{chapterId:`ch15`,note:`The {{war-poets|futility}} version of 1914–18 displaces what contemporaries believed — and reshapes foreign policy after.`},{chapterId:`int5`,note:`The centerpiece: {{munich|Munich}}, {{dunkirk|Dunkirk}}, the {{blitz|Blitz spirit}} — memory as the strongest political force in postwa
