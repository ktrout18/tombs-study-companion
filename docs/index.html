or elite takeover of a native population is still argued over; genetics suggests a mix.`,`Either way, their language won. English replaced both Latin and Brittonic almost completely, and from their patchwork of small kingdoms — the {{heptarchy|Heptarchy}} — a single {{anglo-saxon-england|England}} eventually formed.`]},{id:`anglo-saxon-england`,term:`Anglo-Saxon England`,era:`c.600–1066`,category:`terms`,body:[`The England of the six centuries before the {{norman-conquest|Norman Conquest}} — and the core of Tombs' claim that England is old. By the tenth century it was arguably Europe's most sophisticated state: one crown, a single coinage, {{shire|shires}} for local government, and a tax system ({{danegeld|the geld}}) that could raise real money.`,`The idea of a single English people was partly created by {{bede|Bede}}, who wrote about "the English" before any king ruled them all.`]},{id:`heptarchy`,term:`The Heptarchy`,era:`c.600–c.850`,category:`terms`,body:[`The traditional name for the seven-ish Anglo-Saxon kingdoms — {{northumbria|Northumbria}}, {{mercia|Mercia}}, {{wessex|Wessex}}, East Anglia, Kent, Sussex, Essex — that competed for supremacy before England was unified.`,`The number was never really fixed; kingdoms swallowed each other constantly. The {{viking-invasions|Viking invasions}} destroyed all of them except Wessex, which then rebuilt "England" in its own image.`]},{id:`northumbria`,term:`Northumbria`,era:`c.600–954`,category:`places`,body:[`The great northern kingdom, stretching from the Humber toward Edinburgh. In the seventh and eighth centuries it was the cultural powerhouse of the {{heptarchy|Heptarchy}} — home to {{bede|Bede}}, the Lindisfarne Gospels, and Europe's finest scholarship of the day.`,`The {{viking-invasions|Vikings}} shattered it; York became a Scandinavian city, and the north entered England half-apart, a difference that echoed for centuries.`]},{id:`mercia`,term:`Mercia`,era:`c.600–c.900`,category:`places`,body:[`The midland kingdom, dominant in the eighth century under King Offa, who built the great dyke against the Welsh and traded with Charlemagne as an equal.`,`Squeezed between the {{danelaw|Danelaw}} and a rising {{wessex|Wessex}}, it was absorbed into the new unified England in the tenth century.`]},{id:`wessex`,term:`Wessex`,era:`c.520–1066`,category:`places`,body:[`The kingdom of the West Saxons, centred on Winchester. It was the last kingdom left standing against the {{viking-invasions|Vikings}}, and under {{alfred-the-great|Alfred}} and his heirs it conquered and unified the rest into a single {{anglo-saxon-england|England}}.`,`Every English monarch since descends, by blood or claim, from the house of Wessex.`]},{id:`bede`,term:`Bede`,era:`c.673–735`,category:`people`,body:[`A monk of Jarrow in {{northumbria|Northumbria}} and the greatest scholar of early medieval Europe. His *Ecclesiastical History of the English People* (731) told the story of "the English" as one Christian nation with a shared destiny — centuries before a single English kingdom existed.`,`Tombs treats him as the first and most influential inventor of Englishness: the idea preceded the state.`]},{id:`synod-of-whitby`,term:`Synod of Whitby`,era:`664`,category:`events`,body:[`A church council at which {{northumbria|Northumbria}} chose to follow Roman rather than Irish Christian practice (the presenting issue was the date of Easter).`,`It bound the English church to Rome and the continent — an orientation that lasted until the {{reformation-england|Reformation}} broke it, nearly nine hundred years later.`]},{id:`viking-invasions`,term:`The Viking invasions`,era:`793–1066`,category:`events`,body:[`Two centuries of Scandinavian raiding, conquest, and settlement, opening with the sack of Lindisfarne in 793. The "Great Heathen Army" of 865 destroyed every Anglo-Saxon kingdom except {{wessex-alfred|Alfred's Wessex}}, and Danish settlement created the {{danelaw|Danelaw}}.`,`Paradoxically, the Vikings helped make England: unification was a reconquest, and the threat forced the building of a strong state — including the {{danegeld|geld}}, the tax invented to buy the raiders off.`]},{id:`danelaw`,term:`The Danelaw`,era:`c.878–954`,category:`places`,body:[`The broad swathe of northern and eastern England — roughly everything northeast of the old road called Watling Street — where Danish law and custom ran after the {{viking-invasions|Viking conquests}}. Its legacy survives in place-names ending in *-by* and *-thorpe*, and in hundreds of everyday English words borrowed from Norse.`,`The kings of {{wessex|Wessex}} reconquered it in the tenth century, but the north kept a distinct character long after.`]},{id:`alfred-the-great`,term:`Alfred the Great`,era:`r.871–899`,category:`people`,body:[`King of {{wessex|Wessex}}, the only English king called "the Great". He stopped the {{viking-invasions|Viking}} conquest at Edington (878), fortified his kingdom with a network of *burhs* (fortified towns), and began calling himself king of the *Angelcynn* — the English kind.`,`He also launched a program of translation and learning in English, making the written vernacular an instrument of state long before most of Europe. His children and grandchildren — culminating in {{athelstan|Æthelstan}} — turned his defensive success into a unified England.`]},{id:`wessex-alfred`,term:`Alfred's Wessex`,era:`871–899`,category:`terms`,body:[`Shorthand for the rump English kingdom that survived the Viking onslaught of the 860s–70s. At its lowest point, {{alfred-the-great|Alfred}} was a fugitive in the Somerset marshes; from there he fought back to a negotiated peace that split England with the {{danelaw|Danelaw}}.`]},{id:`athelstan`,term:`Æthelstan`,era:`r.924–939`,category:`people`,body:[`Grandson of {{alfred-the-great|Alfred}} and, by most reckonings, the first king of all England. He took York from the Danes in 927 and crushed a grand alliance of Scots, Strathclyde Britons, and Dublin Vikings at Brunanburh (937), the era's most celebrated battle.`,`His charters styled him *rex totius Britanniae* — king of all Britain — an ambition that outran reality but set a template.`]},{id:`witan`,term:`The Witan`,era:`c.600–1066`,category:`institutions`,body:[`The council of leading men — ealdormen, bishops, thegns — who advised Anglo-Saxon kings and, crucially, took part in choosing them. Succession was not strict primogeniture: the Witan could prefer a capable brother to a child heir.`,`Victorian writers romanticized it as a proto-{{parliament|Parliament}}; it was not that, but it does show English kingship was consultative from the start — a habit that never entirely disappeared.`]},{id:`shire`,term:`Shires and hundreds`,era:`c.900 onward`,category:`institutions`,body:[`The building blocks of English local government for a thousand years. The shire (county) had its own court and a royal official — the shire-reeve, or *sheriff* — answerable to the king; shires subdivided into "hundreds" with their own assemblies.`,`This mesh of institutions meant ordinary freemen routinely took part in law and administration — a deep root, Tombs argues, of English self-government. The system was so durable that its boundaries survived nearly intact until 1974.`]},{id:`danegeld`,term:`Danegeld`,era:`c.991–1162`,category:`institutions`,body:[`A national land tax first raised to buy off {{viking-invasions|Viking}} armies under King Æthelred "the Unready". England was rich and administratively precocious enough to collect it — enormous sums, tens of thousands of pounds of silver.`,`The dark irony: an efficient tax system made England worth conquering. Both {{cnut|Cnut}} and {{william-conqueror|William}} inherited and gladly used it.`]},{id:`cnut`,term:`Cnut`,era:`r.1016–1035`,category:`people`,body:[`The Danish king who conquered England in 1016 and ruled it as the jewel of a North Sea empire spanning Denmark and Norway. He kept English law, English bishops, and the English tax system — proof of how solid the {{anglo-saxon-england|Anglo-Saxon state}} was: conquerors ran it rather than replacing it.`,`The famous story of Cnut and the tide was told to illustrate his piety (he was showing courtiers that kings cannot command the sea), not his arrogance.`]},{id:`edward-confessor`,term:`Edward the Confessor`,era:`r.1042–1066`,category:`people`,body:[`The pious, childless king whose death in January 1066 triggered the succession crisis of that terrible year. Raised in exile in Normandy, he may (or may not) have promised the throne to Duke {{william-conqueror|William}} — the ambiguity launched the {{norman-conquest|Conquest}}.`,`He built Westminster Abbey and was later made a saint, the model of holy English kingship.`]},{id:`norman-conquest`,term:`The Norman Conquest`,era:`1066`,category:`events`,body:[`Duke {{william-conqueror|William of Normandy}}'s seizure of England after Hastings — the most total elite replacement in English history. Within twenty years, almost the whole Anglo-Saxon aristocracy was dispossessed; land, church, and government passed to a French-speaking minority of a few thousand.`,`It bound England to France for four centuries, layered French over English (beef/cow, pork/pig), and left a permanent scar in national memory — the {{norman-yoke|Norman Yoke}}. Yet the conquerors kept the {{shire|shires}}, the {{danegeld|geld}}, and the idea of England: the state survived its own decapitation.`]},{id:`william-conqueror`,term:`William the Conqueror`,era:`r.1066–1087`,category:`people`,body:[`Illegitimate son of a Norman duke who made himself king of England by winning a single day-long battle at Hastings. He ruled with ruthless thoroughness: castles everywhere, the "Harrying of the North" (a deliberate devastation whose scars showed for a generation), and the {{domesday|Domesday Book}}.`,`He claimed to be {{edward-confessor|Edward the Confessor}}'s lawful heir, not a conqueror — which is why he kept English institutions intact.`]},{id:`domesday`,term:`Domesday Book`,era:`1086`,category:`terms`,body:[`The great survey {{william-conqueror|William}} ordered of who held what land, down to the last plough-team and pig. Nothing like it existed anywhere else in Europe — it was possible only because the {{anglo-saxon-england|Anglo-Saxon state}} already had the records and the {{shire|shire}} machinery to compile it.`,`Contemporaries named it after the Day of Judgment: from its verdict there was no appeal.`]},{id:`feudalism`,term:`Feudalism`,era:`c.1066–c.1500`,category:`ideas`,body:[`The system in which land was held from a lord in exchange for service — knights owed fighting, peasants owed labour. After the {{norman-conquest|Conquest}}, every acre of England was held, ultimately, from the king.`,`That "ultimately" is the English peculiarity: the crown was strong enough that feudalism here meant royal power exercised through lords, not royal power dissolved among them. Historians now quarrel over whether "feudalism" is even a useful word — it was never a system anyone at the time could have named.`]},{id:`norman-yoke`,term:`The Norman Yoke`,era:`idea, c.1600 onward`,category:`ideas`,body:[`The belief that free {{anglo-saxon-england|Anglo-Saxon England}} was crushed by the {{norman-conquest|Conquest}}, and that English liberty ever since has been a struggle to recover stolen ancient rights. Radicals in the {{civil-war|Civil War}}, and reformers long after, invoked it.`,`As history it is mostly myth; as a political idea it was potent for centuries. Tombs uses it as a prime example of his theme: stories the English tell about their past change what they do in the present.`]},{id:`common-law`,term:`The common law`,era:`c.1150 onward`,category:`institutions`,body:[`English case-made law, "common" because royal judges applied it uniformly across the realm — built up from precedent rather than from a Roman-law code. It grew from {{henry-ii|Henry II}}'s legal reforms and the older {{shire|shire courts}}.`,`Its habits — {{jury-trial|trial by jury}}, adversarial argument, judges bound by past decisions — spread wherever English rule went, and its independence from the crown became a bulwark of English liberty celebrated by {{whig-history|Whig historians}}.`]},{id:`jury-trial`,term:`Trial by jury`,era:`c.1166 onward`,category:`institutions`,body:[`Deciding guilt by the verdict of twelve local laymen rather than by a judge, an ordeal, or a confession. It emerged under {{henry-ii|Henry II}} as a practical royal tool and hardened into a right.`,`Its deeper significance, in Tombs' telling: it kept ordinary Englishmen inside the machinery of state, and made English criminal justice depend on community consent.`]},{id:`henry-ii`,term:`Henry II`,era:`r.1154–1189`,category:`people`,body:[`First Plantagenet king, ruler of an "Angevin empire" stretching from Scotland's border to the Pyrenees. A restless administrator, he built the {{common-law|common law}} and royal justice into permanent institutions.`,`He is remembered above all for the murder of {{thomas-becket|Thomas Becket}} — the great medieval collision between crown and church.`]},{id:`thomas-becket`,term:`Thomas Becket`,era:`c.1120–1170`,category:`people`,body:[`{{henry-ii|Henry II}}'s chancellor and friend, made Archbishop of Canterbury — whereupon he became the church's fiercest defender against the king. Four knights, taking Henry's rage literally, cut him down in his own cathedral in December 1170.`,`Christendom was horrified; Canterbury became one of Europe's great pilgrimage shrines (the destination in Chaucer's *Canterbury Tales*), until {{henry-viii|Henry VIII}} — no friend of saints who defied kings — obliterated it.`]},{id:`king-john`,term:`King John`,era:`r.1199–1216`,category:`people`,body:[`The Plantagenet who lost Normandy to France (1204), taxed England mercilessly to win it back, quarrelled with the pope, and drove his barons into the revolt that produced {{magna-carta|Magna Carta}}.`,`Losing Normandy mattered as much as the charter: it cut the aristocracy's cross-Channel estates and began turning a French-speaking elite into Englishmen.`]},{id:`magna-carta`,term:`Magna Carta`,era:`1215`,category:`events`,body:[`The "Great Charter" that rebel barons forced {{king-john|King John}} to seal at Runnymede. Most of it dealt with feudal grievances, but two ideas proved immortal: the king is under the law, and no free man may be punished except by lawful judgment.`,`Annulled within weeks, reissued after John's death, it became the founding text of English (and later American) constitutionalism — less for what it said than for what later generations, especially {{whig-history|Whig}} lawyers, chose to believe it said.`]},{id:`parliament`,term:`Parliament`,era:`c.1265 onward`,category:`institutions`,body:[`England's national assembly, which grew in the thirteenth century out of the king's need for consent to taxation. What made it unusual in Europe: it included elected knights and townsmen — the future {{house-of-commons|House of Commons}} — alongside lords and bishops, and taxation genuinely required its assent.`,`Kings summoned it as a tool; it slowly became their master. By the seventeenth century the question "king or Parliament?" would tear the country apart in {{civil-war|civil war}}.`]},{id:`house-of-commons`,term:`The House of Commons`,era:`c.1341 onward`,category:`institutions`,body:[`The elected chamber of {{parliament|Parliament}} — two knights per {{shire|shire}}, two burgesses per borough — which began meeting separately from the Lords in the fourteenth century. Its early leverage was simple: money. No grant of taxes without redress of grievances.`,`Over centuries it went from petitioner to sovereign; by the twentieth century, "Parliament" effectively meant the Commons.`]},{id:`hundred-years-war`,term:`The Hundred Years' War`,era:`1337–1453`,category:`events`,body:[`The long, intermittent Anglo-French struggle that began when {{edward-iii|Edward III}} claimed the French crown. Spectacular English victories — Crécy, Poitiers, {{agincourt|Agincourt}} — could not hold France, and by 1453 only Calais remained.`,`Its real legacy was at home: war taxation entrenched {{parliament|Parliament}}; the longbow armies bred a mythology of English prowess; and fighting France made the elite decisively English rather than French. Defeat abroad then helped ignite the {{wars-of-roses|Wars of the Roses}}.`]},{id:`edward-iii`,term:`Edward III`,era:`r.1327–1377`,category:`people`,body:[`The warrior king who launched the {{hundred-years-war|Hundred Years' War}} and presided over its most glorious phase — Crécy, the capture of Calais, the founding of the Order of the Garter. He made war a national, parliamentary enterprise, funded by taxes on England's wool trade.`,`His fertile family was his time bomb: rival descent from his many sons supplied both sides of the {{wars-of-roses|Wars of the Roses}}.`]},{id:`black-death`,term:`The Black Death`,era:`1348–1349`,category:`events`,body:[`The plague that killed roughly half of England's people in eighteen months — the greatest catastrophe in the nation's history. Whole villages vanished; the labour shortage upended the social order.`,`Survivors' wages rose despite laws to freeze them, serfdom withered, and resentment of those laws fed the {{peasants-revolt|Peasants' Revolt}}. Tombs stresses the paradox: mass death made the surviving English freer and richer.`]},{id:`peasants-revolt`,term:`The Peasants' Revolt`,era:`1381`,category:`events`,body:[`The great popular rising after the {{black-death|Black Death}}, triggered by a poll tax. Rebels under Wat Tyler took London, executed the archbishop, and demanded the end of serfdom — the boy king Richard II talked them down, then broke every promise.`,`Its slogan — "When Adam delved and Eve span, who was then the gentleman?" — is among the oldest voices of English radical egalitarianism, a tradition that resurfaces in the {{civil-war|Civil War}} and beyond.`]},{id:`lollards`,term:`The Lollards`,era:`c.1380–c.1520`,category:`ideas`,body:[`Followers of the Oxford theologian John Wycliffe, who attacked church wealth, questioned transubstantiation, and sponsored the first complete English Bible. Driven underground as heretics, they survived in pockets for over a century.`,`They gave the later {{reformation-england|English Reformation}} a native ancestry — and gave {{protestantism|Protestant}} historians a homegrown martyr tradition to celebrate.`]},{id:`agincourt`,term:`Agincourt`,era:`1415`,category:`events`,body:[`{{henry-v|Henry V}}'s improbable destruction of a much larger French army, won by massed longbows and French disorder in the mud. Militarily it reopened the {{hundred-years-war|Hundred Years' War}}; culturally, thanks to Shakespeare's *Henry V* ('band of brothers'), it became the permanent English shorthand for the outnumbered underdog's victory.`]},{id:`henry-v`,term:`Henry V`,era:`r.1413–1422`,category:`people`,body:[`Victor of {{agincourt|Agincourt}} and, by the Treaty of Troyes (1420), recognized heir to the French throne. He died at thirty-five, two months before the French king whose crown he was to inherit, leaving a nine-month-old son.`,`That infant inheritance — an English king of France who could not rule either — set the stage for final defeat in France and the {{wars-of-roses|Wars of the Roses}} at home.`]},{id:`wars-of-roses`,term:`The Wars of the Roses`,era:`1455–1487`,category:`events`,body:[`Three decades of dynastic bloodletting between the houses of Lancaster and York, both descended from {{edward-iii|Edward III}}. Kings were deposed, restored, murdered; the old warrior nobility gutted itself.`,`It ended when Henry Tudor killed Richard III at Bosworth (1485) and married the Yorkist heiress, founding the Tudor dynasty. The "red rose v. white rose" framing is largely later packaging — Tudor spin and Shakespeare made the era a morality tale about the horrors of civil war and the blessing of strong monarchy.`]}],ar=[{id:`reformation-england`,term:`The English Reformation`,era:`c.1527–1559`,category:`events`,body:[`England's break with the Roman church — begun not by theology but by {{henry-viii|Henry VIII}}'s need for an annulment, then radicalized under his son, reversed under {{mary-i|Mary}}, and finally settled under {{elizabeth-i|Elizabeth}}.`,`Tombs calls the resulting divide — {{protestantism|Protestant}} versus {{catholicism|Catholic}}, and later Anglican versus {{puritans|Puritan}} — "the Great Divide": for a century and a half it was the fault line of English politics, war, and identity.`]},{id:`henry-viii`,term:`Henry VIII`,era:`r.1509–1547`,category:`people`,body:[`The king who made himself Supreme Head of the {{church-of-england|Church of England}} so he could annul his marriage to Katherine of Aragon and marry Anne Boleyn. Six wives, two of them beheaded; the {{dissolution-monasteries|monasteries dissolved}}; ancient shrines smashed.`,`He remained doctrinally conservative — he burned Protestants as readily as he hanged Catholic loyalists. The real Protestant turn came under his son {{edward-vi|Edward VI}}.`]},{id:`edward-vi`,term:`Edward VI`,era:`r.1547–1553`,category:`people`,body:[`Henry's son, king at nine, dead at fifteen — but the reign in which England became doctrinally Protestant: altars stripped, images whitewashed, and {{thomas-cranmer|Cranmer}}'s English {{book-of-common-prayer|Prayer Book}} imposed on every parish.`]},{id:`mary-i`,term:`Mary I`,era:`r.1553–1558`,category:`people`,body:[`Katherine of Aragon's daughter, who restored {{catholicism|Catholicism}} and burned some 280 Protestants — earning, via {{foxes-martyrs|Foxe's Book of Martyrs}}, the name "Bloody Mary" and giving English {{protestantism|Protestantism}} its martyrology.`,`Her marriage to Philip II of Spain and the loss of Calais fused Catholicism with foreign domination in the English imagination — a fusion that shaped {{anti-popery|anti-popery}} for three centuries.`]},{id:`thomas-cranmer`,term:`Thomas Cranmer`,era:`1489–1556`,category:`people`,body:[`Archbishop of Canterbury under {{henry-viii|Henry VIII}} and {{edward-vi|Edward VI}}, author of the {{book-of-common-prayer|Book of Common Prayer}} — the cadences that shaped English speech for four centuries ("till death us do part").`,`Under {{mary-i|Mary}} he recanted his Protestantism, then dramatically recanted the recantation at the stake, thrusting the hand that had signed into the fire first.`]},{id:`book-of-common-prayer`,term:`The Book of Common Prayer`,era:`1549/1552/1662`,category:`institutions`,body:[`The {{church-of-england|Church of England}}'s liturgy in English, largely {{thomas-cranmer|Cranmer}}'s work. For centuries nearly every English person was baptized, married, and buried in its words; with the King James Bible it is one of the two great shapers of the language.`,`Imposing it caused rebellions (Devon and Cornwall rose against the "Christmas game" of 1549), and imposing it on Scotland in 1637 helped trigger the {{civil-war|Civil War}}.`]},{id:`dissolution-monasteries`,term:`Dissolution of the Monasteries`,era:`1536–1540`,category:`events`,body:[`The suppression of England's 800-odd religious houses and confiscation of their lands — perhaps a quarter of the country — by {{henry-viii|Henry VIII}}. It was the largest transfer of land since the {{norman-conquest|Norman Conquest}}.`,`The crown sold most of it, creating a gentry class with a hard financial stake in the {{reformation-england|Reformation}} never being reversed. The ruined abbeys became England's most romantic scenery and a standing reproach in Catholic memory.`]},{id:`church-of-england`,term:`The Church of England`,era:`1534 onward`,category:`institutions`,body:[`The national church created when {{henry-viii|Henry VIII}} replaced the pope with the crown as its Supreme Head. Under {{elizabeth-i|Elizabeth}} it settled into a deliberate hybrid — Protestant doctrine, traditional structure of bishops and cathedrals — satisfying neither {{catholicism|Catholics}} nor hotter {{puritans|Puritans}}.`,`Established by law, entwined with monarchy, parish, and university, it was for centuries the default frame of English life — and every fight about it was also a fight about the state.`]},{id:`protestantism`,term:`Protestantism`,era:`16th c. onward`,category:`ideas`,body:[`The reform movement begun by Luther in 1517: salvation by faith, scripture over church tradition, worship in the vernacular. In England it arrived through smuggled books and Tyndale's New Testament before kings took it up.`,`By 1600 Protestant identity — defined heavily against {{catholicism|Rome}}, {{foxes-martyrs|martyr-stories}}, and Spain — had fused with Englishness itself: to be English was to be free-born and Protestant. That fusion drove politics until the nineteenth century.`]},{id:`catholicism`,term:`Catholicism in England`,era:`16th c. onward`,category:`ideas`,body:[`After the {{reformation-england|Reformation}}, the old faith became a persecuted minority religion of recusant gentry families and hunted priests. To the Protestant state it looked like treason — allegiance to a foreign power that had excommunicated the queen.`,`The {{gunpowder-plot|Gunpowder Plot}} seared that suspicion into national ritual. Full civil rights returned only with Catholic Emancipation in 1829.`]},{id:`anti-popery`,term:`Anti-popery`,era:`c.1560–c.1850`,category:`ideas`,body:[`The visceral English conviction that "popery" meant tyranny, foreign domination, and burning Protestants — sustained by {{foxes-martyrs|Foxe}}, the {{spanish-armada|Armada}}, and the {{gunpowder-plot|Fifth of November}}.`,`It was arguably the strongest mass political emotion in England for three hundred years: it helped depose {{james-ii|James II}}, and its embers glowed into the Victorian age.`]},{id:`foxes-martyrs`,term:`Foxe's Book of Martyrs`,era:`1563`,category:`terms`,body:[`John Foxe's massive, vividly illustrated history of Protestants burned under {{mary-i|Mary}}. Chained next to the Bible in many parish churches, it taught generations that England was an elect Protestant nation tested by fire.`,`It is a textbook case of Tombs' theme: a history book — partisan, gripping, half-propaganda — manufacturing national identity.`]},{id:`elizabeth-i`,term:`Elizabeth I`,era:`r.1558–1603`,category:`people`,body:[`Anne Boleyn's daughter, who settled the {{church-of-england|church}} as moderately Protestant, survived plots and excommunication, and beat the {{spanish-armada|Armada}}. She turned her own image — Gloriana, the Virgin Queen — into an instrument of rule.`,`Her reign was later gilded as a golden age of Shakespeare and sea-dogs; the reality was war, inflation, and famine in the 1590s. Both the gilding and the reality matter in the book's telling.`]},{id:`spanish-armada`,term:`The Spanish Armada`,era:`1588`,category:`events`,body:[`Philip II's great invasion fleet, defeated by English gunnery, fireships, and Atlantic gales. "God blew and they were scattered", said the victory medal — confirmation, to the English, that Providence was Protestant.`,`Strategically the war dragged on inconclusively; mythologically, 1588 joined {{agincourt|Agincourt}} in the national scrapbook of David-and-Goliath deliverances, to be reused in 1805 and 1940.`]},{id:`puritans`,term:`The Puritans`,era:`c.1560–c.1690`,category:`ideas`,body:[`The "hotter sort" of Protestants who thought the {{elizabeth-i|Elizabethan}} settlement half-reformed — too many bishops, vestments, and ceremonies. Intense, literate, organized around sermon and scripture, they were a culture as much as a theology.`,`Blocked in the church, they turned to {{parliament|Parliament}} and, some, to New England. Their collision with {{charles-i|Charles I}}'s ceremonialist church was a main driver of the {{civil-war|Civil War}}.`]},{id:`gunpowder-plot`,term:`The Gunpowder Plot`,era:`1605`,category:`events`,body:[`A conspiracy by Catholic gentlemen to blow up king and {{parliament|Parliament}} at the state opening; Guy Fawkes was caught with the powder. Its providential discovery became a compulsory annual celebration — Bonfire Night — that kept {{anti-popery|anti-popery}} alive for centuries.`]},{id:`divine-right`,term:`Divine right of kings`,era:`c.1600–1688`,category:`ideas`,body:[`The doctrine that kings derive authority from God alone and answer to no earthly power. James I wrote treatises on it; {{charles-i|Charles I}} tried to govern by it, and it died with the {{glorious-revolution|Glorious Revolution}}.`,`In England it always collided with an older rival idea: that the king rules under law — {{magna-carta|Magna Carta}}'s legacy, sharpened by {{common-law|common lawyers}} like Edward Coke.`]},{id:`charles-i`,term:`Charles I`,era:`r.1625–1649`,category:`people`,body:[`The shy, stubborn king whose eleven years of rule without {{parliament|Parliament}}, ceremonialist religious policy, and disastrous attempt to impose a prayer book on Scotland brought on the {{civil-war|Civil War}}.`,`Defeated, he intrigued rather than settled, was tried by a purged Parliament, and was beheaded outside his own Banqueting House in January 1649 — dying with a dignity that made him a royal martyr and helped his son's {{restoration|Restoration}}.`]},{id:`civil-war`,term:`The Civil Wars`,era:`1642–1651`,category:`events`,body:[`The wars between {{charles-i|Charles I}} and {{parliament|Parliament}} — in Tombs' framing, wars of religion above all, pitting {{puritans|Puritan}} parliamentarians against a church-and-king coalition. Proportionally, they killed a larger share of the English than the {{first-world-war|First World War}}.`,`They produced a regicide, {{oliver-cromwell|Cromwell}}'s {{commonwealth|republic}}, an explosion of radical ideas ({{levellers|Levellers}}, Diggers), and a lasting English horror of standing armies and zealotry. How to name and interpret them — Great Rebellion? Puritan Revolution? — has been fought over ever since, notably by {{whig-history|Whig historians}}.`]},{id:`levellers`,term:`The Levellers`,era:`1645–1649`,category:`ideas`,body:[`Radicals in the New Model Army and London who demanded a written constitution, near-universal male suffrage, and religious toleration. At the Putney Debates (1647), Colonel Rainsborough argued that the poorest Englishman has a life to live as much as the greatest.`,`{{oliver-cromwell|Cromwell}} crushed them, but they left a template of democratic argument that reformers rediscovered repeatedly — and an example of the {{norman-yoke|Norman Yoke}} myth in radical action.`]},{id:`oliver-cromwell`,term:`Oliver Cromwell`,era:`1599–1658`,category:`people`,body:[`The Huntingdonshire gentleman who became the {{civil-war|Civil War}}'s greatest general and, as Lord Protector, the only non-royal ruler of England. A {{puritans|Puritan}} certain of Providence, he backed regicide, conquered Ireland with a brutality still remembered there, and tolerated more religious variety at home than any predecessor.`,`To some a liberator, to others a military dictator: his statue outside {{parliament|Parliament}} and his severed head's odyssey both testify to England's unresolved verdict.`]},{id:`commonwealth`,term:`The Commonwealth and Protectorate`,era:`1649–1660`,category:`terms`,body:[`England's republican interlude after the execution of {{charles-i|Charles I}} — first rule by the Rump Parliament, then by {{oliver-cromwell|Cromwell}} as Lord Protector. Militarily formidable abroad, it never solved its legitimacy problem at home.`,`Within two years of Cromwell's death it collapsed into the {{restoration|Restoration}} — leaving the English permanently suspicious of republics, armies in politics, and rule by the godly.`]},{id:`restoration`,term:`The Restoration`,era:`1660`,category:`events`,body:[`The return of {{charles-ii|Charles II}} to the throne, greeted with maypoles, theatres reopening, and bonfires — a deliberate cultural reversal of {{puritans|Puritan}} rule.`,`The settlement restored king, {{church-of-england|church}}, and {{parliament|Parliament}} but solved nothing fundamental: the same questions of religion and royal power returned within a generation in the {{glorious-revolution|Glorious Revolution}}.`]},{id:`charles-ii`,term:`Charles II`,era:`r.1660–1685`,category:`people`,body:[`The "Merry Monarch" — witty, cynical, and determined (as he put it) not to go on his travels again. His reign brought the plague of 1665, the {{great-fire|Great Fire}}, war with the Dutch, and the birth of {{whigs-tories|Whig and Tory}} parties in the crisis over his Catholic brother's succession.`,`He founded the Royal Society and dodged every constitutional showdown his father would have forced — dying, secretly, a Catholic.`]},{id:`great-fire`,term:`The Great Fire of London`,era:`1666`,category:`events`,body:[`Four days of fire that destroyed most of the medieval City of {{london|London}} — 13,000 houses and old St Paul's — a year after plague had killed perhaps 100,000 Londoners. Rebuilt in brick, crowned by Wren's new cathedral, the City rose fast: a favourite English parable of catastrophe shrugged off.`]},{id:`james-ii`,term:`James II`,era:`r.1685–1688`,category:`people`,body:[`Charles II's openly Catholic brother, whose campaign to win toleration for {{catholicism|Catholics}} — by suspending laws, packing offices, and prosecuting seven bishops — united almost the whole political nation against him. The birth of a Catholic heir in 1688 triggered the invitation to {{william-iii|William of Orange}}.`,`He fled without a battle, throwing the Great Seal into the Thames — allowing his opponents to claim, conveniently, that he had "abdicated".`]},{id:`glorious-revolution`,term:`The Glorious Revolution`,era:`1688–1689`,category:`events`,body:[`The overthrow of {{james-ii|James II}} by a Dutch invasion that met almost no resistance, and the installation of {{william-iii|William III}} and Mary II on terms: the Bill of Rights, regular {{parliament|Parliaments}}, no royal power to suspend law, a Protestant-only crown.`,`{{whig-history|Whig historians}} made it the founding miracle of English liberty — bloodless, moderate, sensible. Tombs complicates the halo: it was a foreign conquest of a sort, bloody indeed in Scotland and Ireland, and it bought liberty at the price of joining William's long European war against France.`]},{id:`william-iii`,term:`William III`,era:`r.1689–1702`,category:`people`,body:[`Dutch stadtholder, nephew and son-in-law of {{james-ii|James II}}, and Europe's chief organizer of resistance to Louis XIV. He took the English crown chiefly to bring England's weight into that struggle.`,`His wars created the {{fiscal-military-state|fiscal-military state}} — the {{bank-of-england|Bank of England}}, the {{national-debt|national debt}} — that made Britain a great power.`]},{id:`whigs-tories`,term:`Whigs and Tories`,era:`c.1679 onward`,category:`institutions`,body:[`England's original party division, born in the crisis over excluding the Catholic {{james-ii|James}} from the throne. Whigs: parliamentary supremacy, Protestant succession, toleration of Dissent, later commerce and reform. Tories: church and king, squire and parson.`,`Both names began as insults (Scottish rebel; Irish bandit). Mutating over centuries, the division runs in recognizable descent to today's parties — and gave {{whig-history|Whig history}} its name.`]},{id:`bank-of-england`,term:`The Bank of England`,era:`1694`,category:`institutions`,body:[`Founded to lend to {{william-iii|William III}}'s war government, it became the pivot of English public finance: managing the {{national-debt|national debt}}, issuing trusted paper, and anchoring {{london|London}}'s rise as the world's money market.`,`Cheap, credible borrowing was England's secret weapon — it let a middling country repeatedly outspend the far larger France.`]},{id:`national-debt`,term:`The national debt`,era:`1690s onward`,category:`institutions`,body:[`Permanent state borrowing, guaranteed by {{parliament|Parliament}} rather than by a king's promise — which is precisely why lenders trusted it. With the {{bank-of-england|Bank}} and an efficient excise, it formed the {{fiscal-military-state|fiscal-military state}}.`,`Contemporaries were terrified of it; in fact it financed victory in every major war from 1690 to 1815, by which time the debt exceeded double the national income — and Britain was the world's leading power.`]},{id:`fiscal-military-state`,term:`The fiscal-military state`,era:`c.1690–1815`,category:`terms`,body:[`Historians' name for the machine Britain built after 1688: heavy taxation (mostly indirect), the {{national-debt|funded debt}}, a professional {{royal-navy|navy}}, and a small army — all voted, audited, and legitimized by {{parliament|Parliament}}.`,`The paradox Tombs relishes: the "land of liberty" was, per head, one of Europe's most heavily taxed and effectively governed states. Consent made extraction efficient.`]},{id:`act-of-union-1707`,term:`The Union with Scotland`,era:`1707`,category:`events`,body:[`The treaty merging the English and Scottish parliaments into a single Parliament of Great Britain — driven by England's need to secure the Protestant succession and Scotland's need for access to English trade after the Darien disaster.`,`It created the state, and over time the identity, of "Britain" — layered on top of Englishness, never quite replacing it. Tombs' book is pointedly about the English, not the British; the distinction does real work, and {{devolution|devolution}} has lately sharpened it again.`]},{id:`jacobites`,term:`The Jacobites`,era:`1689–1746`,category:`terms`,body:[`Supporters of the exiled {{james-ii|Stuart}} line, strongest in Highland Scotland and among some English Tories. Their risings — especially 1715 and 1745, when Bonnie Prince Charlie reached Derby before turning back — were the last armed challenges to the {{glorious-revolution|Revolution settlement}}.`,`Culloden (1746) ended the cause militarily; romantic memory then made rebels into legends, another case of history rewritten as myth.`]},{id:`walpole`,term:`Robert Walpole`,era:`1676–1745`,category:`people`,body:[`The Norfolk squire who dominated politics for two decades after 1721 and is counted the first "prime minister" — a title coined as an insult. His system: low taxes, peace, patronage, and management of {{parliament|Parliament}} for the {{whigs-tories|Whig}} oligarchy.`,`He perfected cabinet government under a crown that reigned but no longer ruled — the practical working-out of the {{glorious-revolution|Revolution}}.`]},{id:`enlightenment`,term:`The English Enlightenment`,era:`c.1660–c.1800`,category:`ideas`,body:[`England's version of the age of reason — empirical, sociable, commercial, and comparatively pious. Its heroes were Newton and Locke; its venues coffee-houses, clubs, and journals rather than salons plotting against the state.`,`Tombs' point: because England had already had its revolution, its Enlightenment was establishment-friendly — improving rather than subverting. Continental philosophers looked to England as the model of a free, modern society.`]},{id:`methodism`,term:`Methodism`,era:`1730s onward`,category:`ideas`,body:[`The revival movement of John Wesley — open-air preaching, disciplined small societies, hymns, and a message of salvation open to all. It reached miners and mill-workers the {{church-of-england|established church}} missed, eventually becoming a separate denomination.`,`Its legacy runs through English popular culture: self-improvement, teetotalism, chapel respectability, and much of the early labour movement's leadership and moral style.`]},{id:`royal-navy`,term:`The Royal Navy`,era:`17th c.–20th c.`,category:`institutions`,body:[`England's chosen weapon: a wooden (later iron) wall that made invasion nearly impossible, protected trade, and let the country fight great-power wars without a great-power army. By 1805 and {{trafalgar|Trafalgar}} it commanded every ocean.`,`It shaped politics too — navies, unlike standing armies, cannot coerce their own countrymen, which is partly why the English tolerated theirs.`]},{id:`east-india-company`,term:`The East India Company`,era:`1600–1858`,category:`institutions`,body:[`A joint-stock trading company that became, bizarrely, the ruler of India. From trading posts at Madras, Bombay, and Calcutta, it acquired armies, revenues, and after 1757 whole provinces.`,`Parliament progressively tamed it; after the 1857 {{indian-rebellion|Rebellion}} the crown took over as the {{british-raj|Raj}}. Its career poses the empire question at its sharpest: conquest by a business, half-intended, hugely consequential.`]},{id:`thirteen-colonies`,term:`The American colonies`,era:`1607–1783`,category:`places`,body:[`England's settler colonies on the Atlantic seaboard — founded by {{puritans|Puritans}}, proprietors, and profit-seekers, populated by the largest English emigration anywhere. They ran themselves through assemblies modelled on {{parliament|Parliament}} and thought of their rights as English rights.`,`Which is why taxing them without representation, after 1763, read to them as tyranny: the {{american-revolution|Revolution}} was in part an English civil war over English principles, fought abroad.`]},{id:`american-revolution`,term:`The American Revolution`,era:`1775–1783`,category:`events`,body:[`The revolt of the {{thirteen-colonies|thirteen colonies}}, triggered by post-war taxation and ending — after France, Spain, and the Dutch piled in — with British defeat at Yorktown and recognition of the United States.`,`Tombs frames it as the fall of the first, Atlantic version of {{british-empire|empire}}: a shattering defeat that Britain, thanks to trade with its ex-colonies and the {{fiscal-military-state|fiscal-military state}}, absorbed with surprising speed. The "second" empire that followed faced east.`]},{id:`atlantic-slavery`,term:`The slave trade and slavery`,era:`c.1660–1833/1838`,category:`events`,body:[`British ships carried around three million enslaved Africans across the Atlantic; sugar islands worked by enslaved labour were the empire's richest possessions. {{london|London}}, Bristol, and Liverpool grew fat on the traffic.`,`The trade was abolished in 1807 and slavery itself in the 1830s, after the {{abolitionism|abolitionist}} campaign — the sequence of deep complicity followed by pioneering, costly abolition is, for Tombs, a defining moral knot in English history: neither half of it should be used to cancel the other.`]},{id:`abolitionism`,term:`Abolitionism`,era:`1787–1838`,category:`ideas`,body:[`The first modern mass moral campaign: petitions signed by hundreds of thousands, sugar boycotts, Wedgwood's kneeling-slave medallion, Wilberforce in {{parliament|Parliament}}, and Evangelical and {{methodism|Methodist}} energy behind it all.`,`It abolished the {{atlantic-slavery|slave trade}} in 1807, then slavery in the empire — with the {{royal-navy|Royal Navy}} spending decades suppressing the trade at sea. It invented the repertoire of modern pressure-group politics.`]},{id:`industrial-revolution`,term:`The Industrial Revolution`,era:`c.1760–c.1850`,category:`events`,body:[`The transformation that made England the "first industrial nation": coal, steam, cotton mills, iron, canals, then railways. Growth was slower than the word "revolution" suggests, but the cumulative change was total — by 1851 most English people lived in towns, a world first.`,`Why England first? Tombs weighs high wages and cheap coal (making machines profitable), secure property and patents, a tinkering craft culture, and a state that let it happen. Its human costs — {{dickensian-england|the Dickensian city}} — became the age's great political question.`]},{id:`french-revolution`,term:`The French Revolution`,era:`1789–1799`,category:`events`,body:[`France's revolution electrified and then divided England: radicals like Tom Paine saw the dawn; Edmund Burke predicted terror and dictatorship and built modern conservatism on the prediction coming true.`,`From 1793 it meant war — twenty-two years of it, ending at {{waterloo|Waterloo}} — and at home a panicky repression of English radicalism that postponed {{great-reform-act|parliamentary reform}} for a generation.`]},{id:`napoleonic-wars`,term:`The Napoleonic Wars`,era:`1803–1815`,category:`events`,body:[`The climax of the long duel with France. Britain's formula: {{royal-navy|sea power}} ({{trafalgar|Trafalgar}}), subsidies to continental allies funded by the {{national-debt|debt}}, economic blockade, {{wellington|Wellington}}'s Peninsular army — and outlasting Napoleon to {{waterloo|Waterloo}}.`,`Victory left Britain the world's banker, carrier, and naval hegemon for a century — the platform for the {{pax-britannica|Pax Britannica}}.`]},{id:`trafalgar`,term:`Trafalgar`,era:`1805`,category:`events`,body:[`Nelson's annihilating victory over the combined French and Spanish fleets off Cadiz, at the cost of his own life. It ended any prospect of invasion and fixed British naval supremacy for a hundred years.`,`Nelson dead became the supreme national icon — column, square, and signal ("England expects…") folded into the myth-kitty alongside {{spanish-armada|1588}} and {{agincourt|Agincourt}}.`]},{id:`wellington`,term:`The Duke of Wellington`,era:`1769–1852`,category:`people`,body:[`Victor of the Peninsular War and {{waterloo|Waterloo}}, later a deeply reluctant prime minister who nevertheless carried Catholic Emancipation (1829) because the alternative was civil war in Ireland.`,`The pattern — arch-conservative delivering reform to avert worse — recurs throughout English politics, and Tombs enjoys pointing it out.`]},{id:`waterloo`,term:`Waterloo`,era:`1815`,category:`events`,body:[`The final defeat of Napoleon by {{wellington|Wellington}}'s Anglo-allied army and Blücher's Prussians, south of Brussels — "the nearest-run thing you ever saw in your life", in the Duke's words.`,`It closed twenty-two years of war and opened a near-century in which Britain fought no general European war — the {{pax-britannica|Pax Britannica}}.`]},{id:`london`,term:`London`,era:`always`,category:`places`,body:[`England's head, and often its whole nervous system: by 1700 the largest city in western Europe, by 1900 the largest the world had ever seen. Capital, port, money market ({{city-of-london|the City}}), press, and stage in one.`,`Its gravitational pull — economic, cultural, political — is a constant of English history, and a constant complaint of everywhere else in England.`]}],or=[{id:`pax-britannica`,term:`Pax Britannica`,era:`1815–1914`,category:`terms`,body:[`The century between {{waterloo|Waterloo}} and 1914 in which Britain, supreme at sea and first to industrialize, policed the oceans, underwrote world trade, and fought no general European war.`,`It rested on the {{royal-navy|Royal Navy}}, {{free-trade|free trade}}, and the {{city-of-london|City}} — and on a certain amount of luck and forgetting, since it included plenty of small wars elsewhere.`]},{id:`dickensian-england`,term:`The Dickensian city`,era:`c.1815–c.1850`,category:`terms`,body:[`The England of the early {{industrial-revolution|industrial age}}: mushroom cities like Manchester, child labour, cholera, slums — and also astonishing energy, invention, and self-organization.`,`Dickens fixed its image forever; parliamentary Blue Books and novelists together forced "the Condition of England question" onto politics, producing factory acts, public health boards, and inspectors — the quiet beginnings of the modern administrative state.`]},{id:`great-reform-act`,term:`The Great Reform Act`,era:`1832`,category:`events`,body:[`The act that abolished the worst "rotten boroughs" (seats with a handful of voters), gave seats to the new industrial cities, and standardized the franchise — passed amid riots and threats to swamp the Lords with new peers.`,`It enfranchised only the propertied middle class, but the precedent was everything: the constitution could be rewritten peacefully under pressure. Further acts in {{second-reform-act|1867}}, 1884, 1918, and 1928 followed the channel it cut.`]},{id:`second-reform-act`,term:`The Second Reform Act`,era:`1867`,category:`events`,body:[`{{disraeli|Disraeli}}'s "leap in the dark", doubling the electorate and giving the vote to much of the urban working class — carried by a Conservative to dish the Liberals.`,`It began the age of mass politics: party machines, national campaigns, and (in 1870) state schooling, since the new voters had better be able to read.`]},{id:`chartism`,term:`Chartism`,era:`1838–1848`,category:`ideas`,body:[`The first mass working-class political movement anywhere: millions signed petitions for the six points of the People's Charter — universal male suffrage, secret ballot, paid MPs, and the rest.`,`Parliament rejected it three times and the movement faded after 1848, yet five of its six demands eventually became law. Tombs reads it as very English radicalism: constitutional in method, historical in imagination ({{norman-yoke|lost rights}} again), and largely non-violent.`]},{id:`corn-laws`,term:`Repeal of the Corn Laws`,era:`1846`,category:`events`,body:[`The Corn Laws taxed imported grain to protect landowners. Repeal — forced through by Tory PM Robert Peel under the shadow of the {{irish-famine|Irish Famine}}, splitting his party for a generation — made cheap bread and {{free-trade|free trade}} the creed of Victorian England.`,`The episode became the classic case of a governing class voting against its own economic interest, and of moral pressure-group politics ({{abolitionism|abolition}}'s heir, the Anti-Corn Law League) winning.`]},{id:`free-trade`,term:`Free trade`,era:`c.1846–1932`,category:`ideas`,body:[`More than an economic policy: a Victorian moral creed. Cheap food for the worker, peace through commerce, no tariffs for vested interests — sealed by {{corn-laws|repeal in 1846}} and defended like scripture until the Depression killed it in 1932.`,`Britain kept its markets open even as rivals protected theirs — generosity, hubris, or the {{city-of-london|City}}'s interest, depending on who tells it.`]},{id:`irish-famine`,term:`The Irish Famine`,era:`1845–1852`,category:`events`,body:[`The potato blight that killed around a million people in Ireland — then part of the United Kingdom — and drove well over a million more to emigrate, while doctrinaire relief policy in London proved catastrophically inadequate.`,`It permanently poisoned Anglo-Irish relations and powered the demand for {{irish-home-rule|Home Rule}} that would dominate and repeatedly wreck British politics.`]},{id:`victorian-values`,term:`Victorian values`,era:`c.1837–1901`,category:`ideas`,body:[`The moral style of the age: work, thrift, self-help, respectability, family, chapel or church, and voluntary association — mocked by later generations as hypocrisy, admired by others as the cement of a self-governing society.`,`Tombs stresses how much Victorian order rested not on the (tiny) state but on this dense web of chapels, friendly societies, clubs, and charities.`]},{id:`gladstone`,term:`William Gladstone`,era:`1809–1898`,category:`people`,body:[`The "Grand Old Man" of Victorian Liberalism: four times prime minister, moral crusader, budget-cutter who believed money should "fructify in the pockets of the people", and eventual convert to {{irish-home-rule|Irish Home Rule}} — which split his party.`,`His duels with {{disraeli|Disraeli}} defined the era's politics as a contest of moral visions, followed by a newspaper-reading mass public like a national serial.`]},{id:`disraeli`,term:`Benjamin Disraeli`,era:`1804–1881`,category:`people`,body:[`Novelist, dandy, outsider (baptized son of a Jewish man of letters), and the maker of modern Conservatism. He carried the {{second-reform-act|1867 Reform Act}}, preached "One Nation" social reform, and draped the party in {{british-empire|empire}} and crown — making {{victoria|Victoria}} Empress of India.`,`His genius was narrative: he understood that parties live by the stories they tell about the nation.`]},{id:`victoria`,term:`Queen Victoria`,era:`r.1837–1901`,category:`people`,body:[`The queen who gave her name to the age: sixty-three years on the throne, during which the monarchy traded its remaining political power for something more durable — moral symbolism, domestic respectability, and imperial pageantry.`,`Her jubilees (1887, 1897) were the high mass of {{british-empire|empire}}; her withdrawal into mourning after Albert's death nearly wrecked the institution first.`]},{id:`british-empire`,term:`The British Empire`,era:`c.1600–c.1960`,category:`institutions`,body:[`At its 1920s peak, a quarter of the world's land and people: settler dominions, the {{british-raj|Indian Raj}}, crown colonies, protectorates, and naval bases — acquired, as one historian quipped, half in a fit of absence of mind, and run remarkably cheaply.`,`Tombs' treatment resists both nostalgia and blanket condemnation: the empire was many different things at once — {{atlantic-slavery|slavery}} and {{abolitionism|abolition}}, famine and railways, conquest and law — and its weight in English domestic life was smaller than either its celebrants or its prosecutors assume.`]},{id:`british-raj`,term:`The Raj`,era:`1858–1947`,category:`institutions`,body:[`Direct crown rule over India after the {{indian-rebellion|1857 Rebellion}} ended {{east-india-company|Company}} rule — the empire's centrepiece, run by a few thousand British civil servants atop Indian soldiers, clerks, and princes.`,`It gave Britain great-power weight (and the Indian Army), while Indian nationalism, from the Congress of 1885 to Gandhi, slowly made it untenable; it ended in 1947 in independence and the bloodbath of Partition.`]},{id:`indian-rebellion`,term:`The Indian Rebellion`,era:`1857–1858`,category:`events`,body:[`A rising of sepoy soldiers and princely allies against {{east-india-company|East India Company}} rule across northern India, suppressed with atrocities on both sides.`,`It ended Company rule, brought in the crown ({{british-raj|the Raj}}), and left a legacy of racial distance and distrust that never healed.`]},{id:`irish-home-rule`,term:`Irish Home Rule`,era:`1870–1922`,category:`ideas`,body:[`The demand for a self-governing Irish parliament within the United Kingdom. {{gladstone|Gladstone}}'s conversion split British Liberalism; Ulster Protestant resistance brought Britain to the edge of civil war by 1914.`,`After the Easter Rising (1916) and the Anglo-Irish war, most of Ireland left the UK in 1922 — the largest secession the British state ever suffered, and a rehearsal of questions about union and identity that returned with {{devolution|devolution}}.`]},{id:`city-of-london`,term:`The City of London`,era:`c.1690 onward`,category:`institutions`,body:[`The square mile of banks, exchanges, and insurers that financed Britain's wars (via the {{bank-of-england|Bank}} and {{national-debt|debt}}), then the world's railways, trade, and governments in the {{pax-britannica|Victorian century}}.`,`Repeatedly written off — after 1914, after 1945 — it reinvented itself, most dramatically with the 1986 "Big Bang" deregulation under {{thatcher|Thatcher}}. Its dominance is a recurring answer, and question, in arguments about the English economy.`]},{id:`suffragettes`,term:`The suffragettes`,era:`1903–1918`,category:`ideas`,body:[`The militant wing of the votes-for-women movement, led by the Pankhursts: window-smashing, arson, hunger strikes, and the state's ugly reply of force-feeding. (The law-abiding "suffragists" were far more numerous.)`,`The vote came in {{fourth-reform-act|1918}} for women over thirty, and on equal terms in 1928 — whether militancy hastened or delayed it is still argued.`]},{id:`fourth-reform-act`,term:`The 1918 Representation of the People Act`,era:`1918`,category:`events`,body:[`The act that finally made Britain something like a democracy: all men over twenty-one and most women over thirty, tripling the electorate at a stroke after the {{first-world-war|First World War}}.`,`Equal suffrage at twenty-one followed in 1928, completing the long arc begun in {{great-reform-act|1832}} — with no revolution at any point, a fact {{whig-history|Whig history}} made much of.`]},{id:`liberalism`,term:`English liberalism`,era:`19th c. onward`,category:`ideas`,body:[`The Victorian governing creed: individual liberty, {{free-trade|free trade}}, cheap government, religious toleration, and reform by argument — Mill its philosopher, {{gladstone|Gladstone}} its preacher.`,`Around 1900 a "New Liberalism" turned toward social reform and pensions, laying ground the {{welfare-state|welfare state}} later built on, before the {{labour-party|Labour Party}} displaced the Liberals as the left's main vehicle.`]},{id:`labour-party`,term:`The Labour Party`,era:`1900 onward`,category:`institutions`,body:[`The party founded by {{trade-unions|trade unions}} and socialist societies to put working men in {{parliament|Parliament}}. Its ethos, famously, owed more to {{methodism|Methodism}} than to Marx: chapel, union lodge, and co-op, not barricade.`,`It supplanted the Liberals in the 1920s, built the {{welfare-state|welfare state}} and {{nhs|NHS}} under {{attlee|Attlee}}, and has alternated in power with the Conservatives ever since — refounded as "New Labour" under {{blair|Blair}}.`]},{id:`trade-unions`,term:`The trade unions`,era:`19th–20th c.`,category:`institutions`,body:[`Workers' combinations that fought from illegality to become, by the mid-twentieth century, estates of the realm — founders and paymasters of the {{labour-party|Labour Party}}.`,`Their showdowns punctuate the story: the {{general-strike|General Strike}} (1926), the {{winter-of-discontent|Winter of Discontent}} (1978–79), and the {{miners-strike|miners' strike}} (1984–85), after which their power was broken.`]},{id:`first-world-war`,term:`The First World War`,era:`1914–1918`,category:`events`,body:[`Britain's entry — for Belgium, and to stop German hegemony — turned a continental crisis into world war. It cost some 720,000 British dead, built a vast citizen army from a nation with no conscription tradition, and ended with victory in 1918.`,`Tombs pushes against the settled national memory of pure futility ("lions led by donkeys", the {{somme|Somme}} as sheer waste): the war, he argues, was a real contest over Europe's future that Britain could not safely have sat out — and by 1918 its army was the most effective on the Western Front. The {{war-poets|poets' version}} won the memory war anyway.`]},{id:`somme`,term:`The Somme`,era:`1916`,category:`events`,body:[`The great Anglo-French offensive of 1916: nearly 20,000 British dead on the first day, the worst in the army's history, and about 420,000 British casualties over four months for a few miles of ground.`,`It became the permanent English image of the {{first-world-war|First World War}} — though military historians note the 1916 army was learning lessons applied with lethal competence by 1918. Memory and history diverge here more than almost anywhere.`]},{id:`war-poets`,term:`The war poets`,era:`1914–1918`,category:`terms`,body:[`Owen, Sassoon, and their fellows, whose bitter, pitying poetry — most of it little read until decades later — eventually became the lens through which the English see the {{first-world-war|First World War}}.`,`For Tombs they are the prime exhibit of memory overwriting history: a minority literary verdict, canonized by schoolrooms in the 1960s, standing in for the experience of millions who mostly believed the war necessary.`]},{id:`general-strike`,term:`The General Strike`,era:`1926`,category:`events`,body:[`Nine days in which the {{trade-unions|TUC}} called out millions in support of locked-out miners — and then called it off, beaten by government preparation and its own constitutional scruples.`,`Britain's nearest brush with class war ended with buses driven by undergraduates and football matches between strikers and police: revolution, English-style, declined to occur.`]},{id:`appeasement`,term:`Appeasement`,era:`1933–1939`,category:`ideas`,body:[`The policy of conceding to Hitler's demands — remilitarization, Austria, the Sudetenland at {{munich|Munich}} — in hope of avoiding another {{first-world-war|1914}}. Its roots: war-horror, imperial overstretch, guilt about Versailles, and lack of allies.`,`After 1939 it became the great negative lesson of English politics, invoked (not always aptly) from {{suez-crisis|Suez}} to Iraq. Tombs treats Chamberlain as tragically wrong rather than contemptible — and notes rearmament quietly begun under the umbrella of talk.`]},{id:`munich`,term:`The Munich Agreement`,era:`1938`,category:`events`,body:[`Chamberlain's deal ceding Czechoslovakia's Sudetenland to Hitler — "peace for our time", to cheering crowds. Within six months Hitler took Prague and the policy of {{appeasement|appeasement}} was dead.`,`"Munich" entered the language as the byword for fatal concession — one of those history-lessons-as-weapons the book keeps tracking.`]},{id:`second-world-war`,term:`The Second World War`,era:`1939–1945`,category:`events`,body:[`The war that supplied England's central modern myth. The verified core: in 1940–41, under {{churchill|Churchill}}, Britain and its empire genuinely stood alone against a victorious Germany — {{dunkirk|Dunkirk}}, the {{battle-of-britain|Battle of Britain}}, the {{blitz|Blitz}} — until Russia and America entered the war.`,`Tombs' double point: the "finest hour" story is substantially true, *and* its later uses — as proof Britain needs no allies, or as the peak from which all is {{declinism|decline}} — have distorted politics ever since. Victory came at the price of bankruptcy and exhaustion.`]},{id:`churchill`,term:`Winston Churchill`,era:`1874–1965`,category:`people`,body:[`Half-American aristocrat, serial party-switcher, author of the {{gallipoli|Gallipoli}} disaster, prophet against {{appeasement|appeasement}} — and, from May 1940, the voice of national defiance whose speeches turned a desperate strategic position into a moral epic.`,`He was also a historian: his own books wrote the {{second-world-war|war's}} first draft, starring himself. Voted out in the 1945 landslide that brought {{attlee|Attlee}} in — a very English piece of ingratitude, or of level-headedness.`]},{id:`gallipoli`,term:`Gallipoli`,era:`1915–1916`,category:`events`,body:[`The failed Allied attempt — championed by {{churchill|Churchill}} — to force the Dardanelles and knock Ottoman Turkey out of the {{first-world-war|First World War}}. A quarter-million Allied casualties for nothing; foundational national memory for Australia and New Zealand.`]},{id:`dunkirk`,term:`Dunkirk`,era:`1940`,category:`events`,body:[`The evacuation of 338,000 British and French troops from the beaches after the fall of France, aided by flat seas, Hitler's halt order, and the famous small boats.`,`A catastrophic defeat repackaged, instantly and deliberately, as deliverance — "the Dunkirk spirit" became England's go-to metaphor for improvised survival, filed next to {{spanish-armada|1588}}.`]},{id:`battle-of-britain`,term:`The Battle of Britain`,era:`1940`,category:`events`,body:[`The Luftwaffe's failed campaign for air supremacy over southern England — the precondition for invasion. Radar, Fighter Command's control system, and "the Few" held; by October Hitler postponed invasion indefinitely, and turned east.`,`It was the first clear check to Nazi Germany, and it mattered strategically: Britain remained in the war as the base from which liberation eventually came.`]},{id:`blitz`,term:`The Blitz`,era:`1940–1941`,category:`events`,body:[`The German night-bombing of {{london|London}} and other cities: around 43,000 civilians killed. "London can take it" propaganda built the enduring image of cheerful cockney endurance — partly true, partly manufactured, wholly durable.`,`The "Blitz spirit" remains the reflex English metaphor for any collective hardship, from floods to pandemics — myth doing daily work.`]},{id:`welfare-state`,term:`The welfare state`,era:`1942–1951`,category:`institutions`,body:[`The postwar settlement built from the wartime Beveridge Report's war on the "five giants" (want, disease, ignorance, squalor, idleness): national insurance, family allowances, universal secondary schooling, council housing, and the {{nhs|NHS}}.`,`Enacted mostly by {{attlee|Attlee}}'s Labour government with broad Conservative acquiescence, it defined the {{postwar-consensus|consensus}} era — and every subsequent argument about the state's size.`]},{id:`nhs`,term:`The National Health Service`,era:`1948`,category:`institutions`,body:[`Free health care for all, funded from taxation — pushed through by Aneurin Bevan against medical opposition ("stuffed their mouths with gold"). It became, and remains, the most loved institution in England: "the nearest thing the English have to a religion", as a Tory chancellor ruefully put it.`]},{id:`attlee`,term:`Clement Attlee`,era:`1883–1967`,category:`people`,body:[`The laconic Labour PM (1945–51) whose government built the {{welfare-state|welfare state}} and {{nhs|NHS}}, nationalized coal, rail, and the {{bank-of-england|Bank}}, granted Indian independence, and co-founded NATO — all in six exhausted, rationed years.`,`Routinely voted the most effective PM of the century; his quietness ("a modest man, with much to be modest about", sneered {{churchill|Churchill}}) became its own legend.`]},{id:`postwar-consensus`,term:`The postwar consensus`,era:`c.1945–1979`,category:`terms`,body:[`The broad cross-party settlement after 1945: full employment as the goal, Keynesian demand management, a mixed economy with nationalized utilities, strong {{trade-unions|unions}}, and the {{welfare-state|welfare state}}.`,`It delivered rising affluence for a generation, then seized up in the 1970s — inflation, strikes, the {{winter-of-discontent|Winter of Discontent}} — and was deliberately demolished by {{thatcher|Thatcherism}}.`]},{id:`suez-crisis`,term:`The Suez Crisis`,era:`1956`,category:`events`,body:[`Britain and France, colluding with Israel, invaded Egypt to reverse Nasser's nationalization of the Suez Canal — and were forced into humiliating withdrawal when the United States pulled the financial plug.`,`The imperial reflex died of shock: no British government since has acted militarily against Washington's wishes. For {{declinism|declinists}}, Suez is Exhibit A.`]},{id:`decolonization`,term:`Decolonization`,era:`1947–c.1980`,category:`events`,body:[`The dismantling of the {{british-empire|empire}} in a single generation: India in 1947, Ghana in 1957, then a rush of independence through the 1960s — mostly negotiated, sometimes fought (Kenya, Malaya, Aden).`,`Remarkably, Tombs notes, the English barely mourned: the empire vanished from domestic politics with strange speed, leaving the Commonwealth, post-imperial migration, and a long argument about guilt and memory.`]},{id:`windrush`,term:`The Windrush generation`,era:`1948 onward`,category:`events`,body:[`The postwar migration from the Caribbean (the *Empire Windrush* docked in 1948), then South Asia and beyond — citizens of empire exercising rights the law gave them, meeting labour shortage and, often, cold welcome.`,`It began England's transformation into a multi-ethnic society: from Notting Hill (1958) and Powell's 1968 speech through to the settled, contested multiculturalism of the 2000s — one of the deepest changes in the whole story.`]},{id:`sixties-revolution`,term:`The cultural revolution of the Sixties`,era:`c.1958–c.1975`,category:`events`,body:[`The fastest moral transformation in English history: the end of censorship and deference, legalization of abortion and homosexuality, easier divorce, the pill, pop music conquering the world from Liverpool.`,`Tombs frames it as the collapse of the {{victorian-values|Victorian}}-Christian moral order — celebrated as liberation, mourned as loss, and permanent either way. Church pews emptied in a generation.`]},{id:`winter-of-discontent`,term:`The Winter of Discontent`,era:`1978–1979`,category:`events`,body:[`The wave of public-sector strikes — rubbish uncollected, the dead unburied in Liverpool — that broke the Callaghan government and the {{postwar-consensus|postwar consensus}} with it.`,`The tabloid images did lasting political work: they elected {{thatcher|Thatcher}} and kept Labour unelectable for a generation. A textbook case of events becoming myth almost overnight.`]},{id:`thatcher`,term:`Margaret Thatcher`,era:`1925–2013`,category:`people`,body:[`The grocer's daughter who broke the {{postwar-consensus|postwar consensus}}: monetarism against inflation, privatization of state industries, council-house sales, defeat of the {{miners-strike|miners}}, the {{falklands-war|Falklands}}, and the {{city-of-london|Big Bang}}.`,`She revived the economy at the cost of industrial regions that never forgave her, and remains the most loved and hated PM of the century — the hinge on which modern England turns, and the great counter-example to {{declinism|declinism}}.`]},{id:`falklands-war`,term:`The Falklands War`,era:`1982`,category:`events`,body:[`Argentina's seizure of the Falkland Islands answered by a task force sailing 8,000 miles to retake them — 255 British dead, victory in ten weeks.`,`Strategically small, symbolically enormous: it resurrected {{thatcher|Thatcher}}'s premiership and punctured the narrative of inevitable {{declinism|decline}} — the {{second-world-war|1940}} script consciously replayed.`]},{id:`miners-strike`,term:`The miners' strike`,era:`1984–1985`,category:`events`,body:[`The year-long strike against pit closures led by Arthur Scargill — no national ballot, violent set-pieces like Orgreave, and eventual total defeat by a government that had stockpiled coal and was determined to win.`,`It ended the {{trade-unions|unions}}' power to break governments and effectively ended coal, the industry that had fuelled the {{industrial-revolution|Industrial Revolution}}. The scars in mining regions endure.`]},{id:`european-union`,term:`England and Europe`,era:`1973 onward`,category:`ideas`,body:[`Britain joined the European Community in 1973 — late, for economic reasons, after twice being vetoed — and confirmed membership by referendum in 1975. It stayed a half-hearted member: in for the market, out of the euro and Schengen.`,`Tombs, writing to 2014, stresses how the question cut across both parties for forty years and how English identity — {{parliament|parliamentary}} sovereignty, {{common-law|common law}}, wartime memory — kept rubbing against the project. The 2016 referendum lay just beyond the book's horizon.`]},{id:`devolution`,term:`Devolution`,era:`1997 onward`,category:`events`,body:[`{{blair|Blair}}'s government created a Scottish Parliament and Welsh Assembly in 1999, reversing three centuries of centralization since the {{act-of-union-1707|Union}}.`,`England, pointedly, got nothing — leaving the "English Question" (who speaks for England?) hanging, and pushing Englishness and Britishness further apart. The 2014 Scottish independence referendum, where the book ends, made the question urgent.`]},{id:`blair`,term:`Tony Blair`,era:`b.1953`,category:`people`,body:[`Creator of "New Labour", who accepted the {{thatcher|Thatcherite}} economic settlement, added minimum wage and public spending, delivered {{devolution|devolution}} and the Good Friday Agreement — and won three landslides.`,`Iraq (2003) consumed his reputation: the war, sold on intelligence that proved wrong, became this generation's {{appeasement|Munich}}-scale reference point for political mistrust.`]},{id:`declinism`,term:`Declinism`,era:`c.1890 onward`,category:`ideas`,body:[`The recurring English conviction that the country is finished — economically outclassed, morally softened, formerly great. Versions flourished in the 1890s (Germany rising), 1930s, 1960s–70s ("sick man of Europe"), and after 2008.`,`It is the book's principal target. Tombs' rebuttal: measured over centuries, England's wealth, stability, and influence have been remarkably resilient; decline relative to giants like the US was arithmetic, not failure. Declinism, he argues, is itself a historical force — bad history driving bad policy.`]},{id:`whig-history`,term:`Whig history`,era:`idea, named 1931`,category:`ideas`,body:[`The habit — named and skewered by Herbert Butterfield — of writing English history as a triumphal march toward liberty and {{parliament|parliamentary}} democracy: {{magna-carta|Magna Carta}} to {{glorious-revolution|1688}} to {{great-reform-act|1832}}, heroes progressive, villains reactionary.`,`Its master storyteller was {{macaulay|Macaulay}}. Tombs writes consciously after its fall: he keeps the real continuities (law, Parliament, liberty) while rejecting the inevitability — things could always have gone otherwise.`]},{id:`macaulay`,term:`Thomas Babington Macaulay`,era:`1800–1859`,category:`people`,body:[`Historian, essayist, and Whig politician whose *History of England* — a bestseller to rival Dickens — told the {{glorious-revolution|Glorious Revolution}} as the founding of modern liberty and made {{whig-history|Whig history}} the national self-image for a century.`,`For Tombs he is both a warning and a model: proof that history-writing shapes nations, for good and ill.`]},{id:`britishness`,term:`English v. British`,era:`1707 onward`,category:`ideas`,body:[`Two nested identities the book insists on distinguishing. "Britain" is the state made by the {{act-of-union-1707|1707 Union}} — a political and imperial project the English adopted so thoroughly they forgot the difference; "England" is the older nation inside it.`,`For two centuries Englishness hid inside Britishness. With the {{british-empire|empire}} gone and {{devolution|devolution}} unbalancing the Union, the English have had to ask again who they are — the question with which Tombs opens and closes.`]}],sr=Object.fromEntries([...ir,...ar,...or].map(e=>[e.id,e]));function cr(e){return sr[e]}var lr=o((e=>{var t=Symbol.for(`react.transitional.element`),n=Symbol.for(`react.fragment`);function r(e,n,r){var i=null;if(r!==void 0&&(i=``+r),n.key!==void 0&&(i=``+n.key),`key`in n)for(var a in r={},n)a!==`key`&&(r[a]=n[a]);else r=n;return n=r.ref,{$$typeof:t,type:e,key:i,ref:n===void 0?null:n,props:r}}e.Fragment=n,e.jsx=r,e.jsxs=r})),A=o(((e,t)=>{t.exports=lr()}))();function ur({conceptId:e,ancestors:t,depth:n,children:r}){let i=nr(),a=(0,x.useRef)(null),o=(0,x.useRef)(null),s=n??t.length,c=cr(e),l=t.includes(e),u=!c||l||s>=5,d=i.stack[s]?.conceptId===e;if((0,x.useEffect)(()=>{if(!(!d||!a.current))return i.registerChainEl(a.current)},[d,i]),(0,x.useEffect)(()=>()=>{o.current&&window.clearTimeout(o.current)},[]),u)return(0,A.jsx)(`span`,{className:`concept-link is-inert`,children:r});let f=()=>{o.current&&=(window.clearTimeout(o.current),null)};return(0,A.jsx)(`span`,{ref:a,className:`concept-link ${d?`is-open`:``}`,onMouseEnter:()=>{f(),o.current=window.setTimeout(()=>{a.current&&i.open(e,s,a.current)},300)},onMouseLeave:f,onClick:t=>{t.stopPropagation(),f(),a.current&&(d?i.closeAll():i.openLocked(e,s,a.current))},children:r})}function j(e,t=[],n){let r=[],i=/\{\{([a-z0-9-]+)\|([^}]+)\}\}/g,a=0,o,s=0;for(;(o=i.exec(e))!==null;)o.index>a&&r.push(...dr(e.slice(a,o.index),s++)),r.push((0,A.jsx)(ur,{conceptId:o[1],ancestors:t,depth:n,children:dr(o[2],0)},`c${s++}`)),a=o.index+o[0].length;return a<e.length&&r.push(...dr(e.slice(a),s++)),r}function dr(e,t){let n=[],r=/\*\*([^*]+)\*\*|\*([^*]+)\*/g,i=0,a,o=0;for(;(a=r.exec(e))!==null;)a.index>i&&n.push(e.slice(i,a.index)),a[1]===void 0?n.push((0,A.jsx)(`em`,{children:a[2]},`i${t}-${o++}`)):n.push((0,A.jsx)(`strong`,{children:a[1]},`b${t}-${o++}`)),i=a.index+a[0].length;return i<e.length&&n.push(e.slice(i)),n}var fr=360,pr=10,M=8,mr={people:`Person`,events:`Event`,institutions:`Inst `,x:`A kingdom of the English — with fixed borders roughly where they are now, {{shire|shires}}, a single coinage, and national taxation — has existed for over a thousand years. Most European states are, by comparison, novelties. Continuity, not rupture, is the deep pattern: the {{norman-conquest|Conquest}}, the {{reformation-england|Reformation}}, the {{civil-war|Civil Wars}}, and industrialization all changed England without breaking it.`},{t:`argument`,title:`Claim two: memory makes history`,x:`The stories a nation tells about its past change what it does next. {{foxes-martyrs|Foxe}} taught the English to see themselves as an elect Protestant nation, and they acted on it for three centuries. {{macaulay|Macaulay}} taught them their constitution was the envy of the world. The {{war-poets|war poets}} taught them their greatest collective effort had been futile. Each lesson — sound or not — steered policy.`},{t:`argument`,title:`Claim three: declinism is bad history`,x:`The belief that England's story since 1900 (or 1945, or 1914) is one of decline and fall is, Tombs argues, empirically weak and politically corrosive. England remains rich, stable, law-governed, and influential; its "decline" was mostly other countries catching up. {{declinism|Declinism}} is the book's recurring villain — a myth with a history of its own.`},{t:`h`,x:`How the book works`},{t:`p`,x:`The structure is chronological — seven parts from the {{anglo-saxon-settlement|Anglo-Saxon settlement}} to the eve of the 2014 Scottish referendum — but between the parts Tombs inserts interludes on how each era was later remembered, rewritten, and used. This companion keeps that structure: read the chapters for the story, the interludes for the argument about memory. Throughout, one distinction does heavy lifting: **England is not Britain**. The {{britishness|difference}} between the old nation and the 1707 state built on top of it frames the whole book, and returns with force at the end.`},{t:`reading`,title:`Where Tombs stands among historians`,blocks:[{t:`p`,x:`Tombs is a Cambridge historian of France, writing England from one step outside — he calls himself a sympathetic observer rather than a celebrant. Politically the book is broadly conservative in temperament: sceptical of fashionable guilt, warm toward institutions that work, unimpressed by {{declinism|declinist}} pessimism of either left or right. Critics have found it too cheerful about {{british-empire|empire}} and too hard on the left's historians; admirers praise its range and its refusal of both jingoism and self-flagellation. Knowing the author's angle helps you read the argument boxes in this companion critically — as positions, not verdicts.`}]},{t:`p`,x:`A note on reading: hover any red term for an explanation (hold still to pin the tooltip and explore deeper); open the "Go deeper" panels when you want context beyond the summary. The narrative proper begins with a prelude in the realm of legend — what Tombs calls the Dreamtime.`}]},{id:`prelude`,part:0,title:`The Dreamtime`,subtitle:`Prelude`,era:`to c.600`,blurb:`Before England there was legend: Britannia, Arthur, and the murky centuries between the fall of Rome and the first English kingdoms. Tombs calls this the Dreamtime — the part of the past the English have always invented most freely.`,blocks:[{t:`p`,x:`Every nation has a period before its records begin, onto which it projects its fantasies. For the English this is the half-millennium between {{roman-britain|Roman Britain}} and {{bede|Bede}}: the age of Arthur, of giants and founding myths — medieval chroniclers traced Britain to a Trojan prince named Brutus, and kings took the stories seriously enough to cite them in diplomacy. Tombs opens here to make a point that governs the whole book: where evidence is thin, story rushes in, and the stories have consequences.`},{t:`h`,x:`What actually happened (as far as we know)`},{t:`p`,x:`Rome ruled lowland Britain for nearly four centuries and then,
