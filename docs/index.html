r-consensus|consensus}} and preside over the boom.`},{year:`1954`,label:`Rationing finally ends`,detail:`Fourteen years after it began — meat is the last item freed.`},{year:`1956`,label:`{{suez-crisis|Suez}}`,detail:`The Anglo-French invasion of Egypt collapses under American pressure; the imperial illusion goes with it.`},{year:`1957`,label:`"Never had it so good"`,detail:`Macmillan names the affluent society; the {{declinism|declinist}} literature starts up almost simultaneously.`}]},{t:`h`,x:`The declinist chorus`},{t:`p`,x:`Even as life improved, a new genre appeared: the "what's wrong with Britain?" book. Journalists and academics totted up growth rates and found Germany, France, and Japan rising faster; they blamed amateurish elites, ancient institutions, unions, public schools — the diagnosis varied, the gloom was constant. {{declinism|Declinism}} became the reflex of the age, and it drew its sting, Tombs suggests, from the memory of 1940: a country that had just saved the world felt it should not be third in the growth tables.`},{t:`argument`,x:`Tombs argues that "decline" was relative arithmetic mistaken for absolute failure. Of course war-shattered economies rebuilding from rubble grew faster than one already rich. Meanwhile, for ordinary English people, these were the best years anyone had ever lived: full employment, rising real wages, free health care, secure pensions, longer lives. The tragedy of the postwar decades is not that England declined but that the English, coached by {{declinism|declinists}} and haunted by wartime glory, talked themselves into believing it had.`},{t:`p`,x:`By 1960 the English were richer, healthier, and more secure than ever — and restless. Affluence was dissolving the habits that had made the old order work: deference, thrift, chapel, the Sunday best. The revolution of the next chapter was not political. It happened in bedrooms, courtrooms, record shops, and pews.`}]},{id:`ch19`,part:7,number:`19`,title:`England's Cultural Revolutions`,era:`c.1955–c.1979`,blurb:`In one generation the Christian-Victorian moral order — chapel, deference, censorship, the indissoluble marriage — collapsed. The {{sixties-revolution|sixties}} were felt as liberation and as loss, and Tombs takes both readings seriously.`,blocks:[{t:`p`,x:`The wars changed who governed England; the {{sixties-revolution|sixties revolution}} — which Tombs dates broadly, from the mid-fifties to the late seventies — changed how the English lived. He calls it the fastest moral transformation in the nation's history. A moral order assembled over centuries from {{protestantism|Protestant}} conscience and {{victorian-values|Victorian}} respectability came apart in roughly twenty years, and it was dismantled not by revolutionaries but by MPs, judges, bishops, and shoppers.`},{t:`h`,x:`The end of deference`},{t:`p`,x:`It began with mockery. {{suez-crisis|Suez}} made the governing class look both dishonest and incompetent, and a satire boom — *Beyond the Fringe*, *Private Eye*, *That Was The Week That Was* — made it ridiculous, on television, to millions. The Profumo affair of 1963, a war minister lying to the {{house-of-commons|Commons}} about an affair entangled with a Soviet attaché, seemed to confirm every joke. The courtroom marked the sharper watershed: in 1960 a jury acquitted Penguin Books for publishing *Lady Chatterley's Lover*, laughing at the prosecutor's question of whether it was a book one would wish one's wife or servants to read. The old guardians had lost the country, and they knew it.`},{t:`h`,x:`Permissiveness by Act of Parliament`},{t:`p`,x:`What followed was a legislative avalanche, mostly under Harold Wilson's Labour governments and championed by Home Secretary Roy Jenkins, who preferred to call the permissive society the civilized society. The death penalty was suspended in 1965. In 1967 came the twin landmarks: abortion legalized, and homosexual acts between consenting men decriminalized. Divorce reform in 1969 ended the hunt for a guilty party; stage censorship was abolished; and the contraceptive pill, spreading through the decade, quietly rewrote the terms of sex itself. Alongside all this ran an education revolution — grammar and secondary moderns giving way to comprehensives, universities multiplying — and the second wave of feminism, from the Dagenham machinists' strike of 1968 to the Equal Pay and Sex Discrimination Acts of the seventies, pressing the logic of the {{suffragettes|suffragettes}} into pay packets and workplaces.`},{t:`reading`,title:`The pews empty`,blocks:[{t:`p`,x:`Beneath the visible reforms ran the deepest change: secularization. Sunday schools, chapels, and the {{church-of-england|Church of England}} had framed English morality for centuries — even unbelievers lived by rules the churches had written. From the sixties, attendance, baptisms, and Sunday-school enrolment fell off a cliff, and the fall never stopped. Historians argue over the cause: affluence, television, the pill, women (the churches' backbone) entering paid work, or simply the collapse of the belief that respectability required a pew.`},{t:`p`,x:`Tombs treats this as the quiet engine of the whole revolution. The permissive laws of 1967 did not create the new morality; they registered the fact that the old one had lost its congregation. When {{methodism|Methodism}} and its cousins faded, so did the culture of self-restraint they had carried since the eighteenth century.`}]},{t:`h`,x:`The world buys English pop`},{t:`p`,x:`The same country the {{declinism|declinists}} were writing off conquered the world's ears. The Beatles went from Liverpool cellars to global fame by 1964, leading a "British invasion" of the American charts; the Stones, the Who, and Carnaby Street fashion followed, and for a decade swinging {{london|London}} was the style capital of the planet. Tombs relishes the irony: England's most successful export in the age of "decline" was its youth culture. By the late seventies the mood had curdled into punk — the Sex Pistols snarling about anarchy and mocking the Jubilee — but even punk was a kind of backhanded tribute: only a country obsessed with its own decay could have invented it.`},{t:`h`,x:`Strangers into neighbours`},{t:`p`,x:`Meanwhile England was becoming multi-racial. The {{windrush|Windrush}} migration of the late forties grew through the fifties and sixties into substantial communities from the Caribbean, India, and Pakistan, drawn by work and empire's old connections. The reception mixed welcome, indifference, and ugliness — the Notting Hill riots of 1958, colour bars in lodging and work. Governments tried to hold two lines at once: restricting new entry while outlawing discrimination through Race Relations Acts from 1965 onward. In 1968 Enoch Powell detonated the debate with his "rivers of blood" speech, prophesying disaster. Heath sacked him from the shadow cabinet within a day, and the entire political class closed ranks against him — even as polls showed wide public sympathy. Tombs marks the moment as decisive: open racism was expelled from respectable politics, at the price of a lasting gap between elite and popular opinion on immigration.`},{t:`timeline`,title:`Two decades that remade English life`,events:[{year:`1960`,label:`*Lady Chatterley* acquitted`,detail:`The obscenity trial fails; literary censorship never recovers.`},{year:`1963`,label:`Profumo; Beatlemania`,detail:`The establishment humiliated and the new pop culture crowned in the same year.`},{year:`1965`,label:`First Race Relations Act; death penalty suspended`,detail:`Parliament begins policing discrimination and stops hanging.`},{year:`1967`,label:`The permissive watershed`,detail:`Abortion legalized; homosexuality decriminalized — the heart of the {{sixties-revolution|sixties revolution}} in law.`},{year:`1968`,label:`Powell's "rivers of blood"`,detail:`Powell is sacked next day; immigration becomes the great divide between elite and popular opinion.`},{year:`1969`,label:`Divorce reform`,detail:`No-fault divorce arrives; the indissoluble marriage ends, and divorce rates climb steeply.`},{year:`1970`,label:`Equal Pay Act`,detail:`Feminism's second wave, sparked partly by the Dagenham strike, reaches the statute book.`},{year:`1976`,label:`Punk`,detail:`The Sex Pistols turn national self-disgust into an export industry.`}]},{t:`argument`,x:`Tombs refuses to referee the sixties. Read one way, the revolution was liberation: from the criminalization of love, the shame of divorce, the tyranny of respectability, the back-street abortionist. Read the other way, it was loss: of community, restraint, and shared moral language, paid for in broken families and coarsened public life. He argues both readings describe the same real events, and that a serious history must hold them together — the English got freer and lonelier in the same twenty years.`},{t:`p`,x:`By the late seventies the cultural revolution was complete but the economic settlement was failing: inflation, strikes, the IMF at the door in 1976, and finally the {{winter-of-discontent|Winter of Discontent}}, with rubbish in the streets and the dead unburied. The {{postwar-consensus|postwar consensus}} had run out of road. Waiting to bury it was a grocer's daughter from Grantham — a Victorian moralist, as it happened, in the first post-Victorian country.`}]},{id:`ch20`,part:7,number:`20`,title:`Storm and Stress`,era:`1979–1997`,blurb:`England in 1979 believed itself finished. The woman who took office that May believed the cure was to force it to compete. Tombs treats these two decades as the hinge of the modern story: {{declinism|declinism}} met its remedy, and the remedy divided the country along the map of who paid and who gained.`,blocks:[{t:`p`,x:`The 1970s ended with England telling itself the darkest story since the war — and this time with no finest hour attached. Inflation had touched 25 per cent. In 1976 a Labour government had to ask the IMF for the largest loan it had ever granted. Then, in the {{winter-of-discontent|winter of 1978–79}}, public-sector strikes left rubbish piled in the streets and, notoriously, the dead unburied in Liverpool. Foreign commentators called Britain "the sick man of Europe", and the British agreed. The {{postwar-consensus|postwar settlement}} — full employment, strong {{trade-unions|unions}}, a managed economy — seemed to be devouring itself.`},{t:`h`,x:`Peak declinism`},{t:`p`,x:`Tombs has argued throughout the later chapters that {{declinism|declinism}} — the conviction that England is a failure in progress — is a recurring national mood, usually far gloomier than the facts. In the late 1970s the mood became orthodoxy. Politicians of both parties took decline as the given; the only argument was over the cure. And this time the mood had something real to feed on: Britain was not shrinking, but its neighbours were overtaking it. West Germans and the French, poorer in 1950, were now visibly richer.`},{t:`widget`,id:`decline-explorer`},{t:`h`,x:`The experiment`},{t:`p`,x:`Margaret {{thatcher|Thatcher}} won the May 1979 election promising to break with everything the consensus held sacred. Her government squeezed inflation with high interest rates and tight budgets — monetarism — and let the consequences fall where they fell. They fell hardest on industry. Factories closed across the Midlands and the north; unemployment passed three million by 1982; riots burned in Brixton and Toxteth in 1981. Her poll ratings sank to the lowest ever recorded for a prime minister.`},{t:`p`,x:`Then, in April 1982, Argentina's junta seized the Falkland Islands. Thatcher sent a task force 8,000 miles down the Atlantic; within ten weeks the {{falklands-war|Falklands War}} was won. The victory transformed her, and — with the {{labour-party|Labour Party}} split by the breakaway SDP — she took a landslide in 1983. The experiment would run its full course.`},{t:`h`,x:`Battles won, and paid for`},{t:`p`,x:`The decisive domestic battle came in 1984–85, when Arthur Scargill led the miners out against pit closures. The {{miners-strike|strike}} lasted a year and failed utterly. Union power — the force that had broken governments in 1974 and 1979 — was broken in turn, and never recovered. Nor did the coalfield villages, whose reason for existing left with the pits. Meanwhile the government sold what the state had owned: gas, telephones, airways, and more than a million council houses, sold to their tenants at a discount. In 1986 the 'Big Bang' deregulated the {{city-of-london|City of London}} overnight, and London roared back as a world financial capital while the old industrial England shrank. A late-eighties boom turned to bust, and inflation and recession returned by 1990.`},{t:`reading`,title:`Why the miners lost`,blocks:[{t:`p`,x:`The strikes of 1972 and 1974 had won because coal stocks were low, the union was united, and governments blinked. In 1984 every condition was reversed. The government had spent years quietly piling up coal at the power stations. The strike began in spring, when demand was falling. And Scargill refused a national ballot, which split his own union: the Nottinghamshire miners kept working, and a rival breakaway union was born. After that the outcome was a matter of time — a year of hardship and picket-line violence, then a return to work with nothing won.`},{t:`p`,x:`Tombs presents the strike as the last battle of an old war, not the first of a new one: the final test of whether organized labour could veto elected government. It could not, and no one has tried since.`}]},{t:`h`,x:`The fall, and the grey aftermath`},{t:`p`,x:`What finished {{thatcher|Thatcher}} was not the opposition but her own party. The poll tax — a flat charge on every adult, replacing the property rates — provoked mass refusal and a riot in Trafalgar Square in March 1990. At the same time her hostility to deeper European integration ('No. No. No.', she told the Commons) drove out her most senior colleagues. In November 1990 her own MPs removed her; she left Downing Street in tears. Her successor, John Major, won an unexpected fourth Conservative victory in 1992 — then lost his reputation in a single afternoon that September, 'Black Wednesday', when the markets forced the pound out of the European exchange-rate mechanism. The economy recovered strongly; the government's standing never did, and the {{european-union|European question}} split the Tories in public for the rest of the decade.`},{t:`p`,x:`Under all of it ran Northern Ireland's Troubles, which killed more than 3,000 people across three decades. The IRA bombed Thatcher's hotel in Brighton in 1984 and mortared Major's cabinet in 1991. Yet secret contacts continued through the worst of it, and under Major they surfaced: the Downing Street Declaration of 1993, then an IRA ceasefire in 1994. When Major left office in May 1997, swept away by a Labour landslide, the road to a settlement lay open — the next chapter's story.`},{t:`timeline`,title:`From sick man of Europe to the eve of New Labour`,events:[{year:`1976`,label:`The IMF loan`,detail:`A Labour chancellor asks the IMF for its largest-ever loan. {{declinism|Declinism}} reaches its zenith.`},{year:`1978–79`,label:`{{winter-of-discontent|Winter of Discontent}}`,detail:`Public-sector strikes bury the government that could not bury the dead.`},{year:`1979`,label:`{{thatcher|Thatcher}} takes office`,detail:`The first woman prime minister, elected to end the {{postwar-consensus|consensus}}.`},{year:`1982`,label:`{{falklands-war|Falklands War}}`,detail:`A ten-week war 8,000 miles away rescues a failing government.`},{year:`1984–85`,label:`The {{miners-strike|miners’ strike}}`,detail:`A year-long struggle ends union power — and the coalfield world with it.`},{year:`1986`,label:`Big Bang in the {{city-of-london|City}}`,detail:`Deregulation restores London as a global financial capital.`},{year:`1990`,label:`Poll tax riot; Thatcher falls`,detail:`Her own MPs remove her in November, after eleven years.`},{year:`1992`,label:`Black Wednesday`,detail:`The pound crashes out of the European exchange-rate mechanism; Tory economic credibility goes with it.`},{year:`1994`,label:`IRA ceasefire`,detail:`After the Downing Street Declaration, the peace process begins in earnest.`}]},{t:`argument`,x:`Thatcherism, for Tombs, was {{declinism|declinism}}'s cure — administered at savage social cost. Economically it worked: by the mid-1990s Britain had stopped falling behind France and Germany and begun catching up, and no later government undid the core changes. Culturally it wounded: it hollowed out industrial England and taught a generation there that government was their enemy. The verdict on the era still divides the English, and the dividing line runs along the map of who paid and who gained — roughly, the old coalfields and mill towns against the south and the suburbs.`},{t:`reading`,title:`Was there really a decline to cure?`,blocks:[{t:`p`,x:`Historians distinguish absolute decline (getting poorer) from relative decline (growing more slowly than your neighbours). Britain never suffered the first: the postwar decades were the fastest growth in its history. It plainly suffered the second, roughly from the 1950s to the 1980s — though some of the gap was simply war-flattened economies catching up. Tombs' point is that the declinist *story* mattered more than the statistics: it justified Thatcher's radicalism, and its harshness, to millions who would otherwise never have accepted either. A milder diagnosis might have produced a milder cure.`}]}]},{id:`ch21`,part:7,number:`21`,title:`Things Can Only Get Better`,era:`1997–c.2014`,blurb:`New Labour promised that things could only get better, and by most measures they did — yet the era closed with the state itself in question. Tombs ends his thousand-year story with an England richer, healthier, and kinder than ever before, and constitutionally voiceless: the one nation of the Union without a parliament, a party, or a settled idea of itself.`,blocks:[{t:`p`,x:`On 2 May 1997 Tony {{blair|Blair}} walked into Downing Street at forty-three, the youngest prime minister since 1812, on a Labour landslide of historic size. The campaign anthem gave the moment its name: things, it insisted, can only get better. For a while everything obliged. 'Cool Britannia' rebranded the country young; when Diana, Princess of Wales, died that August, the flowers piled up in a display of public emotion the reserved English were not supposed to possess. Eighteen years of Conservative rule ended in something close to a festival.`},{t:`h`,x:`A quiet constitutional revolution`},{t:`p`,x:`The new government's changes to the constitution were the biggest since 1911, and came almost without debate. Within a week the Bank of England got control of interest rates. Referendums in 1997 approved {{devolution|devolution}}, and by 1999 Scotland had a parliament and Wales an assembly. The Human Rights Act wrote European rights into English law; most hereditary peers left the Lords; and in 1998 the Good Friday Agreement ended Northern Ireland's thirty-year war, with former enemies eventually sharing power. Tombs notes the anomaly nobody planned: every nation of the Union now had its own voice except the largest. England, the ancient original, was governed as if it did not exist.`},{t:`h`,x:`The good years`},{t:`p`,x:`The economy grew without a break for a decade and a half — the longest boom in modern British history — and after 2000 the government spent the proceeds. Spending on the {{nhs|NHS}} roughly doubled in real terms, waiting lists shrank, school buildings rose, and a minimum wage arrived without the job losses its critics predicted. Immigration ran far higher than ever before, especially after eastern European countries joined the {{european-union|EU}} in 2004. The grandchildren of the {{windrush|Windrush}} generation were now simply English, and London became the most cosmopolitan city on earth. The strains were real too: on 7 July 2005, four bombers — British-born — killed 52 people on London's transport, and the country began an anxious argument about integration and {{britishness|Britishness}} that has not ended.`},{t:`h`,x:`Iraq, and the fall of trust`},{t:`p`,x:`The wound of the era was Iraq. In February 2003 roughly a million people marched through London against the coming war — the largest demonstration in British history. {{blair|Blair}} joined the American invasion anyway, on the strength of intelligence about weapons that turned out not to exist. The war was won in weeks and lost over years of insurgency, and something broke at home that no inquiry repaired: the assumption that a British government, whatever its faults, would not mislead its people into war. Blair handed over to Gordon Brown in 2007 with his party's dominance intact and his reputation gone.`},{t:`h`,x:`Crash, austerity, and the Union in the balance`},{t:`p`,x:`In 2008 the world's banks failed, and Britain — more dependent on the {{city-of-london|City}} than any comparable country — fell hard. The state rescued the banks at colossal cost, the deficit ballooned, and the 2010 election produced the first coalition since the war: Conservatives and Liberal Democrats, governing on a programme of austerity. On the right, UKIP grew from a fringe into a force, feeding on immigration and on resentment of the {{european-union|European Union}}; by 2013 David Cameron had promised an in-or-out referendum. And in September 2014 the United Kingdom itself went to the ballot: Scotland voted on independence, and the Union survived, 55 to 45. The morning after, Cameron stood in Downing Street and raised, at last, the question of England — the point at which Tombs stops writing.`},{t:`timeline`,title:`New Labour to the edge of the Union`,events:[{year:`1997`,label:`{{blair|Blair}} wins a landslide`,detail:`Labour takes a majority of 179; Scotland and Wales vote for {{devolution|devolution}} that autumn.`},{year:`1998`,label:`Good Friday Agreement`,detail:`Northern Ireland’s thirty-year conflict ends in a power-sharing settlement.`},{year:`1999`,label:`Devolved parliaments open`,detail:`Edinburgh and Cardiff get their own voices; most hereditary peers leave the Lords.`},{year:`2003`,label:`Invasion of Iraq`,detail:`Britain joins the American-led war; the missing weapons poison public trust for a generation.`},{year:`2005`,label:`The 7/7 bombings`,detail:`British-born bombers kill 52 in London, sharpening the argument over {{britishness|Britishness}}.`},{year:`2008`,label:`The financial crash`,detail:`The state rescues the banks; the longest boom in modern history ends in the deepest slump since the 1930s.`},{year:`2010`,label:`Coalition government`,detail:`The first peacetime coalition since the 1930s begins the austerity years.`},{year:`2013`,label:`An EU referendum promised`,detail:`Under pressure from UKIP, Cameron pledges an in-or-out vote on {{european-union|Europe}}.`},{year:`2014`,label:`Scotland votes No`,detail:`The Union survives, 55–45 — and the English question becomes unavoidable.`}]},{t:`argument`,x:`Measured against its own long history, Tombs argues, the England of 2014 fails the {{declinism|declinist}} test completely. It was richer, healthier, longer-lived, better educated, more tolerant, and more connected to the world than at any time in its thousand years; even its anxieties — about immigration, inequality, Europe — were the anxieties of success, not collapse. The real deficit was constitutional and psychological. Devolution left England the one nation without a voice; decades of teaching that national feeling is dangerous left the English embarrassed by their own name. A state that has existed for over a millennium had somehow become unsure it was allowed to exist.`},{t:`reading`,title:`The English question`,blocks:[{t:`p`,x:`The problem has a technical name — the West Lothian question, posed in the 1970s: why should Scottish MPs vote on English schools and hospitals when English MPs cannot vote on Scottish ones? {{devolution|Devolution}} made it real. Scotland, Wales, and Northern Ireland gained parliaments and assemblies; England, with 85 per cent of the population, gained nothing, and proposals for English regional assemblies died when the North East rejected one by four to one in 2004. The English, uniquely in Europe, are governed with no institution of their own.`},{t:`p`,x:`Governments answered by promoting {{britishness|Britishness}} — Gordon Brown made speeches about it — while surveys showed people in England increasingly calling themselves English first. Tombs' closing claim is that this mismatch, not economic decline, is the modern English problem: a very old nation, in very good condition, that has mislaid the habit of speaking for itself.`}]}]},{id:`conclusion`,part:8,title:`The English and Their History`,subtitle:`Conclusion`,era:`the long view`,blurb:`Tombs closes by gathering the threads: what fifteen centuries add up to, why the gloomy national self-image is wrong, and what the English question — who speaks for England inside Britain? — now demands.`,blocks:[{t:`p`,x:`The conclusion returns to the question of the introduction — who do the English think they are? — with the whole story now behind it. Three answers organize it. The English are **old**: the state built by {{alfred-the-great|Alfred}}'s heirs has run continuously, under conquerors, usurpers, and parliaments, for over a thousand years. They are **lucky**, in ways they rarely notice: an island moat, early unity, no successful invasion since {{norman-conquest|1066}}, no revolution since {{glorious-revolution|1688}}. And they are **gloomy about themselves** to a degree the record does not support.`},{t:`argument`,title:`Against declinism, one last time`,x:`Set against any long yardstick, England's modern history is a success story: continuously rich, law-governed, and free by world standards; victorious (at ruinous cost) in both world wars; its language, law, and institutions copied worldwide. {{declinism|Declinism}} mistook the end of an abnormal supremacy — the freak windfall of being the {{industrial-revolution|first industrial nation}} — for failure. Bad history, Tombs repeats, makes bad politics: nations that believe they are failing do desperate things.`},{t:`h`,x:`Memory as inheritance and burden`},{t:`p`,x:`The book's second thread also knots here: the English live inside their history whether they know it or not. The {{whig-history|Whig}} epic gave them constitutional self-confidence; {{foxes-martyrs|Foxe}} gave them providential exceptionalism; the {{war-poets|trenches-as-futility}} story gave them irony about power; the {{second-world-war|finest hour}} gave them a standard no later decade could meet — and {{declinism|decline}} was the hangover. Each was a *reading* of events, contestable and contested; each governed behaviour for generations. A people cannot choose to have no myths, only to examine the ones they have.`},{t:`reading`,title:`The English question`,blocks:[{t:`p`,x:`Tombs finishes on the constitutional oddity of his subject. England is the only nation of the United Kingdom without its own parliament or political identity: {{devolution|devolution}} gave Scotland and Wales institutions, while England was governed as if it were simply Britain. With the {{british-empire|empire}} gone — the project that made {{britishness|Britishness}} worth the candle — and the 2014 Scottish referendum exposing the Union's mortality, Englishness has been coming quietly back: in surveys, in flags, in resentments. What it will become, the book — ending in 2014 — leaves open, with a characteristic preference for calm adaptation over panic.`}]},{t:`p`,x:`His final register is neither triumphal nor elegiac but appreciative: a nation with an unusually long, unusually well-documented habit of muddling through, whose gravest modern error would be to believe its own declinist story. The English, he suggests, could do worse than know their history better — not to worship it, but to stop being ruled by the myths that grow where knowledge is missing. It is, deliberately, the moral {{bede|Bede}} would have recognized: the English remain a people constituted by the books they write about themselves.`},{t:`timeline`,title:`The whole story on one spine`,events:[{year:`c.600`,label:`Kingdoms and conversion`,detail:`The {{heptarchy|Heptarchy}}; {{bede|Bede}} imagines "the English".`},{year:`937`,label:`One England`,detail:`{{athelstan|Æthelstan}}'s realm — the state that never since dissolved.`},{year:`1066`,label:`Conquest`,detail:`The elite replaced; the state endures — see {{norman-conquest|the Conquest}}.`},{year:`1215`,label:`Law above the king`,detail:`{{magna-carta|Magna Carta}} plants the constitutional seed.`},{year:`1534`,label:`The Great Divide opens`,detail:`{{reformation-england|Reformation}}: religion becomes the axis of politics for 150 years.`},{year:`1688`,label:`The last revolution`,detail:`{{glorious-revolution|1688}} settles king-in-parliament; the {{fiscal-military-state|fiscal-military state}} follows.`},{year:`c.1780`,label:`The great acceleration`,detail:`The {{industrial-revolution|first industrial nation}} — the abnormal supremacy begins.`},{year:`1940`,label:`The finest hour`,detail:`{{second-world-war|Standing alone}} — the myth every later decade is measured against.`},{year:`2014`,label:`The English question`,detail:`The Scottish referendum ends the book: England, old nation, uncertain state.`}]}]}],Ir={intro:[{q:`Why does Tombs say his subject is "double" — covering not only events but also beliefs about them?`,options:[`Because he writes about both England and Britain in every chapter`,`Because the book alternates between political and economic history`,`Because what the English have believed about their past has itself shaped what they did next`,`Because he compares English history with French history throughout`],answer:2,explain:`For Tombs, myths like the {{norman-yoke|Norman Yoke}} and perpetual {{declinism|decline}} are not just errors — beliefs about the past are causes of later events.`},{q:`Which features does Tombs cite as evidence that a kingdom of the English has existed for over a thousand years?`,options:[`Fixed borders, shires, a single coinage, and national taxation`,`A written constitution, a standing army, and a supreme court`,`A national church, universities, and a capital city`,`Colonies overseas, a navy, and a parliament of two houses`],answer:0,explain:`Claim one of the book is that England is old: {{shire|shires}}, one coinage, and national taxes mark a durable state most European countries cannot match for age.`},{q:`According to the introduction, what lesson did Foxe teach the English, and with what result?`,options:[`That their constitution was the envy of the world, prompting complacency`,`That their greatest war had been futile, prompting withdrawal from Europe`,`That the Normans had stolen their liberty, prompting revolution`,`That they were an elect Protestant nation, and they acted on that belief for three centuries`],answer:3,explain:`The introduction uses {{foxes-martyrs|Foxe}} as a prime case of memory steering policy: the self-image of a chosen Protestant nation guided English action for centuries.`},{q:`How does Tombs explain the "decline" of England since around 1900?`,options:[`As a real collapse caused by losing the empire`,`As mostly an illusion created by other countries catching up`,`As the direct result of two world wars`,`As a consequence of the union with Scotland`],answer:1,explain:`Claim three holds that {{declinism|declinism}} is bad history: England stayed rich, stable, and influential, and its relative slippage reflects others closing the gap.`}],prelude:[{q:`Around which year did Rome withdraw from Britain, telling the Britons to see to their own defence?`,options:[`43`,`410`,`597`,`664`],answer:1,explain:`The legions left around 410, and {{roman-britain|Roman Britain}} collapsed within a generation — harder and faster than almost anywhere else in the empire.`},{q:`Why, on the explanation the chapter offers, did Britain lose Latin, Roman law, and its bishops when Gaul and Spain kept theirs?`,options:[`The Anglo-Saxons deliberately destroyed every Roman institution they found`,`Britain had never been fully Romanized in the first place`,`The church withdrew its clergy along with the legions`,`State collapse was so total that Roman identity lost its prestige, leaving the newcomers' culture dominant`],answer:3,explain:`This "failed continuity" matters to the book: when {{anglo-saxon-england|England}} later built shires and courts, it was building fresh, not inheriting Rome.`},{q:`What irony does Tombs highlight about Arthur as a national hero?`,options:[`If he existed, he fought against the English — yet England adopted him as its own`,`He was invented entirely by the Tudors for propaganda purposes`,`He was actually a Roman general, not a Briton`,`His legend was unknown in England until the Victorians revived it`],answer:0,explain:`The historical kernel is at most a British war-leader who beat the Saxons at Badon; Plantagenet and Tudor courts still claimed him as their imperial ancestor.`},{q:`Why does Tombs call the Dreamtime a "controlled experiment" in national myth-making?`,options:[`Because archaeologists can now test each legend against DNA evidence`,`Because monks recorded the era's myths under strict rules`,`Because with almost no facts to constrain them, the English filled the void with inventions and then acted on them`,`Because every European nation invented exactly the same legends`],answer:2,explain:`Kings claimed empire from Arthur, lawyers claimed immemorial custom, and radicals claimed {{norman-yoke|lost Saxon freedom}} — the same mechanism the book keeps finding in better-documented centuries.`}],ch01:[{q:`What did the Synod of Whitby in 664 decide?`,options:[`That the English kingdoms would unite under one king`,`That pagan worship would be tolerated alongside Christianity`,`That the English church would follow Roman rather than Irish practice`,`That church services would be held in English`],answer:2,explain:`The {{synod-of-whitby|Synod of Whitby}} bound the English church to Rome and the continent, a century before any king ruled all the English.`},{q:`What, for Tombs, was the most consequential effect of Bede's Ecclesiastical History?`,options:[`It treated the scattered kingdoms as one people, "the English", before any king ruled them all`,`It provided the first accurate maps of the island`,`It converted the last pagan kingdoms to Christianity`,`It established York as the seat of the English church`],answer:0,explain:`The nation was imagined before it was built: when {{alfred-the-great|Alfred}} later needed to rally more than his West Saxons, {{bede|Bede}}'s idea of the *Angelcynn* was already on the shelf.`},{q:`What does Tombs take from the fact that Cnut, after conquering England in 1016, changed almost nothing?`,options:[`That the Danes had already adopted English customs before invading`,`That Cnut was too weak a ruler to impose his own system`,`That England was too poor to be worth reorganizing`,`That the English state worked so well it was worth stealing intact`],answer:3,explain:`{{cnut|Cnut}} kept the laws, church, {{shire|shires}}, and taxes, running England as the richest province of a North Sea empire — proof of the system's solidity.`},{q:`In which year did Æthelstan defeat the combined kings of Scots, Strathclyde, and Dublin at Brunanburh?`,options:[`878`,`937`,`865`,`1016`],answer:1,explain:`{{athelstan|Æthelstan}}, Alfred's grandson and the first king of all England, won Brunanburh in 937; the poets remembered it as the greatest of battles.`}],ch02:[{q:`Why does English pair words like cow with beef and sheep with mutton?`,options:[`Because Latin remained the language of cooking after the Conquest`,`Because French was the language of power for three centuries, splitting farmyard words from table words`,`Because Danish settlers in the Danelaw introduced separate food terms`,`Because Tudor printers standardized two vocabularies side by side`],answer:1,explain:`After the {{norman-conquest|Conquest}}, a French-speaking elite ruled English-speaking farmers — the humble animal kept its English name, the elegant dish took a French one.`},{q:`According to the chapter, what made Domesday Book possible?`,options:[`A new census system the Normans imported from France`,`The personal supervision of William across every county`,`Record-keeping borrowed from the church's parish registers`,`The records and machinery of the Anglo-Saxon state the Normans had captured`],answer:3,explain:`The Conquest's most famous artefact was only possible because the {{anglo-saxon-england|Anglo-Saxon state}} kept records no other kingdom had; {{domesday|Domesday}} audited England with English machinery.`},{q:`Tombs says his reading of the Conquest "cuts both ways". Against what two views is it aimed?`,options:[`Against the idea that the Normans civilized a backward island, and against downplaying the real, remembered trauma`,`Against Norman propaganda and against Saxon propaganda in equal measure`,`Against French historians and against English historians`,`Against the church's account and against the crown's account`],answer:0,explain:`The Normans captured Europe's best-run state and were changed by it — yet the trauma was real, and the {{norman-yoke|Norman Yoke}} myth became permanent political furniture.`},{q:`What was the long-term effect of King John losing Normandy in 1204?`,options:[`England immediately invaded France to recover it`,`The crown abandoned its claims to any land in France`,`Barons had to choose estates on one side of the Channel, and within a generation the aristocracy became territorially English`,`The barons deposed John and elected a French prince`],answer:2,explain:`Tombs ends the chapter on defeat as midwife of the nation: {{king-john|John}}'s extortionate bid to win Normandy back then drove his barons to {{magna-carta|Magna Carta}}.`}],int1:[{q:`Where was the Anglo-Saxon Chronicle kept going in English until 1154?`,options:[`Canterbury`,`Jarrow`,`Peterborough`,`Winchester`],answer:2,explain:`Monks at Peterborough continued the Chronicle in English after the {{norman-conquest|Conquest}}, helping {{bede|Bede}}'s invention — a people who understood themselves through history books — survive defeat.`},{q:`What recurring English habit does Tombs say the Norman Yoke myth exemplifies?`,options:[`Blaming foreigners for every domestic failure`,`Presenting reform as restoration — changing things by claiming to change them back`,`Preferring legend to any documented history`,`Treating military defeat as moral victory`],answer:1,explain:`From {{magna-carta|Magna Carta}} to the {{civil-war|Civil War}}, the English cast new demands as old liberties reclaimed; the {{norman-yoke|Norman Yoke}} is the master example.`},{q:`Why did Archbishop Matthew Parker collect Anglo-Saxon manuscripts?`,options:[`To prove a plain, English-minded church predated Rome's grip, making Henry VIII's church a return rather than a rupture`,`To preserve them from destruction in the monastic libraries`,`To trace the royal family's descent from Alfred`,`To compile the first dictionary of Old English`],answer:0,explain:`Tudor antiquarianism was ammunition, not scholarship: Parker's manuscripts argued that {{church-of-england|Henry VIII's church}} restored something ancient, while lawyers like Coke made the same move for the {{common-law|common law}}.`},{q:`What did the 1939 excavation at Sutton Hoo do to the reputation of the early Anglo-Saxon period?`,options:[`It confirmed the Victorian racial theories about the Saxons`,`It proved the burial was Viking rather than English`,`It showed the Anglo-Saxons had preserved Roman institutions after all`,`Its treasures made the "Dark Ages" label absurd, showing a rich, skilled, well-connected society`],answer:3,explain:`The ship burial's gold, garnet, and Byzantine silver showed seventh-century {{anglo-saxon-england|England}} plugged into trade reaching the eastern Mediterranean; one dig overturned a century-old caricature.`}],ch03:[{q:`What was new about the parliament Simon de Montfort summoned in January 1265?`,options:[`It included burgesses from the towns alongside knights of the shires for the first time`,`It met without the king's permission for the first time`,`It was the first assembly to grant a national tax`,`It was the first to meet at Westminster`],answer:0,explain:`Needing support beyond the barons, de Montfort brought ordinary townsmen into a national assembly; he died at Evesham within the year, but kings kept the machine because a {{parliament|parliament}} with commoners raised taxes best.`},{q:`Why did Magna Carta survive rather than becoming a footnote after John repudiated it?`,options:[`The pope enforced it against the English crown`,`The barons held London until the king submitted`,`Every later king swore to it at his coronation`,`It was reissued after John's death, and in 1225 granted in exchange for a tax — fixing the bargain of money for law kept`],answer:3,explain:`The 1225 reissue turned {{magna-carta|Magna Carta}} from a failed peace treaty into something like fundamental law, and the principle of consent to taxation would need {{parliament|Parliament}} to do the consenting.`},{q:`What happened to England's Jewish community in 1290?`,options:[`It was placed under direct royal protection`,`It was confined to designated towns`,`Edward I expelled every Jew from England — the first national expulsion in Europe`,`It was forcibly converted to Christianity`],answer:2,explain:`Having taxed the community without consent and banned its lending, Edward ordered the expulsion; readmission came only after more than 350 years. Tombs notes the bleak logic: a state strong enough to protect rights could strip them from those it excluded.`},{q:`How does Tombs explain why medieval England became so litigious?`,options:[`The church required disputes to be settled in writing`,`Ordinary free men eagerly bought royal writs to pull disputes into the king's courts, and their appetite for law made the state grow`,`Lords forced their tenants into court to collect fines`,`The crown made lawsuits compulsory to raise revenue`],answer:1,explain:`Law was not imposed from above: for a small fee a writ moved a quarrel from the lord's court to the king's, where a {{jury-trial|jury}} decided the facts — so the English sued rather than feuded, and the {{common-law|common law}} grew.`}],ch04:[{q:`Why did serfdom in England disappear between 1350 and 1500?`,options:[`Parliament formally abolished it after the Peasants' Revolt`,`The church declared servile tenure sinful`,`With labour scarce after the plague, serfs could walk to better offers and lords competing for tenants dropped servile dues`,`The crown bought out the lords' rights over their villeins`],answer:2,explain:`{{feudalism|Serfdom}} was never abolished — it evaporated. The Statute of Labourers tried to freeze wages at pre-plague rates and failed against so strong a market.`},{q:`What triggered the Peasants' Revolt of 1381?`,options:[`A third poll tax in four years, flat-rate and so heaviest on the poor`,`A new law binding labourers to their home villages`,`The confiscation of common land by the monasteries`,`A failed harvest and famine across the south-east`],answer:0,explain:`The men of Kent and Essex took {{london|London}} and beheaded the archbishop; the rising was crushed, but the poll tax was dropped and serfdom went on dissolving — they lost the week and won the century.`},{q:`What is Tombs' central claim about the Black Death's effect on English society?`,options:[`It destroyed the constitutional progress of the previous century`,`It changed religious life but left the economy untouched`,`It set England back behind its European rivals for two centuries`,`It was an accelerant: trends already under way — wage labour, English replacing French, Commons bargaining — all sped up`],answer:3,explain:`The disaster that killed perhaps half the English made the survivors richer, freer, and harder to rule; the {{black-death|Black Death}} hastened changes rather than inventing them.`},{q:`What did William Caxton do in 1476?`,options:[`Completed the first full English translation of the Bible`,`Set up England's first printing press, at Westminster`,`Opened Parliament in English for the first time`,`Standardized "Chancery English" for the crown's clerks`],answer:1,explain:`Caxton's press fixed the language in type and sold it by the shelf-load — the capstone of a century in which English took back the country's public life.`}],int2:[{q:`How did Tudor chroniclers like Hall and Holinshed shape the story of the fifteenth century?`,options:[`As a golden age of chivalry ended by Tudor tyranny`,`As a morality tale: Richard II's deposition was a sin, the wars were God's punishment, and the Tudors were providence's rescue`,`As a neutral chronicle compiled from royal records`,`As proof that England should never again fight France`],answer:1,explain:`The new dynasty needed the old century to look terrible; the tidy tale wildly exaggerated how much the {{wars-of-roses|Wars of the Roses}} had disrupted English life.`},{q:`Why does Tombs call Shakespeare "the most influential English historian who ever lived"?`,options:[`Because he worked directly from medieval documents`,`Because his plays were the first histories written in English`,`Because academic historians adopted his interpretations`,`Because his versions of the medieval past displaced the facts, and four centuries of correction have not driven them off the stage`],answer:3,explain:`For most English people the medieval past *is* his production — Richard III the crookback villain, {{henry-v|Henry V}}'s band of brothers at {{agincourt|Agincourt}} — built from sources made to flatter his queen's grandfather.`},{q:`How did the Victorians change the figure of Robin Hood?`,options:[`They turned a yeoman with a grievance into a dispossessed Saxon gentleman robbing the rich for the poor`,`They invented him outright, with no medieval source at all`,`They recast him as a Norman knight loyal to the crown`,`They moved his story from Sherwood to the Scottish borders`],answer:0,explain:`Scott's *Ivanhoe* carried the {{norman-yoke|Norman Yoke}} myth to a mass audience and folded Robin Hood into it — class and conquest retold as greenwood romance.`},{q:`What happened in 2012 that showed the argument over Richard III is still alive?`,options:[`Shakespeare's play was banned from the school curriculum`,`A lost Tudor chronicle exonerating him was discovered`,`His skeleton was dug from under a Leicester car park and later reburied in the cathedral before a global audience`,`Parliament formally pardoned him for the princes' deaths`],answer:2,explain:`Five centuries on, the debate is still with Shakespeare's villain, on ground the playwright chose — which is exactly Tombs' point about drama capturing the medieval past.`}]},Lr={ch05:[{q:`What first drove Henry VIII to break with Rome?`,options:[`Popular demand for reform in the parishes`,`His conversion to Luther's teachings`,`The pope's refusal to annul his marriage to Catherine of Aragon`,`A dispute over church taxes owed to Rome`],answer:2,explain:`With the pope effectively in the power of Catherine's nephew Charles V, no annulment would come — so {{henry-viii|Henry}} made himself Supreme Head of the {{church-of-england|Church of England}} instead.`},{q:`Which of these events came first?`,options:[`The Act of Supremacy`,`The dissolution of the monasteries`,`The first Book of Common Prayer`,`The defeat of the Spanish Armada`],answer:0,explain:`The Act of Supremacy (1534) made the break with Rome law; the {{dissolution-monasteries|dissolution}} followed in 1536–40, the prayer book in 1549, and the {{spanish-armada|Armada}} in 1588.`},{q:`How does Tombs characterize the English Reformation?`,options:[`A popular uprising against a corrupt and dying church`,`A change imposed from above on a devout and largely reluctant nation`,`A gradual drift that few people at the time noticed`,`A compromise carefully negotiated between king and pope`],answer:1,explain:`Tombs sides with the revisionists: the old religion was healthy and loved, and the {{reformation-england|Reformation}} stuck through obedience, property, and time before conviction followed.`},{q:`What role did Foxe's Book of Martyrs play in Elizabethan England?`,options:[`It made the case for tolerating Catholic worship`,`It recorded the destruction of the monasteries`,`It served as Elizabeth's official prayer book`,`It taught the English to see themselves as an elect nation persecuted by Rome`],answer:3,explain:`Chained in churches beside the Bible, {{foxes-martyrs|Foxe}}'s accounts of the Marian burnings fed the {{anti-popery|anti-popery}} that fused Protestantism with Englishness.`}],ch06:[{q:`What kind of conflict does Tombs say the Civil War really was?`,options:[`A bourgeois revolution of rising merchants against a feudal order`,`The last and worst of the wars of religion set off by the Reformation`,`A constitutional dispute that had been inevitable for centuries`,`A dynastic quarrel between rival branches of the royal family`],answer:1,explain:`Tombs rejects class readings of the {{civil-war|Civil War}}: gentry, merchants, and counties split down the middle, and religion did the sorting.`},{q:`What brought Charles I's eleven years of rule without Parliament to an end?`,options:[`Defeat by the New Model Army at Naseby`,`The discovery of the Gunpowder Plot`,`A Catholic rising in Ireland`,`A Scottish revolt against the prayer book he imposed`],answer:3,explain:`Forcing an English-style liturgy on the Presbyterian Scots in 1637 raised a Covenanter army; beaten and bankrupt, {{charles-i|Charles}} had to recall Parliament in 1640.`},{q:`Where did the party names Whig and Tory come from?`,options:[`They began as insults during the crisis over excluding James from the throne`,`They were old nicknames for the two houses of Parliament`,`They named rival factions within the New Model Army`,`Cromwell coined them to mock his opponents`],answer:0,explain:`The exclusion crisis of 1679–81 created the first parties, and the {{whigs-tories|Whig and Tory}} duel structured English politics for two centuries.`},{q:`What happened in June 1688 that pushed seven notables to invite William of Orange to intervene?`,options:[`James II marched into the Commons to arrest five members`,`Bishops were executed for petitioning against royal policy`,`The queen bore a son, making a Catholic dynasty likely forever`,`James suspended Parliament and doubled the standing army`],answer:2,explain:`Until then the nation could wait for {{james-ii|James}}'s Protestant daughter Mary to inherit; a male heir ended that hope, and {{william-iii|William}} landed at Torbay months later.`}],int3:[{q:`How did Clarendon's History of the Rebellion explain the Civil War?`,options:[`As a tragedy brought on by the follies and passions of particular men`,`As the unavoidable working of grand historical forces`,`As a class struggle between gentry and merchants`,`As divine punishment for the nation's sins`],answer:0,explain:`Writing in exile, {{charles-i|Charles I}}'s adviser set a very English template: history as the study of persons, not systems.`},{q:`Why does Tombs think the Whig legend of 1688 mattered even though it was bad history?`,options:[`It kept the monarchy popular through the Victorian age`,`It settled the scholarly debate over the Civil War's causes`,`Statesmen who believed English history meant gradual reform felt obliged to keep it that way`,`It justified excluding Nonconformists from civic life`],answer:2,explain:`The story of moderation manufactured moderation: reformers could demand change as restoration, conservatives concede it as continuity — one reason, Tombs suggests, England never had a 1789.`},{q:`Who named the "Whig interpretation of history" as a fallacy in 1931?`,options:[`Thomas Carlyle`,`Eamon Duffy`,`Thomas Macaulay`,`Herbert Butterfield`],answer:3,explain:`Butterfield attacked the habit of reading the past as a march toward the present; Marxists and then revisionists demolished the {{whig-history|Whig}} story in turn.`},{q:`What happened to Cromwell's reputation in the nineteenth century?`,options:[`Parliament formally condemned him a second time`,`Nonconformists rehabilitated him, and his statue rose outside Parliament in 1899`,`He was forgotten until Marxist historians revived him`,`Irish protests succeeded in blocking any public memorial`],answer:1,explain:`To the heirs of the {{puritans|Puritans}}, {{oliver-cromwell|Cromwell}} was a hero of conscience against persecution; Ireland, which remembered Drogheda, was not consulted.`}],ch07:[{q:`The chapter title "And All Was Light" echoes what?`,options:[`Locke's Letter Concerning Toleration`,`The motto of the Royal Society`,`Addison's description of the Royal Exchange`,`Pope's epitaph for Newton`],answer:3,explain:`Pope had God say "Let Newton be" to end nature's night — catching the confidence that Newton's Principia gave the English {{enlightenment|Enlightenment}}.`},{q:`Why, in Tombs' account, was the English Enlightenment establishment-friendly rather than subversive?`,options:[`Strict censorship kept radical ideas out of print`,`England had already had its revolution, so writers lived under a limited crown and a tolerant church`,`The Church of England paid the salaries of the leading writers`,`English thinkers deliberately avoided political subjects`],answer:1,explain:`French philosophers had absolutism and intolerance to attack; English {{enlightenment|enlightenment}} meant improvement — better farming, manners, and pumps — not subversion.`},{q:`How did England come to have the freest press in the world?`,options:[`Parliament simply let the press licensing law lapse in 1695`,`The Bill of Rights guaranteed freedom of the press`,`The courts struck censorship down as against common law`,`Charles II abolished licensing at the Restoration`],answer:0,explain:`Almost by accident, {{parliament|Parliament}} declined to renew licensing; daily papers, pamphlet wars, and journals like the Spectator followed.`},{q:`What happened in 1738 that launched the century's great popular religious movement?`,options:[`The Spectator began its campaign for politeness`,`Hogarth published Gin Lane`,`John Wesley underwent the conversion that began Methodism`,`The Church of England authorized preaching in the open air`],answer:2,explain:`Wesley felt his heart "strangely warmed" and took the result outdoors; {{methodism|Methodism}} reached the miners and weavers whom politeness overlooked.`}],ch08:[{q:`How did juries blunt the Bloody Code's roughly two hundred hanging offences?`,options:[`By refusing to convict anyone of crimes against property`,`By petitioning Parliament to repeal the capital statutes`,`By valuing stolen goods at just under the fatal threshold`,`By insisting that all capital cases be retried in London`],answer:2,explain:`Through "pious perjury", low charges, and reprieves, executions never matched the statute book; Tombs reads the {{jury-trial|jury}} as a working everyday check on the state.`},{q:`What meaning did people take from Somerset's case of 1772?`,options:[`That slavery had no home on English soil`,`That the slave trade was now illegal across the empire`,`That enslaved people in the colonies had been freed`,`That press gangs could no longer seize seafaring men`],answer:0,explain:`Mansfield's ruling was narrow — a master could not ship an enslaved man out of England — but the meaning read into it for {{atlantic-slavery|slavery}} was vast.`},{q:`In which years did the two great Jacobite risings for the exiled Stuarts take place?`,options:[`1689 and 1701`,`1705 and 1720`,`1721 and 1742`,`1715 and 1745`],answer:3,explain:`The Fifteen failed quickly; the Forty-five reached Derby before ending at Culloden, after which the {{jacobites|Jacobites}}' Highland base was brutally pacified.`},{q:`How, in Tombs' account, did the English understand their liberty?`,options:[`As abstract rights deduced from first principles`,`As a bundle of inherited possessions defended as ancestral property`,`As privileges granted by the crown and revocable at will`,`As rights belonging equally to everyone in the empire`],answer:1,explain:`Jury trial, habeas corpus, and the free press were held like heirlooms, with {{magna-carta|Magna Carta}} as the title deed — real and rowdy, yet compatible with oligarchy and the Bloody Code.`}],ch09:[{q:`Why was 1759 remembered as the "year of victories"?`,options:[`Plassey made the East India Company the power in Bengal`,`Britain beat France at Minden, Quebec, and Quiberon Bay in a single year`,`The Peace of Paris confirmed British control of Canada`,`A French invasion fleet was scattered in the Channel`],answer:1,explain:`Pitt's global strategy — subsidize allies, let the {{royal-navy|Royal Navy}} strip France of empire — broke French power on three continents; bells were joked to be worn threadbare.`},{q:`What turned the American rebellion into a British defeat?`,options:[`The loyalist fifth of the colonists switched sides`,`Parliament refused to keep funding the war`,`A mutiny paralysed the Royal Navy`,`France and the Bourbon powers joined the war after Saratoga`],answer:3,explain:`Britain then fought a world war with no allies; in 1781 a French fleet held Chesapeake Bay and Cornwallis surrendered at Yorktown.`},{q:`What lesson does Tombs draw from the loss of the American colonies?`,options:[`That empires always collapse from overexpansion`,`That Britain never recovered its standing among the powers`,`That the real national asset was the machine of credit, navy, and taxes, not the colonies`,`That taxing colonies without representation could have worked with more patience`],answer:2,explain:`Trade with independent America soon passed colonial levels and the {{fiscal-military-state|fiscal-military state}} absorbed the debt; the colonies were lost, but the system that won them was not.`},{q:`What is the current scholarly verdict on Eric Williams's claim that slave profits financed industrialization?`,options:[`The gains were larger and more widely spread than sceptics allowed, but not the engine of the whole transformation`,`Williams's thesis has been vindicated in every particular`,`Slavery contributed nothing measurable to British investment`,`Industrialization was funded almost entirely by colonial taxation`],answer:0,explain:`Recent work lands between Williams and his critics; Tombs states the crime of {{atlantic-slavery|slavery}} plainly while refusing a single-cause story of the {{industrial-revolution|Industrial Revolution}}.`}]},Rr={ch10:[{q:`In which year did Stephenson's locomotive win the Rainhill trials?`,options:[`1815`,`1829`,`1840`,`1851`],answer:1,explain:`The *Rocket* triumphed at Rainhill in 1829, and the Liverpool and Manchester line — the first all-steam passenger railway — opened the following year.`},{q:`What development freed factories from having to sit beside a river?`,options:[`The spread of hand-dug canals`,`Smelting iron with coke instead of charcoal`,`Watt's improved steam engine`,`Arkwright's water frame`],answer:2,explain:`Watt's engine, improved from the 1770s, turned coal into motion — so a mill no longer needed water power and a mine no longer drowned.`},{q:`How does Tombs characterize the origins of the {{industrial-revolution|Industrial Revolution}} in England?`,options:[`Gradual, homegrown, and unplanned — driven by obscure practical men`,`A deliberate program directed by statesmen and Parliament`,`The application of new scientific theory by university men`,`A sudden leap sparked by one or two strokes of genius`],answer:0,explain:`Tombs stresses tinkering over theory: chains of small fixes by millwrights, clockmakers, and ironmasters, with no government plan behind them.`},{q:`What did the census of 1851 record that no census anywhere had shown before?`,options:[`A population that had doubled within fifty years`,`More people employed in factories than on farms`,`A majority of adults able to read and write`,`A majority of the population living in towns and cities`],answer:3,explain:`England became the first society counted as majority-urban, the same year the Great Exhibition displayed the workshop of the world in Hyde Park.`}],ch11:[{q:`Why does Tombs call the conflicts of 1793–1815 "wars of dreams"?`,options:[`Because invasion scares gave England recurring national nightmares`,`Because both sides fought far beyond their real resources`,`Because both sides fought for a vision of what the world should be, not for a province`,`Because the war aims changed with every new coalition`],answer:2,explain:`France offered Europe a rational new order at bayonet-point; England stood for inherited law, parliaments, and commerce — each fighting for the future of mankind.`},{q:`What did Burke's *Reflections* predict about the French Revolution while it was still moderate?`,options:[`That it would end in confiscation, terror, and a military dictator`,`That it would spread peacefully across the rest of Europe`,`That England would be forced to adopt a written constitution`,`That France would restore its king within a decade`],answer:0,explain:`Burke argued that rebuilding society from abstract first principles must end badly — and events proved him right about the Terror and the general, even though Paine's *Rights of Man* outsold him many times over.`},{q:`When was the income tax first introduced, and by whom?`,options:[`1789, by Fox`,`1798, by Pitt`,`1805, by Nelson's government`,`1815, after Waterloo`],answer:1,explain:`Pitt taxed large incomes at ten per cent in 1798, sold as a temporary wartime expedient — part of the {{fiscal-military-state|fiscal-military state}}'s power to outspend Napoleon.`},{q:`What was the lasting consequence of Nelson's victory at {{trafalgar|Trafalgar}} in 1805?`,options:[`Napoleon abandoned the Continental System`,`France sued for an immediate peace`,`Spain switched sides to join Britain`,`Invasion became impossible and England held naval supremacy for a century`],answer:3,explain:`Destroying the combined French and Spanish fleets closed the sea to invasion and opened the era of unchallenged British sea power that led to the {{pax-britannica|Pax Britannica}}.`}],ch12:[{q:`What were the {{corn-laws|Corn Laws}} of 1815 designed to do?`,options:[`Guarantee cheap bread for demobilized soldiers`,`Encourage grain imports to feed the growing cities`,`Keep grain prices, and therefore landowners' rents, high`,`Stockpile grain against a renewed French war`],answer:2,explain:`A Parliament of landowners made cheap bread effectively illegal to protect its own rents — the symbolic grievance of the age until repeal in 1846.`},{q:`In which year did yeomanry charge the peaceful reform meeting remembered as Peterloo?`,options:[`1815`,`1819`,`1830`,`1832`],answer:1,explain:`Around fifteen died on St Peter's Field, Manchester, in August 1819; the bitter nickname stuck and gave English radicalism its founding martyrs.`},{q:`How did the {{great-reform-act|Great Reform Act}} finally pass in 1832?`,options:[`The king agreed, if necessary, to create enough new peers to swamp the Lords`,`The Lords backed down after Bristol burned`,`A general election returned an unstoppable reform majority`,`The Commons threatened to withhold all taxation`],answer:0,explain:`The royal promise broke the Lords' resistance after a crisis that brought England as near revolution as it has come in modern times; the Act itself enfranchised only about one adult man in five.`},{q:`What does Tombs argue is missing from the familiar picture of {{dickensian-england|Dickensian England}}?`,options:[`Evidence that the horrors of the slums were exaggerated by novelists`,`Recognition that conditions were worse in the countryside than the towns`,`The role of the state in planning industrial growth`,`The unprecedented machinery of inspection, publication, and reform that fixed the abuses`],answer:3,explain:`The misery was old — hunger, filth, child labour made newly visible — but the response was new: Blue Books, paid factory inspectors, and public health acts. We kept Dickens' caricatures and forgot the repair.`}],ch13:[{q:`Which two books, published in the same year, embodied the era's twin currents of doubt and self-improvement?`,options:[`Burke's *Reflections* and Paine's *Rights of Man*`,`Chadwick's sanitary report and *Oliver Twist*`,`Darwin's *On the Origin of Species* and Smiles' *Self-Help*`,`Macaulay's *History of England* and the People's Charter`],answer:2,explain:`Both appeared in 1859: Darwin unsettled educated believers while Smiles preached thrift and self-improvement to a congregation as much working-class as middle-class.`},{q:`Who carried the {{second-reform-act|Second Reform Act}} of 1867, and what did it do?`,options:[`{{disraeli|Disraeli}} — it enfranchised urban working men and roughly doubled the electorate`,`{{gladstone|Gladstone}} — it introduced the secret ballot`,`Peel — it abolished the remaining rotten boroughs`,`Chamberlain — it gave the vote to county householders`],answer:0,explain:`Disraeli outbid the Liberals for the credit of the "leap in the dark"; Gladstone's act of 1884 later extended the same household franchise to the counties.`},{q:`What development gave birth to {{declinism|declinism}} in the 1890s?`,options:[`The collapse of the railway companies`,`Germany and the United States overtaking England in steel and the new industries`,`The failure of the 1884 franchise reform`,`A sharp fall in Victorian church attendance`],answer:1,explain:`The change was arithmetic normality — a small island could not out-produce continents forever — but the English read it as failure and went hunting for culprits, a habit of mind that stuck.`},{q:`How, in Tombs' account, was Victorian England chiefly governed?`,options:[`By a rapidly expanding Whitehall bureaucracy`,`By the monarchy's direct intervention in politics`,`By the police and the standing army`,`By voluntary institutions and moral consensus more than by the state`],answer:3,explain:`Chapel and church, unions and friendly societies, town halls and charities did work that elsewhere fell to bureaucracies — which is why so small a state could preside over so orderly a society.`}],ch14:[{q:`What is Tombs' contested claim about the {{british-empire|empire}}'s place in English life?`,options:[`That it was the main engine of England's industrial wealth`,`That it loomed smaller in ordinary English life than nostalgists and critics assume`,`That the English cared about it more deeply than any other nation cared for its colonies`,`That it was planned and directed from London from the start`],answer:1,explain:`Tombs argues the empire was acquired piecemeal, run cheaply by a few thousand officials, and regarded with chronic doubt at home — though many historians think he understates its influence.`},{q:`What changed in the government of India after the {{indian-rebellion|Indian Rebellion}} of 1857?`,options:[`India received self-government on the settler-colony model`,`The Indian Army was disbanded`,`The Crown took over direct rule from the {{east-india-company|East India Company}}`,`British taxpayers assumed the cost of Indian administration`],answer:2,explain:`The rebellion ended Company rule; the {{british-raj|Raj}} that followed rested on a few thousand British officials governing some 300 million people, largely through Indian intermediaries.`},{q:`What domestic panic followed the Boer War of 1899–1902?`,options:[`A "national efficiency" scare, after recruiters found many city volunteers too stunted and sickly to serve`,`A run on the banks caused by the war's cost`,`A movement to abandon the African colonies entirely`,`A mutiny among troops returning from the camps`],answer:0,explain:`The fear that the imperial race was rotting at its urban core fed social reform, compulsory school meals, and much anxious talk of decline.`},{q:`According to the chapter, who paid for the Indian Army?`,options:[`The British Treasury, through the defence budget`,`The {{city-of-london|City of London}}, through special loans`,`The settler dominions, through imperial contributions`,`Indian taxpayers`],answer:3,explain:`Empire defence was startlingly cheap for Britain — the Navy took a small share of national income and India funded its own army — which is why whether the average English family gained from empire is genuinely doubtful.`}],int4:[{q:`How did {{macaulay|Macaulay}}'s *History of England* present the English past?`,options:[`As a tragic decline from Saxon liberty under the {{norman-yoke|Norman Yoke}}`,`As a chaotic story with no discernible direction`,`As a steady, providential march from despotism to liberty, with 1688 as the hinge`,`As a warning that English freedoms could be lost within a generation`],answer:2,explain:`This was {{whig-history|Whig history}} at its most seductive — superb storytelling and dubious history, and the Victorians could not get enough of it.`},{q:`What does Tombs argue about the "village England" of thatch, hedgerow, and church spire?`,options:[`It was a myth manufactured by townsmen, with a long and consequential afterlife`,`It accurately described how most English people still lived`,`It was invented by foreign admirers of England`,`It faded quickly once the garden cities were built`],answer:0,explain:`The rural myth shaped town planning, poetry, war memorials, and the green belt — teaching an industrial people to feel their real nation lay somewhere they did not live.`},{q:`What is paradoxical about the moment Englishness "went rural" around 1900?`,options:[`Farming had just become England's most profitable industry`,`England was then the most urbanized society on earth`,`The countryside was emptying because of famine`,`The government was actively demolishing villages`],answer:1,explain:`The {{industrial-revolution|Industrial Revolution}} had made England the first majority-urban nation two generations earlier — yet precisely then the countryside became England's idea of itself.`},{q:`What habit of speech does the interlude note about "English" at the empire's height?`,options:[`It was reserved strictly for people born in England`,`It was avoided in favour of regional labels like Yorkshireman`,`It was used mainly by foreigners, rarely by the English themselves`,`It simply stood for "British", with England as the unexamined default`],answer:3,explain:`Scots, Welsh, and Irish careers were made under the wider label of {{britishness|Britishness}}, while England needed no flag or anthem of its own — a confidence that would look very different once the Union came into question.`}]},zr={ch15:[{q:`What supplied the legal trigger for Britain's declaration of war on 4 August 1914?`,options:[`A German attack on the Royal Navy`,`France invoking a defensive alliance`,`Germany's invasion of Belgium, whose neutrality Britain had guaranteed`,`The assassination of Archduke Franz Ferdinand`],answer:2,explain:`Britain had guaranteed Belgian neutrality since 1839, though the deeper motive was the old rule that no single power should dominate the continent and its Channel coast.`},{q:`Which event stands as the worst single day in British military history?`,options:[`The first day of the {{somme|Somme}}, 1 July 1916`,`The landings at {{gallipoli|Gallipoli}} in 1915`,`The opening of Passchendaele in 1917`,`The German spring offensive of March 1918`],answer:0,explain:`The new volunteer army took some 57,000 casualties, about 19,000 of them dead, on the {{somme|Somme}}'s opening day — the centre of all later memory of the war.`},{q:`How does Tombs characterize Britain's decision to fight in 1914?`,options:[`As sleepwalking into a needless catastrophe`,`As the least-bad option facing men who roughly understood the cost`,`As folly driven by imperial ambition`,`As a choice forced on Britain by public opinion`],answer:1,explain:`Tombs argues that standing aside would have delivered Europe to a militarist Germany and left Britain isolated — the "pointless war" verdict must answer: pointless compared to what?`},{q:`What political change accompanied victory in 1918?`,options:[`The first Labour government took office`,`Ireland was granted immediate independence`,`Women won the vote on identical terms to men`,`The {{fourth-reform-act|Fourth Reform Act}} tripled the electorate`],answer:3,explain:`The Act gave the vote to all adult men and, with a household qualification, most women over thirty — the political payment for a people's war, and a door for the {{labour-party|Labour party}}.`}],ch16:[{q:`According to Tombs, how did England react when most of Ireland left the United Kingdom in 1921–22?`,options:[`With a campaign to reverse the treaty`,`With striking indifference`,`With widespread public mourning`,`With riots in the industrial cities`],answer:1,explain:`The Union of 1801 dissolved with barely an English tear — the ending the {{irish-home-rule|Home Rule}} wars of Victorian politics had tried to avoid.`},{q:`How did the {{general-strike|General Strike}} of 1926 end?`,options:[`In a violent confrontation with the army`,`With the government conceding the miners' demands`,`In the fall of Baldwin's government`,`Peacefully after nine days, with the TUC backing down`],answer:3,explain:`Volunteers drove buses, both sides congratulated themselves on avoiding a revolution neither wanted, and the strike ended without bloodshed.`},{q:`What is Tombs' verdict on the interwar "wasted years" label?`,options:[`Half-wrong: cruel in the industrial North, but the biggest rise in living standards yet for most families`,`Entirely deserved, given mass unemployment`,`Entirely mistaken, since even the North prospered`,`Unanswerable, because the evidence is too thin`],answer:0,explain:`The Depression genuinely devastated the North, but real wages, diet, housing, and leisure improved more in these two decades than in any before them; Orwell's Wigan Pier was the tragic part, not the whole.`},{q:`What finally convinced British opinion that Hitler had to be stopped rather than accommodated?`,options:[`The Munich agreement of September 1938`,`German rearmament in the mid-1930s`,`Hitler's seizure of Prague in March 1939`,`The invasion of Poland in September 1939`],answer:2,explain:`Taking Prague settled the argument that this was an appetite, not a grievance: Britain guaranteed Poland, and {{appeasement|appeasement}} was over in all but name.`}],ch17:[{q:`Roughly how many men were evacuated from {{dunkirk|Dunkirk}} in 1940?`,options:[`338,000`,`43,000`,`120,000`,`720,000`],answer:0,explain:`The navy and a famous flotilla of small boats lifted roughly 338,000 men off the beaches — but the army left its equipment behind, and invasion loomed.`},{q:`In the War Cabinet argument of late May 1940, what did Lord Halifax propose?`,options:[`An immediate surrender to Germany`,`A counter-offensive to relieve the army in France`,`Exploring peace terms through Mussolini`,`Evacuating the government to Canada`],answer:2,explain:`{{churchill|Churchill}} argued that any negotiation would destroy the will to resist, and won by appealing past Halifax to the wider Cabinet — a genuine decision that could have gone the other way.`},{q:`Why does Tombs say the "finest hour" story passes the test that most national myths fail?`,options:[`Because Britain defeated Germany without allies`,`Because the myth was created during the war itself`,`Because British losses were lighter than Germany's`,`Because the danger, the defiance, and the world-historical consequences were all real`],answer:3,explain:`By refusing terms in 1940, England denied Hitler a settled victory and kept the war open until Russia and America could be drawn in — the event needs no embroidery.`},{q:`What was the political consequence of the wartime home front that Tombs highlights?`,options:[`A revival of the Liberal party`,`The {{labour-party|Labour}} landslide of 1945, prepared by the Beveridge Report and shared wartime sacrifice`,`A permanent wartime coalition`,`The abolition of rationing at the war's end`],answer:1,explain:`The 1942 Beveridge Report promised to slay the "five giants" and became the blueprint of the {{welfare-state|welfare state}}; if the state could organize total war, why not health care and full employment?`}],int5:[{q:`When, according to Tombs, was the "futility" memory of the {{first-world-war|First World War}} largely built?`,options:[`During the war itself, 1916–18`,`Immediately after the armistice in 1918`,`In the 1960s, around the {{somme|Somme}}'s fiftieth anniversary`,`After the Second World War began in 1939`],answer:2,explain:`*Oh! What a Lovely War* and a school canon that crowned the {{war-poets|war poets}} fixed the mud-and-donkeys picture decades after most English people had seen the war as tragic but necessary.`},{q:`Which crisis does Tombs cite as an early misuse of the {{munich|Munich}} "never appease" lesson?`,options:[`The Falklands conflict`,`Eden casting Nasser as a new dictator at {{suez-crisis|Suez}} in 1956`,`The Kosovo intervention`,`The invasion of Iraq`],answer:1,explain:`Munich became the all-purpose foreign-policy template; Eden reached for it first at Suez, and later leaders reused it over the Falklands, Kosovo, and Iraq.`},{q:`What is the central methodological claim of this interlude?`,options:[`Memory is not history: it is selective, moralized, and politically active`,`Oral memory is more reliable than written records`,`National myths should be abolished by better schooling`,`The world wars are too recent to be studied historically`],answer:0,explain:`History tries to explain the past on its own terms; memory ransacks it for lessons, comfort, and blame — and in postwar England the memories of 1914–45 became the strongest political forces in the country.`},{q:`What did the military historian Gary Sheffield argue about the British army of 1918?`,options:[`That it was a machine for wasting lives`,`That its victories were owed entirely to American troops`,`That it should never have fought on the Western Front`,`That it was a formidable, learning institution that won the greatest victories in its history`],answer:3,explain:`Tombs sides broadly with such revisionists on the facts — but notes that the ongoing battle over the trenches proves his deeper point: it was never only about the trenches.`}],ch18:[{q:`Why, in Tombs' telling, did voters dismiss {{churchill|Churchill}} in July 1945?`,options:[`They blamed him for the length of the war`,`They objected to his conduct of foreign policy`,`A press campaign turned opinion against him`,`They remembered the 1930s and wanted the wartime state to organize the peace`],answer:3,explain:`It was memory, not ingratitude: the electorate had read its Beveridge and gave {{attlee|Attlee}}'s {{labour-party|Labour Party}} its first majority.`},{q:`In which year was the {{nhs|NHS}} launched, free at the point of use?`,options:[`1945`,`1948`,`1951`,`1954`],answer:1,explain:`It began in July 1948, over the doctors' fierce resistance, the same year the *Empire Windrush* docked at Tilbury with the first of the {{windrush|Windrush}} generation.`},{q:`What halted the Anglo-French seizure of the canal at {{suez-crisis|Suez}} in 1956?`,options:[`Defeat by the Egyptian army`,`A Soviet ultimatum threatening war`,`American financial pressure`,`A revolt within Eden's cabinet`],answer:2,explain:`Washington stopped the operation in days, and everyone saw the machinery: Britain could no longer act as a first-rank power against American wishes.`},{q:`What does Tombs argue about postwar "decline"?`,options:[`It was re
